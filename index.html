去中天公司推销他们的财务软件，并让对方接受。", "人物2：中天公司的财务处李主任。任务：接待小张，并商谈目前财务软件的更新。因为有好几家公司都来找他，所以他不会轻易接受，但是最后一定要选一个公司的软件。", "角色扮演：和你的同学分别扮演上面的两个人物，模拟真实场景展开对话。"]}, {"type": "open", "title": "七、写作", "intro": "", "bank": [], "items": ["请帮吴经理设计一张名片，并且根据名片的内容向其他同学简要地介绍一下吴经理。"]}]}, {"id": 6, "title": "日程安排", "daodu": ["总经理让你帮忙安排他的日程，你应该怎么安排？", "怎样才能更好地来管理自己的时间？"], "hexinjv": ["什么演出不演出的就算了吧。", "连同今年的销售汇总表一起交上来。", "宁可多加加班，也要把工作做完。", "虽然人人都知道时间很重要，但是如何管理时间却往往为人们所忽视。"], "duihua": {"intro": "王中向吴云汇报工作。", "lines": [{"speaker": "吴经理", "text": "我下周三要去上海参加展销会，你帮我预订好机票了吗？"}, {"speaker": "小王", "text": "您放心，我已经帮您预订了下周三上午北京飞上海的机票。另外，您在上海的行程我也已经安排好了。"}, {"speaker": "吴经理", "text": "那好，你说说吧。"}, {"speaker": "小王", "text": "是这样的，第一天上午参加会议，下午听他们介绍企业文化，晚上参加商务宴会。第二天上午和三立公司进行商务谈判，下午在友谊宾馆与天乐公司的销售经理会面，晚上他们还想请您看一场演出。第三天您乘坐飞机返回北京。您看这么安排可以吗？"}, {"speaker": "吴经理", "text": "安排得太满了，我根本没办法和三立公司充分讨论两家公司合作的事情，你看看能否取消一些不必要的活动，什么演出不演出的就算了吧。"}, {"speaker": "小王", "text": "好的，我调整一下日程再请您过目，另外也会通知天乐公司。"}, {"speaker": "吴经理", "text": "可以。我参会需要的文件准备好了吗？"}, {"speaker": "小王", "text": "我已经通知各小组预先准备了。这是我们部门今年的销售报表。我已经把主要的问题和重要的数据整理好了。"}, {"speaker": "吴经理", "text": "（翻看汇总表）今年销售总额有所提高，但个别产品的销售量下滑得很厉害啊！对了，咱们部门的年度报告交上来了吗？"}, {"speaker": "小王", "text": "各小组都还在努力。"}, {"speaker": "吴经理", "text": "我要在这次展销会上报告咱们公司的销售业绩，告诉大家在下周一之前连同今年的销售汇总表一起交上来，宁可多加加班，也要把工作做完。"}, {"speaker": "小王", "text": "好的。"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "intro": "", "bank": [], "items": [{"text": "吴经理需要的文件都已经按时提交了。", "answer": false}, {"text": "小王还没预订好吴经理下周去上海的机票。", "answer": false}, {"text": "吴经理对小王下周安排的日程很满意。", "answer": false}, {"text": "他们部门不仅销售总量增长了，各个产品单独的销售量也有增长。", "answer": false}, {"text": "吴经理去上海要与三个公司进行商务谈判。", "answer": false}, {"text": "吴经理打算在展销会上介绍自己公司的销售情况。", "answer": true}]}], "duihua_shengci": [{"word": "汇报", "pos": "动词、名词", "def": "向上级机关报告工作、反映情况、提出意见或者建议", "pinyin": "huì bào"}, {"word": "展销", "pos": "动词", "def": "通过展示的方式来销售产品", "pinyin": "zhǎn xiāo"}, {"word": "预订", "pos": "动词", "def": "提前订购", "pinyin": "yù dìng"}, {"word": "行程", "pos": "名词", "def": "日程", "pinyin": "xíng chéng"}, {"word": "谈判", "pos": "动词", "def": "双方对大家共同关心的问题互交换意见，寻找解决的办法并形成共同观点的过程", "pinyin": "tán pàn"}, {"word": "取消", "pos": "动词", "def": "停止计划", "pinyin": "qǔ xiāo"}, {"word": "预先", "pos": "副词", "def": "事情发生或进行之前", "pinyin": "yù xiān"}, {"word": "报表", "pos": "名词", "def": "报告情况的表格", "pinyin": "bào biǎo"}, {"word": "数据", "pos": "名词", "def": "科学实验、统计等所获得的和用于科学研究、技术设计等的数值", "pinyin": "shù jù"}, {"word": "报告", "pos": "动词", "def": "用书面或者口头的形式向上级说明自己的工作", "pinyin": "bào gào"}, {"word": "业绩", "pos": "名词", "def": "成绩", "pinyin": "yè jì"}, {"word": "汇总", "pos": "动词", "def": "把各种材料或情况汇集到一起", "pinyin": "huì zǒng"}], "duihua_yuyandian": [{"num": "1", "sentence": "你帮我预订好机票了吗？", "explanation": ["“预”，事先、提前的意思，也可以和“先”连用组成新词，意思不变，同时也常常和单字动词连用，表示提前做什么事。", "预先、预订、预定、预约、预报、预防。"], "examples": [], "extra": ""}, {"num": "2", "sentence": "我根本没办法和三立公司充分讨论两家公司合作的事情。", "explanation": ["“根本”，从头到尾，完全。多用于否定句，或修饰含义近于否定的词。例如："], "examples": ["我根本不知道这件事情。", "他根本不认识我。"], "extra": "即学即用：请用“根本”完成句子\n(1) A：昨天晚上你怎么没去参加中天公司的商务晚宴？\nB：可能是我的邮箱出问题了，我___。\n(2) A：小王出差了吗？已经好几天没看见他了。\nB：你还不知道啊，他已经辞职了，___。"}, {"num": "3", "sentence": "什么演出不演出的就算了吧。", "explanation": ["“什么 x 不 x 的，……”表示对于“x”这件事不怎么在意，后面的小句表示进一步的态度。"], "examples": ["什么好吃不好吃的，只要填饱肚子就行。", "什么好看不好看的，能穿就行。"], "extra": "即学即用：用“什么 x 不 x 的，……”完成对话\n(1) A：小王，你觉得今天的演出好看吗？\nB：___，不就那么回事嘛！\n(2) A：小王，你的报表填完了吗？\nB：___，我都忙死了，根本顾不上。"}, {"num": "4", "sentence": "连同今年的销售汇总表一起交上来。", "explanation": ["“连同……一起……”，连词，“连、和”的意思。"], "examples": ["你把这些货物连同清单一块送过去。", "不要把洗澡水连同孩子一起泼出去。", "请填写好这张住宿登记表后，连同你的身份证一起交给我们。"], "extra": "即学即用：仿照例句完成句子\n(1) 连同刚才这些证书的复印件，公司里都需要保留一份。\n(2) 连同___。\n(3) ___，连同___。"}, {"num": "5", "sentence": "宁可多加加班，也要把工作做完。", "explanation": ["“宁可……也……”，宁可表示在比较利害得失之后选取一种做法，也要后面的小句表示选取这一做法的目的。例如：", "其否定式是“宁可……也不……”，例如："], "examples": ["他宁可少睡点儿觉，也要把这篇文章写完。", "我宁可早走半个小时，也要按时到达会场。", "他是个工作狂，每天宁可工作，也不出去应酬。"], "extra": "即学即用：请用“宁可……也……”完成句子\n(1) A：明天你和我们去长城吗？\nB：去长城太累了，我___。\n(2) A：快下班了，下班后咱们一起去唱卡拉 OK 吧。\nB：我手里的工作还没做完呢。我___。"}], "duihua_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["提交", "报表"], ["安排", "日程"], ["预订", "机票"], ["取消", "活动"], ["参加", "宴会"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["报表", "预订", "日程", "谈判", "预先", "取消", "调整", "汇报"], "items": [{"text": "中国在黄金周出去旅游的人太多了，如果出去玩的话，一定要提前___机票和酒店。", "answer": "预订"}, {"text": "这几天都在忙着提交公司的财务___，其他事情等过段时间再说。", "answer": "报表"}, {"text": "不好意思，我明天不能去参加你们公司的开业典礼，我明天要去和蓝天公司___。", "answer": "谈判"}, {"text": "这几天我的___安排得太满了，最好找小王给我再___一下时间。", "answer": ["日程", "调整"]}, {"text": "在总经理每次出差之前，小王都会给他___安排好行程。", "answer": "预先"}, {"text": "由于领导出差，明天下午的会议被___了。", "answer": "取消"}, {"text": "小王真是个工作狂，刚出差回来，就马上向领导___工作。", "answer": "汇报"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["得王经理调整我一下给日程", "了解根本不我情况", "工作很部门高也我们其实的效率"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["总经理：我下周要去上海，请帮我___。\n小王：好的。您去几天？我好预订火车票。\n总经理：我打算周二去，周五回来。\n小王：明天就周末了，我得___。您有什么重要活动呢？\n总经理：我要参加一个商务宴会，还要和上海的客户谈判，还要听他们介绍一下企业文化。\n小王：好像日程有点满，有些活动不重要的话，___。\n总经理：这次的活动都非常重要，___。\n小王：其实我也不是这个意思，我是担心您太累。安排好去上海的日程后，我会告诉您。"]}, {"type": "open", "title": "五、看谁写得好", "intro": "", "bank": [], "items": ["假如你是总经理秘书，今天总经理要参加客户的商务宴请，听客户介绍他们公司的情况，和客户就合作的事情进行谈判，还要参加新员工的培训，请你根据不同的活动内容，给总经理安排一个合适的日程表。", {"kind": "clipbox", "title": "日 程 表", "blank": 11}]}], "kewen": {"title": "学会管理时间", "paragraphs": ["近年来，商务人士的生活节奏明显加快，商场竞争日益激烈，管理时间这个问题也随之变得异常重要。虽然很多商务人士每天都忙碌不停，但总是觉得时间不够用。时间都去哪儿了？这个问题让不少商务人士头痛不已。因而，对于整日忙于自己生意的商务人士来说，合理的个人时间管理变得尤为重要。可以说，商务人士能否在激烈的商战中取得成功取决于对于个人时间的管理是否合理。", "缺乏个人时间的管理突出地表现为匆忙地在最后期限完成自己的任务，总是拿太忙当借口，甚至会在毫无准备的情况下面对业绩检查，从而遭到领导的批评。长期处于这样的状态则会导致压力过大和个人工作能力的退化。", "相反，善于管理自己时间的人即使面对繁重的工作，也会表现得很从容。在有限的时间里，最大限度地使自己的工作效率最大化。繁重的工作和生活里的各种琐事不但没有打乱他们的生活，反而让他们在管理自己时间的过程中变得更为自信。", "试想如果你一天只让自己做一件事情，那么你会花一整天时间去做，也就是说，你一天只做了一件事情。如果你让自己一天做二十件事情，那么你可能会完成七八件甚至更多。可见如果你会合理安排自己的时间，你也许会获得三到五倍的回报。所以，一个商人要想获得成功，就必须先学会如何管理自己的时间。也就是说，做好合理的日程安排，对一个商人的成功至关重要。", "管理时间并不是说要把所有的事情都做完，而是要更有效地利用时间，提高自己的工作效率。首先，管理时间的目的是让你来区分重要的事情和不重要的事情。重要的和紧急的事情要先做，把不太重要的事情放在后面，有些事情甚至可以暂时不做，但是要注意的是紧急的事情并不等于重要的事情，而且在不同的事情之间要留有余地。如果刚开完董事会马上就去和客户会谈，看起来时间安排得很紧，但是实际上，并不能提高工作效率。其次，要有效地利用时间，如果能够充分地利用自己的时间，即使只用了20％的投入，也能产生80％的效率。反之，即使你用了80％的投入，也有可能只获得20％的效率。再次，你还要学会记录时间。你需要了解自己的时间是如何花掉的。挑一个星期，记下每天在办公室处理不同的事情时所花费的时间，然后做一个分类（比如复印资料、查看电子邮件、安排会议等）和统计，看看自己在什么方面会花费太多的时间，以后自己怎么改进。最后，就是要注意安排好事情的顺序，哪件事情先做，哪件事情后做，有些事情虽然不是最重要的，但是比较简单，也可以先做，做完简单的事情，再做复杂的事情，总之，做事情一定要有合理的安排。", "虽然人人都知道时间很重要，但是如何管理时间却往往为人们所忽视。在商界有一句名言“时间就是生命，效率就是金钱”，合理的日程安排可以让你更合理地利用时间并提高工作效率。你只有能够管理好自己的时间，才能在今后的发展中取得成功。", "那么，你学会管理自己的时间了吗？"]}, "kewen_shengci": [{"word": "节奏", "pos": "名词", "def": "比喻均匀有规律的过程", "pinyin": "jié zòu"}, {"word": "激烈", "pos": "形容词", "def": "剧烈、猛烈", "pinyin": "jī liè"}, {"word": "异常", "pos": "副词", "def": "非常", "pinyin": "yì cháng"}, {"word": "忙碌", "pos": "形容词", "def": "形容非常忙", "pinyin": "máng lù"}, {"word": "取决", "pos": "动词", "def": "表示由某人、某方面或某种情况决定", "pinyin": "qǔ jué"}, {"word": "期限", "pos": "名词", "def": "限定的一段时间", "pinyin": "qī xiàn"}, {"word": "检查", "pos": "动词", "def": "为了发现问题而仔细查看", "pinyin": "jiǎn chá"}, {"word": "遭到", "pos": "动词", "def": "受到（不幸或者损害）", "pinyin": "zāo dào"}, {"word": "导致", "pos": "动词", "def": "引出（某种结果），一般是不好的结果", "pinyin": "dǎo zhì"}, {"word": "琐事", "pos": "名词", "def": "细小、零碎的事情", "pinyin": "suǒ shì"}, {"word": "余地", "pos": "名词", "def": "言论或行动中，留下的可以回转的地步", "pinyin": "yú dì"}, {"word": "统计", "pos": "动词", "def": "指对某一现象有关的数据的搜集、整理、计算和分析等", "pinyin": "tǒng jì"}, {"word": "改进", "pos": "动词", "def": "改变原有状况，使得到提高", "pinyin": "gǎi jìn"}, {"word": "忽视", "pos": "动词", "def": "不重视，不注意", "pinyin": "hū shì"}], "kewen_yuyandian": [{"num": "1", "sentence": "商场竞争日益激烈。", "explanation": [], "examples": [], "extra": "注意：激烈——强烈\n“激烈”的近义词是“强烈”，两者的区别在于修饰的对象不同。“激烈”多用于形容运动紧张或双方斗争尖锐以及争论、竞争、比赛等。“强烈”多用于形容阳光、地震、反应等，指程度很深。\n此外，“激烈”一般用在两方或多方之间，而“强烈”可以用于形容单个事物。\n两国在边境地区发生了激烈的冲突，各有伤亡。\n辩论会上大家争论得非常激烈。\n汶川曾发生过强烈的地震。\n我很奇怪，他对这件事的反应为什么如此强烈。\n即学即用：请用“激烈”“强烈”填空\n(1) 这场球踢得非常___。\n(2) 地震瞬间，大地发生了___的震动。\n(3) 这两家饭店，一家宾客如云，另一家冷冷清清，形成了___的对比。\n(4) 夫妻俩经过___的争吵后，最终离婚了。"}, {"num": "2", "sentence": "这个问题让不少商务人士头痛不已。", "explanation": ["“xx 不已”，一般用于双音节动词后，表示不止，继续不停。例如："], "examples": ["这个地方的风景真美丽，让人赞叹不已。", "今天孩子们去欢乐谷玩得兴奋不已。"], "extra": "即学即用：请用“不已”完成下面的句子\n(1) A：听说你进苹果公司了，一定非常激动吧！\nB：是啊，直到现在，我想起来这件事还___。\n(2) A：听说你们王经理最近升职了，还找了一个漂亮女朋友。\nB：是啊，全公司的人都___。"}, {"num": "3", "sentence": "商务人士能否在激烈的商战中取得成功取决于对于个人时间的管理是否合理。", "explanation": ["“取决于”，由某人、某方面或某种情况来决定。例如："], "examples": ["今后五年，国家的经济是否能持续、快速发展取决于政府的政策。", "能否应聘成功取决于自己的努力程度和一点点运气。"], "extra": "即学即用：请用“取决于”完成下面的句子\n(1) A：听说你们和中天公司的合同有一点小麻烦？\nB：是的，关于价格问题，我们双方有一些分歧，这笔生意能否成功___。\n(2) A：你下周四有时间吗？\nB：我目前还不确定，在我们公司都是董事长说了算。我下周四是否有时间___。"}, {"num": "4", "sentence": "反而让他们在管理自己时间的过程中变得更为自信。", "explanation": ["“反而”表示跟前文意思相反或出乎意料，在句中起转折的作用。例如："], "examples": ["老杨住得最远，反而先到了。", "小王见大家都夸奖他，反而不好意思了。"], "extra": "即学即用：请用“反而”完成下面的句子\n(1) A：快下班了，你看看外面的雨小点了吗？\nB：哎呀，外面的雨不但没有小，___。\n(2) A：听说你们王经理生病了？最近好点了吗？\nB：你不用担心，他经过这场病，身体___。"}, {"num": "5", "sentence": "以后自己怎么改进。", "explanation": [], "examples": [], "extra": "注意：改进——改善\n“改进”的近义词是“改善”，两者的不同在于：“改进”的对象一般比较小，如技术、工作等。而“改善”的对象一般比较抽象，比如关系、条件、环境、生活等。例如：\n我们厂改进技术之后，大大提高了生产效率。\n要努力改进各级政府机关的工作作风，更好地为人民服务。\n近年来两国的关系有了很大的改善。\n种花、种草、种树改善了人们的生活环境。\n即学即用：请用“改进”“改善”填空\n(1) 政府正在不断___工作方法和作风，以方便老百姓办事。\n(2) 经济的发展使人民的生活得到了极大的___。\n(3) 新的学生公寓的建成大大___了大学生们的住宿条件。\n(4) 客服人员要根据消费者的需求来___工作。"}, {"num": "6", "sentence": "但是如何管理时间却往往为人们所忽视。", "explanation": ["“为（wéi）＋名词＋所＋动词”，这里的“为”是“被”的意思，整个结构表示被动，为后面引出发出动作的人，所后面跟句子中的表达动作的动词。例如："], "examples": ["麦当劳一进入中国，就受到了大家的欢迎，尤其为年轻人所喜欢。", "苹果是闻名全球的成功企业，为广大消费者所熟悉。"], "extra": "即学即用：请用“为（某人）……所”完成下面的句子\n(1) A：你们公司针对女性研发的新产品卖得怎么样啊？\nB：我们的新产品___，这几天都脱销了。\n(2) A：听说你们公司的产品出了点质量问题，解决了吗？\nB：这个问题___，我们已经向消费者解释清楚了。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["竞争", "激烈"], ["提高", "效率"], ["取得", "成功"], ["遭到", "批评"], ["留有", "余地"], ["导致", "失败"], ["检查", "工作"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["取得", "遭受", "异常", "忙碌", "期限", "余地", "导致", "忽视", "统计", "节奏"], "items": [{"text": "今年公司的销售额比去年增长了20%，员工们___高兴。", "answer": "异常"}, {"text": "酒后驾车有可能会___严重的交通事故。", "answer": "导致"}, {"text": "下周五就是HSK报名的最后___了。", "answer": "期限"}, {"text": "平时工作就是再___，节假日也应该回家看看父母。", "answer": "忙碌"}, {"text": "目前的法律还不完善，仍然有修改的___。", "answer": "余地"}, {"text": "最近，他一直___着失业带来的痛苦。", "answer": "遭受"}, {"text": "他今年___了全公司第一的销售业绩。", "answer": "取得"}, {"text": "中国每隔几年都会进行人口普查，对实际人口进行___。", "answer": "统计"}, {"text": "无论是工作还是生活，都要调整好自己的___。", "answer": "节奏"}, {"text": "他长期工作，___体育运动，结果病倒了。", "answer": "忽视"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["不已大家这个让头痛问题", "产品竞争力取决于质量的", "为……所产品消费者喜爱这种", "暖和反而了来了雪天气下起"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["A：最近有一种很奇怪的现象。人们总是说时间重要，甚至有的人把时间比喻成生命，但是___。\nB：是啊，这是因为现在的社会竞争___。每天都根本___。\nA：所以，你要学会管理自己的时间，提高___。\nB：有什么秘诀吗？\nA：第一件事，就是学会___，先做重要的事情。"]}, {"type": "open", "title": "五、看谁演得好", "intro": "", "bank": [], "items": ["人物1：公司的总经理。任务：总经理下周要去上海出差，要求秘书给他安排一下日程。", "人物2：总经理秘书。任务：给总经理安排去上海的日程。周一上午到上海：参观外国公司、拜访两个大客户、参观在上海的新工厂、游览上海、参加公司举办的商务晚宴。周四上午离开上海回北京。", "要求：日程不能安排得太紧，要留有余地；要了解目的地的相关情况，比如气候，交通等；如果有可能要提供备用的日程安排。", "角色扮演：和你身边的同学分别扮演上面的两个人物，模仿真实场景展开一段对话。"]}, {"type": "open", "title": "六、看谁写得好", "intro": "", "bank": [], "items": ["总经理让小王通知各部门准备后天谈判需要的文件。因为这次谈判很重要，所以要顺便告诉大家周四晚上的商务宴会取消了，请你代写一个通知。"]}]}, {"id": 7, "title": "邮件促销", "daodu": ["给客户发电子邮件时，要注意什么问题？", "什么是垃圾邮件？怎样避免你的邮件被客户认为是垃圾邮件？"], "hexinjv": ["你要认真给客户回复邮件，否则，你的邮件会直接影响客户对我们公司的评估。", "哪怕晚一点给客户发邮件，也要把细节想清楚。", "随着互联网的普及，电子邮件已经成为了网络社会与人沟通和办公的有效手段。", "总而言之，垃圾邮件会大大损害发件人的形象，会严重影响消费者对你的产品的评估。"], "duihua": {"intro": "王中向吴云请教销售秘诀。", "lines": [{"speaker": "小王", "text": "吴经理，您真厉害，那么大的单子都让您拿下了！您有什么秘诀吗？"}, {"speaker": "吴经理", "text": "我的秘诀在于不断地给他们发邮件，保持联系。"}, {"speaker": "小王", "text": "邮件？我也给他们发邮件了，可是他们根本不回复。"}, {"speaker": "吴经理", "text": "这很正常，邮件营销的主要目的是培养未来的用户，不见得马上就要获得回报。如果客户真正有需求的话，他们会主动和我们联系的。"}, {"speaker": "小王", "text": "原来是这样，今天回去我就给我的客户发邮件。"}, {"speaker": "吴经理", "text": "那你先发给我看一看，再发给他。"}, {"speaker": "小王", "text": "电子邮件不就和写信一样吗？难道还有什么注意事项吗？"}, {"speaker": "吴经理", "text": "当然了。商务往来中的电子邮件代表了公司的形象，并且向客户展示了公司的水平和实力。你要认真给客户回复邮件，否则，你的邮件会直接影响客户对我们公司的评估。"}, {"speaker": "小王", "text": "那我应该注意什么呢？"}, {"speaker": "总经理", "text": "你电子邮件里所有的信息都要准确，而且也不能有语言错误。"}, {"speaker": "小王", "text": "没错，错别字会让对方觉得你不重视他，如果是挑剔的客户，就更麻烦了。客户就是我们的上帝。我会认真检查我的邮件的。"}, {"speaker": "总经理", "text": "另外，你要注意，营销邮件也是改变我们和客户之间距离的一种手段。刚开始的时候，你不要急，先发几封问候性的邮件，让对方知道我们的产品就可以了。"}, {"speaker": "小王", "text": "以前可能就是因为我太着急了，人家反而把我的邮件当作垃圾邮件了。"}, {"speaker": "总经理", "text": "另外，就是你的信息要完整。要一次性地把所有必要的信息告诉客户，不要连续给客户发邮件补充前面的信息。哪怕晚一点给客户发邮件，也要把细节想清楚，否则，客户会嫌你工作态度不认真。"}, {"speaker": "小王", "text": "没错。这样会让客户觉得我们考虑得很周到。今天和您学了好多东西啊。有了您这一秘诀，今年我肯定能提前完成任务。"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "intro": "", "bank": [], "items": [{"text": "小王根本没有给客户发邮件。", "answer": false}, {"text": "给客户回复邮件是件小事，不会影响公司的形象。", "answer": false}, {"text": "邮件营销的主要目的是卖产品。", "answer": false}, {"text": "邮件中一定不能有错别字。", "answer": true}, {"text": "邮件有一点错误没关系，但是一定要及时发给客户。", "answer": false}]}, {"type": "open", "title": "二、回答问题", "intro": "", "bank": [], "items": ["小王以前为什么没有成功？", "给客户回复的电子邮件有什么作用呢？", "给客户回复电子邮件要注意几个问题？分别是什么？"]}], "duihua_shengci": [{"word": "秘诀", "pos": "名词", "def": "指提高办事效率的办法、途径", "pinyin": "mì jué"}, {"word": "保持", "pos": "动词", "def": "维持某种状态", "pinyin": "bǎo chí"}, {"word": "营销", "pos": "名词", "def": "指根据市场需要组织生产产品，并通过销售手段把产品提供给需要的客户", "pinyin": "yíng xiāo"}, {"word": "不见得", "pos": "", "def": "不一定", "pinyin": "bú jiàn de"}, {"word": "回报", "pos": "名词", "def": "报答，补偿其他人对自己的付出", "pinyin": "huí bào"}, {"word": "事项", "pos": "名词", "def": "事情的项目", "pinyin": "shì xiàng"}, {"word": "形象", "pos": "名词", "def": "人或事物的外部特征", "pinyin": "xíng xiàng"}, {"word": "评估", "pos": "动词", "def": "评价、估量", "pinyin": "píng gū"}, {"word": "挑剔", "pos": "动词", "def": "在细节上过于严格", "pinyin": "tiāo tī"}, {"word": "手段", "pos": "名词", "def": "为达到某种目的而采取的方法", "pinyin": "shǒu duàn"}, {"word": "问候", "pos": "动词", "def": "问好", "pinyin": "wèn hòu"}, {"word": "完整", "pos": "形容词", "def": "具有或保持着应该有的部分，没有损坏或残缺", "pinyin": "wán zhěng"}, {"word": "嫌", "pos": "动词", "def": "讨厌、不喜欢", "pinyin": "xián"}], "duihua_yuyandian": [{"num": "1", "sentence": "难道还有什么注意事项吗？", "explanation": ["“难道……吗？”，常见的反问句结构，问话人并没有疑问，是为了强调，所强调的意思和问句表面意思相反，常用“难道……吗？”“岂不是……吗？”之类的格式来表示，语气一般用升调。"], "examples": ["我已经告诉过你三次了，你难道还没有记住吗？（意思是：你应该记住了）", "你们难道还没有听明白他的意思吗？", "这件事难道就这样决定了吗？"], "extra": "即学即用：请用“难道……吗”完成对话\nA：你手里拿的什么东西？可以给我看看吗？\nB：就不给你看。\n？\nA："}, {"num": "2", "sentence": "否则，你的邮件会直接影响客户对我们公司的评估。", "explanation": ["“否则”，如果不是这样，就……。例如："], "examples": ["在学校既要专业课好，又要积累工作经验，否则，很难找到好工作。", "要合理管理自己的时间，否则，做事情会手忙脚乱。"], "extra": "即学即用：请用“否则”完成下面的句子\n(1) A：都几点了，你们还在加班？\nB：哎呀，都快十一点了，赶紧回家吧， 。\n(2) A：明天下午您要参观工厂，晚上还要参加中天公司的商务晚宴吗？\nB：最近要做的事情太多了，就不参加晚宴了， 。"}, {"num": "3", "sentence": "先发几封问候性的邮件／要一次性地把所有必要的信息告诉客户。", "explanation": ["“X X 性”，表示……的性质，“性”用在动词、形容词甚至名词的后面构成新词。"], "examples": ["稳定性", "灵活性", "可行性", "科学性", "突发性", "长远性"], "extra": "即学即用：把上面的词语填入适当的空格\n(1) 地震自然灾害这种属于 事件。\n(2) 为了经济的持续发展，城市规划要具有 。\n(3) 政策一方面要具有 ，但是针对特殊的情况也要具有 。\n(4) 这次报告写得非常好，非常有 ，同时也符合我们的实际情况，非常强。"}, {"num": "4", "sentence": "哪怕晚一点给客户发邮件，也要把细节想清楚。", "explanation": ["“哪怕”，表示假设兼让步，后边多用“都、也、还”呼应。一般前一分句表示一种假设的情况，后一分句表示结果或结论不受这种情况的影响。类似的结构还有“即使……也”。例如："], "examples": ["哪怕（即使）天气不好也要去上课。", "哪怕（即使）工作到深夜，他也要按时完成任务。"], "extra": "即学即用：请用“哪怕（即使）……也”完成下面的句子\n(1) A：这次的工作任务很重，明天你们能完成任务吗？\nB：您放心， 。\n(2) A：明天是周末，路上车很多，咱们一定要去长城吗？\nB：是的，去长城是我的梦想，中国有句话叫“不到长城非好汉”， 。"}], "duihua_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["保持", "联系"], ["培养", "用户"], ["代表", "形象"], ["展示", "实力"], ["考虑", "周到"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["秘诀", "保持", "不见得", "评估", "嫌", "挑剔", "回报", "形象", "代表"], "items": [{"text": "虽然今年的经济形势不好，但是还是要___物价稳定。", "answer": "保持"}, {"text": "苹果公司始终能保持行业第一的___就在于不断地创新。", "answer": "秘诀"}, {"text": "他虽然是新员工，但他提的建议___不对。", "answer": "不见得"}, {"text": "你们公司的资产到底值多少，还需要重新进行___。", "answer": "评估"}, {"text": "小王总是___公司给他的薪资太少，可他也不看看自己对公司的贡献是多少。", "answer": "嫌"}, {"text": "胡同虽然狭窄，但是___了老北京的历史和风情。", "answer": "代表"}, {"text": "很好地处理售后问题，有助于维护企业的___。", "answer": "形象"}, {"text": "这个客人看了一下午咱们的产品，结果都不满意，他真___。", "answer": "挑剔"}, {"text": "他付出巨大努力的同时，也获得了丰厚的___。", "answer": "回报"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["有秘密难道什么吗", "坐地铁否则买必须会罚款票被", "哪怕上学穷再孩子也要送"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["小王：我也给客户发邮件了，可是他们根本 。", "总经理：这很正常，邮件营销的主要目的 。成功的秘诀就在于 。", "小王：好的，回去我就给他们发邮件。", "总经理：你把给客户回复的电子邮件发给我看看。", "小王：好的。不过，这个不就和日常写信一样吗？", "总经理：不一样的。商务往来中的电子邮件不但 ，而且 。要认真给客户回复邮件，否则 。", "小王：这么重要啊！有什么注意事项吗？", "总经理：首先，你的电子邮件不能有错误，否则 。其次，你不能着急，通过邮件慢慢改变和客户之间的距离。最后，邮件里的信息要完整，否则 。"]}, {"type": "open", "title": "五、看谁说得好", "intro": "下面是小王写给客户的一封电子邮件，请你简要谈谈电子邮件的作用，并说出下面这封电子邮件有什么不合适的地方。", "bank": [], "items": ["X X 经理／总：\n你好！\n非常荣幸能够代表我公司和你联系。\n我是 X X 公司的销售部经理 XX，今天我把您感兴趣的我公司产品的报价以及相关介绍发给你。请你及时查阅。这种新产品很受大家的欢迎，我的客户几乎都很喜欢，我也希望你能够购买我们的产品，成为我们公司长期的用户。如果不满意的话，你就随便看看，和朋友介绍一下我们的产品也可以，万分感谢！\n如果邮件中有任何不清楚的地方或者您需要我们提供任何帮助，请你给我打电话，我的电话是 xxxxxxx，或者联系 X X X X，他的手机号是 X X X X X。\n恭祝商祺！\nX X X", "不恰当的地方有："]}], "kewen": {"title": "邮件促销", "paragraphs": ["随着国际化的商务沟通的发展及互联网的普及，电子邮件已经成为了网络社会与人沟通和办公的有效手段，收发电子邮件也已经成为人们日常生活中必不可少的一部分。人们可以通过电子邮件随时与朋友联系，与同事交流工作，从而提高工作效率。一封内容和格式规范的商务电子邮件，不仅可以代表公司的形象、培养自己潜在的客户、进行在线市场调查，甚至可以有效地推广自己的产品，尤其是对年轻人，促销邮件具有独特的魅力。中国目前的电子商务发展迅速，运用邮件来进行营销也就成为当前必不可少的方法之一。", "所谓电子邮件营销是指在用户事先许可的前提下，通过电子邮件的方式向目标用户宣传自己产品信息的一种网络营销手段。一般来说，对于内容过长的邮件，人们往往会缺乏耐心，很容易把它当作垃圾邮件；反之，如果邮件不太长，收件人才有耐心阅读。实际上，这是一种误解。如果收件人对你的产品不感兴趣，哪怕是一个字，他也不愿意阅读。反之，倘若他对你的产品非常感兴趣，他会希望邮件的内容越具体越好。", "因而，以电子邮件为营销手段最重要的事情就是要精确定位，确定好自己的目标客户。如果定位准确，消费者不仅不会讨厌你的邮件，反而会希望你对自己产品的介绍得越多越好。因而一封促销邮件如果想达到预想的营销效果，其内容必须对消费者具有吸引力。", "此外，消费者一般在购买了一种产品之后，他们的内心会有一种说不出来的期待，期待着自己对产品的判断是正确的。如果他们看到周围许多人也购买同样的产品，自己心里就会很舒服，而且还会向不了解这种产品的朋友有意无意地进行宣传。", "至于垃圾邮件，则是一件令人厌恶的事情。2002 年中国互联网协会，对垃圾邮件做了如下定义：", "(1) 收件人事先没有提出要求或者同意接收的广告、电子刊物、各种形式的宣传品等宣传性的电子邮件；", "(2) 收件人无法拒收的电子邮件；", "(3) 隐藏发件人身份、地址、标题等信息的电子邮件；", "(4) 含有虚假的信息源、发件人、路由等信息的电子邮件。", "如果你的产品或者服务是合法的，并且你认为通过邮件能达到在互联网上有效推广你的产品的效果，那么请注意：首先，你的邮件必须有有效的回复地址；其次，如果收件人对你的信件不感兴趣的话，他可以轻易地从你的邮件列表中删除他的电子邮件地址；最后，你的邮件主题必须清晰，最好以标题的方式说明你邮件的主要内容，一定不要使用空白主题，这样可以让客户决定是否看你的邮件，千万不要故意使用一些误导的标题来让对方阅读你的邮件。", "总而言之，垃圾邮件会大大损害发件人的形象，会严重影响消费者对你的产品的评估。请尽量避免带给客户垃圾邮件的错觉。"]}, "kewen_shengci": [{"word": "普及", "pos": "动词", "def": "存在的范围很广泛", "pinyin": "pǔ jí"}, {"word": "潜在", "pos": "形容词", "def": "存在于事物内部还没有表现出来的", "pinyin": "qián zài"}, {"word": "调查", "pos": "动词", "def": "进行了解，获取基本的信息", "pinyin": "diào chá"}, {"word": "独特", "pos": "形容词", "def": "特有的、特别的、独一无二的", "pinyin": "dú tè"}, {"word": "魅力", "pos": "动词", "def": "很能吸引人的力量", "pinyin": "mèi lì"}, {"word": "所谓", "pos": "形容词", "def": "所说的", "pinyin": "suǒ wèi"}, {"word": "倘若", "pos": "连词", "def": "如果", "pinyin": "tǎng ruò"}, {"word": "期待", "pos": "动词", "def": "期盼、等待", "pinyin": "qī dài"}, {"word": "隐藏", "pos": "动词", "def": "藏起来，不容易发现", "pinyin": "yǐn cáng"}, {"word": "虚假", "pos": "形容词", "def": "假的、不可能存在的", "pinyin": "xū jiǎ"}, {"word": "轻易", "pos": "副词", "def": "简单、容易", "pinyin": "qīng yì"}, {"word": "删除", "pos": "动词", "def": "去掉不要的东西", "pinyin": "shān chú"}, {"word": "清晰", "pos": "形容词", "def": "清楚明晰", "pinyin": "qīng xī"}, {"word": "误导", "pos": "动词", "def": "指导做错误的事", "pinyin": "wù dǎo"}, {"word": "避免", "pos": "动词", "def": "设法不让某种情况发生；防止", "pinyin": "bì miǎn"}], "kewen_yuyandian": [{"num": "1", "sentence": "随着国际化的商务沟通的发展及互联网的普及……", "explanation": ["“随着”，用在句首或动词前面，表示动作、行为或事件的发生所依赖的条件。例如："], "examples": ["随着社会的发展、科技的进步，人们的生活水平日益提高。", "随着工业的发展，尤其是重工业的发展，环境污染问题越来越严重。"], "extra": "即学即用：请用“随着”完成下面的句子\n(1) A：你去中国已经一个月了，还适应中国的生活吗？\nB：，我越来越适应中国的生活。\n(2) A：中国的环境污染严重吗？\nB：，中国的环境污染日益严重。"}, {"num": "2", "sentence": "所谓电子邮件营销是指在用户事先许可的前提下……", "explanation": ["“所谓”，通常所说的，多用于提出需要解释的词语，接着加以解释，可修饰名词、动词、小句。", "有时“所谓”用于引述别人的言语，表示说话人对别人所说的话不赞成。"], "examples": ["所谓宾语是指句子中出现在动词后面的内容。", "所谓第三产业是指除了第一、第二产业之外的所有产业的总称。", "他所谓的“改革”，只不过是走走形式而已。"], "extra": ""}, {"num": "3", "sentence": "对于内容过长的邮件，人们往往会缺乏耐心；反之，如果邮件不太长，收件人才有耐心阅读。", "explanation": ["“反之”，从相反的方面说。用在两个小句、句子、段落中间，起转折作用，引出同上文相反的另一意思。“反之”后有停顿。例如："], "examples": ["所谓风险投资就是说风险越大挣的钱越多；反之，风险越小，挣的钱越少。", "天气热，根的吸水力就强；反之，天气寒冷，根的吸水力就弱。"], "extra": "即学即用：请用“反之”完成下面的句子\n(1) 价格上升，就会导致供过于求的现象； 。\n(2) 最想见的人，找了一天也见不到；反之，最不想见的人， 。\n(3) 金属体积和温度高低成正比，温度越高，体积越大； 。"}, {"num": "4", "sentence": "他们的内心会有一种说不出来的期待。", "explanation": [], "examples": ["我正在期待着他的到来。（他来的时间已经定了）", "老百姓期望这个工程早日完成。（只是表达希望）"], "extra": "注意：期待—期望\n“期待”的近义词是“期望”，两者的宾语一般都是抽象的。两者的区别在于：“期待”侧重于将要发生的事情，从现在到事情发生有一个等待的过程，事情的主导是他人想的；而“期望”侧重于想要发生的事情，事情的主导是本身想的。例如：\n即学即用：请用“期待”“期望”填空\n(1) 父母从小就希望我做一名科学家，我一定我不辜负父母的 。\n(2) 我的留学生活快结束了，父母都在国内 着我早日学成回国。"}, {"num": "5", "sentence": "至于垃圾邮件，则是一件令人厌恶的事情。", "explanation": ["“至于”，引进另一个话题。用在小句或者句子的开头。“至于”后面的名词、动词等是话题，后面有停顿。例如："], "examples": ["你安心在医院养病，至于医药费，你不用担心。", "这仅仅是我个人的意见，至于这样做好不好，请大家再考虑一下。"], "extra": "即学即用：请用“至于”完成下面的句子\n(1) A：你们公司的王总真是个工作狂！我还没有见过他请假。\nB：是啊，王总考虑的总是公司的利益， ，从没考虑过。\n(2) A：对不起，这两天我生病了，不能去上班，我负责的项目让小王先跟一下吧。\nB：你好好在医院养病吧， 。"}, {"num": "6", "sentence": "总而言之，垃圾邮件会大大损害发件人的形象。", "explanation": ["“总而言之”，连词，总括起来说。总结上文。例如：", "“总而言之”，还可以表达概况性的结论，含有“反正”的意思。例如："], "examples": ["对于新事物，有的人赞成，有的人反对，有的人怀疑，总而言之，每个人都有自己的看法。", "政府、企业、教育部门，总而言之，各个部门都在进行改革。", "他的详细地址我记不清楚了，总而言之是在芍药居附近。"], "extra": "即学即用：请用“总而言之”完成下面的句子\n(1) A：你最近忙吗？\nB：我最近不是去进行市场调查，就是进行新职工的培训， 。\n(2) A：我已经给你介绍了我们新产品的特点，您想买一个试试吗？\nB：我已经有了一个功能差不多的产品，不管你怎么说， 。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["避免", "丢失"], ["删除", "数据"], ["隐藏", "信息"], ["损害", "利益"], ["精确", "主题"], ["虚假", "邮件"], ["潜在", "市场"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["潜在", "独特", "调查", "期待", "轻易", "普及", "清晰", "误导"], "items": [{"text": "消费者们正___着新产品的上市。", "answer": "期待"}, {"text": "邮件促销有可能把___的销售用户转变为现实的客户。", "answer": "潜在"}, {"text": "为了了解目前的市场需求，我们___了不同阶层消费者的消费习惯。", "answer": "调查"}, {"text": "有些广告故意不说清自己产品的功能，企图___消费者。", "answer": "误导"}, {"text": "这种照片年代太久了，上面的人物已经不___了。", "answer": "清晰"}, {"text": "现在网络越来越___了，连边远地区上网也都很方便。", "answer": "普及"}, {"text": "面对激烈的市场竞争，必须采取___的营销策略才能取得成功。", "answer": "独特"}, {"text": "做任何事情都不会___成功，一定要付出巨大的努力。", "answer": "轻易"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["我以后至于再问题的个人解决", "“三通”是指所谓通商、通邮、通航", "发展人们的科技提高的随着日益生活水平", "凡是希望的事情反之不希望的事情总是很难实现会很容易地实现"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["小王：真讨厌，每天信箱里好多垃圾邮件。", "总经理：是的，这是因为目前市场还不规范，他们滥用邮件来进行营销。实际上，一封好的促销邮件，不仅可以 ，而且可以 ，甚至可以 ，尤其是对年轻人来说， 。", "小王：不过有的邮件真的太长了，人们往往会 。", "总经理：我也确实遇到过这种情况。这就要求发出的营销邮件对消费者 。", "小王：看来回去以后，我也得认真看看给客户的邮件有没有问题。"]}, {"type": "open", "title": "五、看谁说得好", "intro": "下面是两封邮件，请比较一下两封邮件有什么不同？哪封比较好，哪封会被认定为是垃圾邮件，谈谈你的看法。", "bank": [], "items": ["邮件 1：\n转采购部：您好，我是东莞市中天科技公司的 X X，联系过空气净化器的使用和安装，净化器的报价表在邮件附件中敬请查阅。\n您好！\n我是东莞市中天电子公司的 X X，初步了解贵公司现在要准备安装一批空气净化器，对贵公司关于净化器产品的质量要求方面以及安装的价格方面有了一定的了解，初步按照贵公司的要求提供一份合理的明细报价表，报价表内附有我公司介绍，供贵公司领导了解、参考之用。真诚期望我们的合作愉快并且成功，在此我表示，我的手机将为您 24 小时开机，随时解决您所遇到的问题；中天电子将竭诚为您提供 24 小时的热情周到的服务！\n恭祝商祺！\nX X X", "邮件 2：\n无标题\n亲爱的朋友，你好，我是在遥远的冰岛的雷克雅未克给你写这封信的，我是一名银行工作人员，请原谅我还不方便透露银行的名字，但可以肯定的是，我们的银行马上就要收归国有了，我相信你对最近一段时间的金融危机已经相当了解，但你可能还没有认识到这场危机的严重性，至少你认识的没有我深刻。\n你是否听说冰岛向俄罗斯要来了 40 亿美元的贷款？这笔钱并不多，但这笔钱的意义非同小可，你是否注意到《泰晤士报》的评论（链接在下面）？\n我相信，这将是新一轮兼并与重组的开始，不过，这一次兼并和重组的对象不是公司而是国家。俄罗斯对于把势力扩张到北大西洋一直非常感兴趣，但我并不觉得这样的扩张有什么意识形态色彩，你知道，资本主义是追逐利益的，只要有利益，只要符合利益，收归国有或者向俄罗斯借贷都不是什么问题，我们只有 30 万人口，要是加入俄罗斯联邦，一定会把英国佬吓坏的。\n当然，我不想在这里和你讨论政治和外交问题。我们讨论钱，在我们的银行里沉睡着一笔巨额的债券，这些债券现在看并没有太大的价值，但如果我们把它转移到国外，它在未来依然会是一笔了不起的财富。要得到这笔财富，需要远见、耐心和彼此信任，我希望你能帮助我完成这次转移。我需要知道你的基本信息，你的姓名、年龄、婚姻状况、你的银行账号。"]}, {"type": "open", "title": "六、看谁写得好", "intro": "请你和你的同桌交替扮演老板和秘书，互相发电子邮件。", "bank": [], "items": ["1．发一封问候性的邮件，比如圣诞节的节日问候。", "2．发一封事务性的邮件，比如下周准备开一个招商会，老板要提前给秘书安排一下准备工作，秘书要及时向老板汇报工作。"]}]}, {"id": 8, "title": "广告宣传", "daodu": ["广告具有什么作用？", "做广告可以选择哪些媒体？各有什么好处？", "改革开放以来，中国的广告发展可以分为几个阶段？每个阶段分别有什么特点？"], "hexinjv": ["上一次的广告过于注重技术和产品本身，不免忽略了消费者本身的需求。", "况且互联网的成本要比前面几种媒体低得多。", "宣传产品也好，宣传服务也罢，广告都是商家用于推销的一种手段。", "与其花钱做广告，不如提高产品本身的质量。"], "duihua": {"intro": "王中和李丽讨论广告宣传的问题。", "lines": [{"speaker": "小王", "text": "根据我们对消费者的调查，我们去年的产品广告得到了很高的评价，可见我们去年的广告做得很成功。"}, {"speaker": "李丽", "text": "是的，去年的广告很好地把视觉和音乐结合起来，不仅传递了我们产品的信息，而且大大提升了我们整个品牌的知名度，给消费者留下了深刻的印象。不过，上一次的广告过于注重技术和产品本身，不免忽略了消费者本身的需求。"}, {"speaker": "小王", "text": "这一次，我会改变产品的宣传策略，不仅要展现咱们产品的特色，而且还要强化咱们的产品在消费者心目中的品牌形象。"}, {"speaker": "李丽", "text": "不过这次的时间比较紧，最多两周的时间。"}, {"speaker": "小王", "text": "这么短啊，我至少得花一周的时间改进方案，还得留出制作的时间。"}, {"speaker": "李丽", "text": "我也知道你的压力很大，不过，今年新品上市时间提前了。"}, {"speaker": "小王", "text": "好吧，我会尽力，明天我就开会讨论广告的主题。另外，咱们这次准备选择什么媒体来做广告呢？"}, {"speaker": "李丽", "text": "听说中天电视台的电视广告做得很精彩，如果找他们做广告，一般怎么收费呢？"}, {"speaker": "小王", "text": "如果是他们电视台的老客户，制作费可以优惠，但播出费就高得很，尤其是好时段。"}, {"speaker": "李丽", "text": "但是这次的广告经费不是那么充足。"}, {"speaker": "小王", "text": "那何必非要用电视广告呢？与其相比，在报纸上刊登广告要便宜得多。咱们可以考虑在报纸上刊登咱们新产品的广告。"}, {"speaker": "李丽", "text": "你回去设计一下广告词，一定要让广告词富有吸引力。"}, {"speaker": "小王", "text": "好的，咱们打算什么时候开始登广告呢？"}, {"speaker": "李丽", "text": "如果可能的话，最好从 6 月下旬开始。一周刊登四次：周一、周三登半版，周五、周六登整版。"}, {"speaker": "小王", "text": "咱们也可以通过互联网来推广产品，况且互联网的成本要比前面几种媒体低得多。"}, {"speaker": "李丽", "text": "可以，那咱们今天就讨论到这里。我等你的报告。"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "intro": "", "bank": [], "items": [{"text": "去年的广告让消费者感觉很好。", "answer": true}, {"text": "去年的广告对产品说明得很详细。", "answer": false}, {"text": "电视台给所有的客户都会在制作费上优惠。", "answer": false}, {"text": "小王他们公司这次的经费很充足，所以想购买电视台的热门时段。", "answer": false}, {"text": "在报纸上登广告要比在电视上便宜。", "answer": true}, {"text": "互联网的成本在几种媒体中最为便宜。", "answer": true}]}, {"type": "open", "title": "二、回答问题", "intro": "", "bank": [], "items": ["小王他们公司去年做的广告怎么样？有什么长处和不足？", "在电视台做广告怎么收费？", "与电视相比，在报纸上做广告有什么好处？", "在互联网上做广告有什么好处？"]}], "duihua_shengci": [{"word": "结合", "pos": "动词", "def": "泛指人或事物之间发生密切联系", "pinyin": "jié hé"}, {"word": "传递", "pos": "动词", "def": "传送", "pinyin": "chuán dì"}, {"word": "深刻", "pos": "形容词", "def": "透彻、深入", "pinyin": "shēn kè"}, {"word": "注重", "pos": "动词", "def": "重视，关注、在意", "pinyin": "zhù zhòng"}, {"word": "忽略", "pos": "动词", "def": "不在意；没注意到", "pinyin": "hū lüè"}, {"word": "策略", "pos": "名词", "def": "根据自己的需要而采取的方法", "pinyin": "cè lüè"}, {"word": "展现", "pos": "动词", "def": "表示，明显地表现出来", "pinyin": "zhǎn xiàn"}, {"word": "媒体", "pos": "名词", "def": "传播信息的媒介。比如报纸、广播、电视等", "pinyin": "méi tǐ"}, {"word": "充足", "pos": "形容词", "def": "在数量等方面满足要求或需要", "pinyin": "chōng zú"}, {"word": "刊登", "pos": "动词", "def": "在报刊中发表", "pinyin": "kān dēng"}, {"word": "富有", "pos": "动词", "def": "大量具有", "pinyin": "fù yǒu"}], "duihua_yuyandian": [{"num": "1", "sentence": "……，可见我们去年的广告做得很成功。", "explanation": ["“可见”，连词，承接上文，表示作出判断结论。例如："], "examples": ["连这么难的生词他都会，可见他昨晚认真复习了。", "今年他们的销售额翻了一番，可见他们付出了巨大的努力。"], "extra": "即学即用：请用“可见”完成下面的句子\n(1) A：你们昨天的那个会议重要吗？\nB：昨天连我们公司的总经理都亲自去了，可见 。\n(2) A：你们研发的新产品卖得怎么样？\nB：我们的新产品现在连存货都没有了，可见 。"}, {"num": "2", "sentence": "上一次的广告过于注重技术和产品本身，不免忽略了消费者本身的需求。", "explanation": ["“不免”，副词，表示由于前面所说的原因而不能避免某种结果，这种结果可能已经出现了，也可能是还未实现的。同义表达还有“免不了、难免”。例如："], "examples": ["由于交通事故未能及时处理，前方道路不免有些拥堵。", "这种恶劣天气下，他还坚持去爬山，我不免有点担心。"], "extra": "即学即用：用“不免”“难免”“免不了”完成句子\n(1) 他总觉得自己能力超强， 。\n(2) 这次研发的新产品过于重视外表， 。\n(3) 公司里同事之间 ，你不要太过在意。"}, {"num": "3", "sentence": "不仅要展现咱们产品的特色，而且还要强化咱们的产品在消费者心目中的品牌形象。", "explanation": [], "examples": ["一进大厅，展现在人们面前的是一张巨幅画像。", "胡同展示了北京近百年来的风土人情。", "这幅画充分展示了人物的内心世界。"], "extra": "注意：展现—展示\n两者的意思都是“把……拿出来给人看”，区别在于：“展现”后所带宾语一般都是抽象名词，而“展示”则既可以是抽象名词，也可以是具象名词。例如：\n即学即用：请用“展现”“展示”填空\n(1) 这些年来，个体经济 出了良好的发展势头。\n(2) 大厅里展出的作品 出了近几年来的发展成果。\n(3) 这种新产品一上市就 出了很好的发展前景。"}, {"num": "4", "sentence": "我至少得花一周的时间改进方案。", "explanation": ["“至少”，表示最小的限度，最少。例如："], "examples": ["中国改革开放的政策至少把中国的发展速度加快了几十年。", "在应聘之前，至少应该提前了解一下你感兴趣的公司。"], "extra": "即学即用：请用“至少”完成下面的句子\n(1) A：听说昨天的展会非常热闹，办得很不错？\nB：是的， ，还有很多中小公司。\n(2) A：我这两天有事，没时间去医院看你，你的病好些了吗？\nB：好多了，你放心， 。\n(3) A：怎么没看见你男朋友， 。\nB：他最近有点忙。"}, {"num": "5", "sentence": "咱们也可以通过互联网来推广产品，况且互联网的成本要比前面几种媒体低得多。", "explanation": ["“况且”，表示进一步申述理由或者追加理由，常和“又、也、还”等搭配使用。类似的结构还有“何况”。例如："], "examples": ["这件衣服很漂亮，况且（何况）也不贵，你还是买了吧。", "你跟他一起去吧，况且（何况）没多远。"], "extra": "即学即用：请用“况且”“何况”完成下面的句子\n(1) A：明天你能按时到会场吗？\nB：路不算太远， ，一定能按时赶到。\n(2) A：你觉得这个笔记本电脑值得买吗？\nB：这个笔记本电脑很轻，便于携带， ，你就买了吧。"}], "duihua_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["传递", "信息"], ["忽略", "细节"], ["展现", "特色"], ["刊登", "广告"], ["经费", "充足"], ["印象", "深刻"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["传递", "注重", "富有", "结合", "策略", "充足"], "items": [{"text": "这幅作品把东西方文化的特点很好地___在了一起。", "answer": "结合"}, {"text": "那么多人喜欢上网，因为网络随时可以给我们___知识和信息。", "answer": "传递"}, {"text": "为了让自己的产品更有竞争力，他们改变了新产品的价格___。", "answer": "策略"}, {"text": "今天的天气真好，屋子里的阳光也非常___。", "answer": "充足"}, {"text": "这个地方的服装非常___民族特色。", "answer": "富有"}, {"text": "随着人们生活水平的提高，人们越来越___环保。", "answer": "注重"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["火车票售票员一个星期前告诉我就没票了难可见很买", "的一周至少我需要时间", "问清楚再去吧况且这附近住的人很少你又不知道详细地址还是"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["A：你们上次做的广告真好， ，给消费者留下了深刻的印象。", "B：是的，不过上次的广告 。", "A：这一次，我们不仅要 ，而且要 。", "B：不会的，这次我们要 。", "A：这次你们会选择什么媒体做广告呢？", "B：由于这次的经费不是很充足，我们想选择 。在价格方面， ，那就更好了。", "A：你们不选择互联网吗？这可是个新事物。", "B：互联网虽然成本会便宜些，但是 。", "A：不管选择什么媒体，相信你们有自己的原因。祝你们成功！"]}, {"type": "open", "title": "五、看谁说得好", "intro": "", "bank": [], "items": ["公司要为新产品做广告，大家正在办公室里讨论使用哪一种媒体来做广告，请你和你的朋友来分别说说在不同媒体做广告的优势和不足。"]}], "kewen": {"title": "中国人的广告观念", "paragraphs": ["广告是什么？就是“广而告之”的意思。在我们的意识里，广告就是用来宣传产品或者宣传服务的。宣传产品也好，宣传服务也罢，广告都是商家用于推销的一种手段。", "其实，广告没有这么简单。广告不仅是社会发展的一面镜子，而且是社会发展的一张晴雨表，可以反映社会经济状况的细微变化。同时，它又不仅仅是经济行为，它在传递产品信息的同时，也肩负着传播文化的责任。广告建立了商家和消费者之间的联系，并且在维系和消费者感情的同时，最终使得商家的产品成为了顾客们信赖的朋友。", "改革开放以来，中国广告观念的变化大致可分为五个阶段：产品力阶段（1979—1983）、文化力阶段（1984—1993）、媒介力阶段（1994—1997）、营销力阶段（1998—2003）和品牌力阶段（2004 年至今）。", "在产品力阶段，产品供不应求。商家认为，只要质量过硬，就不需要做广告，产品的质量本身就是广告。就如中国的那句俗语——“酒香不怕巷子深”，与其花钱做广告，不如提高产品本身的质量。即使做广告，也只是采用“告知式”的方式。当时，人们温饱问题尚未得到完全解决，只要有产品，就会有需求。在这个阶段，中国经济刚刚起步，企业和广告公司的经营处于比较低的层次，整个市场还处于“卖方市场”，没有真正的市场竞争。", "在文化力阶段，商家往往借助民族文化传播，尤其是体育领域里体现出的爱国精神来推销产品，如健力宝、太阳神等。“团结起来，振兴中华”的口号鼓舞着各行各业的工作者，民族情感成为了广告的卖点。", "在媒介力阶段，许多企业不惜重金在中央电视台等重要媒体投放广告，出现了“脑白金”“三株”等红极一时的“明星品牌”，然而，随着“标王模式”的失败，消费者对广告的信任度也随之下降。", "在营销力阶段，社会阶层逐步分化，新媒介发展迅速，分众传播、整合营销快速兴起。在这个阶段仅依靠广告已无法对产品的销售产生较大的推动作用，广告影响力下降，消费者变得更为挑剔，更加多元，维护自己权益的意识也不断增强。", "在品牌力阶段，中国人均 GDP 超过 1000 美元（2003 年开始），标志着中国社会和经济发展进入了一个崭新的时期。随着新经济形式的发展，中国广告业也发生了巨大变革，面对一批老字号品牌的倒闭，部分商家开始变得更为理性，不再只求短期效益，而以积累品牌资本为主要目的。以海尔电器和青岛啤酒为代表的中国民族品牌开始走向世界。", "通过上述五个阶段的变化可以看出，国家经济的开放程度和生产力的发展水平直接影响着时代观、经营观和消费观，是三者变迁的根本动因。同时，它也告诉我们，要理性看待广告的作用。质量是成功的基础，在此前提下，广告传播者只有抓住特定时代消费者的特定需求，并采用适当的传播方式，才可能获得最后的成功。"]}, "kewen_shengci": [{"word": "意识", "pos": "名词", "def": "人的头脑对于客观物质世界的反映，是感觉、思维等各种心理过程的总和", "pinyin": "yì shí"}, {"word": "推销", "pos": "动词", "def": "推广销路", "pinyin": "tuī xiāo"}, {"word": "反映", "pos": "动词", "def": "表现出的事物的性质", "pinyin": "fǎn yìng"}, {"word": "肩负", "pos": "动词", "def": "担负、承当", "pinyin": "jiān fù"}, {"word": "传播", "pos": "动词", "def": "传送或散布", "pinyin": "chuán bō"}, {"word": "信赖", "pos": "动词", "def": "信任并依靠", "pinyin": "xìn lài"}, {"word": "阶段", "pos": "名词", "def": "事物发展过程中的区间段落", "pinyin": "jiē duàn"}, {"word": "媒介", "pos": "名词", "def": "使双方（人或事物）发生关系的人或物", "pinyin": "méi jiè"}, {"word": "借助", "pos": "动词", "def": "取得别的人或事物的帮助", "pinyin": "jiè zhù"}, {"word": "鼓舞", "pos": "动词", "def": "激发，让人努力", "pinyin": "gǔ wǔ"}, {"word": "不惜", "pos": "动词", "def": "不吝惜", "pinyin": "bù xī"}, {"word": "标志", "pos": "动词", "def": "表明事物的特征", "pinyin": "biāo zhì"}, {"word": "崭新", "pos": "形容词", "def": "非常新", "pinyin": "zhǎn xīn"}, {"word": "老字号", "pos": "名词", "def": "时间比较长的老店", "pinyin": "lǎo zì hào"}, {"word": "倒闭", "pos": "动词", "def": "企业因亏损或无法维持而停业", "pinyin": "dǎo bì"}, {"word": "效益", "pos": "名词", "def": "效果和利益", "pinyin": "xiào yì"}, {"word": "变迁", "pos": "动词", "def": "情况的变化迁移", "pinyin": "biàn qiān"}], "kewen_yuyandian": [{"num": "1", "sentence": "在我们的意识里，广告就是用来宣传产品或者宣传服务的。", "explanation": [], "examples": ["宣传好人好事，才能使社会风气逐渐好起来。", "做了点好事完全是应该的，不应该到处宣扬。"], "extra": "注意：宣传—宣扬\n两者之间的区别是“宣传”比“宣扬”更为常用，从感情色彩上来看，“宣传”是中性词，“宣扬”略带贬义。例如：\n即学即用：请用“宣传”“宣扬”填空\n(1) 他大学毕业以后，一直做 工作。\n(2) 帮助别人解决问题是好事，但是不应该过分 。\n(3) 中国各种媒体的一个重要任务就是 国家的方针、政策和各种法规。\n(4) 很多商家为了吸引消费者的注意，过分 自己产品的好处。"}, {"num": "2", "sentence": "宣传产品也好，宣传服务也罢，广告都是商家用于推销的一种手段。", "explanation": ["“X X 也好（也罢），X X 也好（也罢），都……”，连用两个或更多，表示在任何情况下都如此。常与上文中的“不管”“无论”等和下文中的“都”“也”等呼应。"], "examples": ["你想去也好，不想去也好，都不应该骂人，更不应该打人。", "花也罢，鸟也罢，什么也引不起他的兴趣。"], "extra": "即学即用：用“XX 也好（也罢），XX 也好（也罢）”完成句子\n(1) A：你的广告策划案写完了吗？\nB：，总算是写完了。\n(2) A：昨晚你生病了，今天别去上班了。\nB：今天的会议非常重要， 都得去参加会议。\n(3) A：听说总公司今天派人来咱们这儿检查工作。\nB：，咱们都应该认真工作。"}, {"num": "3", "sentence": "可以反映社会经济状况的细微变化。", "explanation": [], "examples": ["很多人写信向上边反映他的问题。", "他的事迹在大学生中引起了强烈的反应。", "这种药我吃了以后有过敏反应。"], "extra": "注意：反映—反应\n“反映”和“反应”是同音词，但两者的词义、用法和书写形式都不同。“反映”比喻把客观事物的实质表现出来，或把情况、意见等告诉上级有关部门。“反应”是指有机体受到外部刺激而引起相应的活动；事情所引起的意见、态度和行动或打针、吃药引起的不舒服的感觉。例如：\n即学即用：请用“反映”“反应”填空\n(1) 报纸、电视这些媒体要准确 老百姓的意愿。\n(2) 听了这句话，他的 很强烈。\n(3) 别担心，这是正常 ，很多人吃了这种药都会感觉不舒服，不想吃饭。"}, {"num": "4", "sentence": "与其花钱做广告，不如提高产品本身的质量。", "explanation": ["“与其……不如……”，比较两件事的利弊而决定取舍时，表示放弃或不赞成的一面。例如："], "examples": ["等了一个小时他还没回来，与其在这里等他，不如去找他。", "与其坐在这里想怎么做广告，不如自己动手先做一做。"], "extra": "即学即用：请用“与其……不如……”完成句子\n(1) A：听说你们最近在找中天电视台做广告，广告费很贵吧？\nB：是啊。我也在考虑这件事，与其在这儿花这么多钱做广告， 。\n(2) A：听说你们单位最近在招聘，情况怎么样？\nB：来的人挺多，但是满意的不多。 ，不如空着岗位不招人。"}, {"num": "5", "sentence": "以海尔电器和青岛啤酒为代表的中国民族品牌开始走向世界。", "explanation": ["“以……为……”，“把……作为”或“认为……是……”。例如：", "另外，“以……为”结构中，“为”的后面还可以是形容词，表示比较起来怎么样。例如："], "examples": ["学生在上学期间，可以适当去做兼职，增加一些工作经验，但是必须以学习为主。", "中国很多城市的风景非常漂亮，这些城市可以以旅游业为主要产业来发展经济。", "这个地方风景真漂亮，以发展旅游业为宜。", "这部小说集以描写大城市的作品为最多。"], "extra": "即学即用：请用“以……为”完成句子\n(1) A：你觉得快餐业在中国的发展怎么样？可以举个例子吗？\nB：快餐业在中国发展得很不错，我下面 。\n(2) A：你们班的留学生主要是来自哪个国家的？\nB：我们班的留学生 。\n(3) A：你觉得哪个品牌的手机最好？\nB：我认为 。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["宣传", "产品"], ["肩负", "重任"], ["商家", "倒闭"], ["传播", "文化"], ["不惜", "重金"], ["反映", "变化"], ["崭新", "时期"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["标志", "借助", "鼓舞", "反映", "传播", "肩负", "信赖", "不惜", "倒闭"], "items": [{"text": "现在的环境污染问题日益严重。我们___保护环境的重任。", "answer": "肩负"}, {"text": "很多家长为了让孩子有一个好的学习环境，___重金送孩子出国留学。", "answer": "不惜"}, {"text": "这家商店以信誉为本，获得了消费者的___。", "answer": "信赖"}, {"text": "这家公司由于受金融危机的影响，今年年底___了。", "answer": "倒闭"}, {"text": "现在信息___的速度快得惊人，不管在世界任何地方发生的事情，几分钟甚至几秒钟之内就传遍了全世界。", "answer": "传播"}, {"text": "这幅画___出了画家对大自然的热爱。", "answer": "反映"}, {"text": "这家公司___先进的管理模式，大大提高了生产效率。", "answer": "借助"}, {"text": "这是一个令人___的好消息。", "answer": "鼓舞"}, {"text": "这次重要的会议___着一个新时期的开始。", "answer": "标志"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["便宜的网络广告与其……不如昂贵的电视广告选择选择", "新提高工作技术使得明显效率", "中心目前以……为广告模式的消费"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["A：去年的经济那么低迷，你们的销售额怎么反而提高了？", "B：这就是广告的作用。我们不惜 。", "A：现在做广告真的那么有用吗？", "B：对于众多习惯了“以生产为中心”的消费模式的人来说，广告没有那么重要，他们认为与广告相比， 。但是，现在对于“以消费为中心”的消费模式的人来说，广告不仅可以宣传 ，而且可以传播 。", "A：但是我也看到好多以前做广告的企业现在都倒闭了，很多人都不信任广告了。", "B：这也是好事，这标志着 。不管广告做得有多好，都要以 为 。"]}, {"type": "open", "title": "五、看谁说得好", "intro": "请根据下面的四幅图片，来谈谈每幅图分别代表了中国什么时期的广告以及广告在这一时期的特点。", "bank": [], "items": ["图 1 图 2 图 3 图 4"]}, {"type": "open", "title": "六、看谁演得好", "intro": "", "bank": [], "items": ["人物 1：夏天就要来了，你是一名啤酒公司的广告部经理。\n任务：去腾讯网谈你们公司即将在网上推出的广告。\n要求：能够表达清楚你们的啤酒和同类产品相比，有什么优势，卖点在哪里，并把广告的价格尽量压低。", "人物 2：腾讯网的广告总监。\n任务：和一家啤酒公司的广告部经理进行谈判。\n要求：能够根据对方的要求，突出和其他的媒体以及同类广告公司相比，你们设计广告的优势，尽量抬高广告的价格。\n角色扮演：和身边的同学分别扮演上面的人物，模拟真实场景，展开一段对话。"]}, {"type": "open", "title": "七、看谁写得好", "intro": "", "bank": [], "items": ["假如你是一位净化器公司的广告部经理，请你为你的净化器设计一个广告。要求广告词能展现你的产品的优势。"]}]}, {"id": 9, "title": "市场调查", "daodu": ["市场调查有什么作用？", "一般要怎么做市场调查？"], "hexinjv": ["咱们的产品正是得益于上面几个因素才取得了成功。", "去年是去年，今年是今年，市场的情况和消费者的需求是会随时变化的。", "丰田一旦进入豪华车市场，就必须以这一领域的顶级对手为敌。", "这种做法简直就如同在麦当劳店里销售昂贵的牛排。"], "duihua": {"intro": "销售部在开会分析市场调查的结果。", "lines": [{"speaker": "吴经理", "text": "今天我们开会的目的是根据去年的业绩来分析一下今年公司所面临的形势。"}, {"speaker": "小王", "text": "与其他公司相比，去年我们公司取得了很好的业绩，同比增长了 15 个百分点。"}, {"speaker": "吴经理", "text": "大家认为是什么原因促使消费者购买咱们的产品呢？"}, {"speaker": "小王", "text": "去年咱们的产品主要是针对女性，产品的外观设计得很漂亮，还有一些附加功能，而且价格也不太高。咱们的产品正是得益于上面几个因素才取得了成功。但是美中不足的是由于我们把重点都放在市场方面，所以在产品开发方面相对弱一些。"}, {"speaker": "吴经理", "text": "是的，下半年我们打算针对年轻人推出一款有竞争力的新产品。"}, {"speaker": "小王", "text": "年轻人追求时尚，产品的定位必须紧紧围绕年轻人的这一特点来设计。"}, {"speaker": "吴经理", "text": "但是仅凭感性认识还是不够的。为了确保可以充分了解我们的目标消费群，我们必须要做市场调查。"}, {"speaker": "小王", "text": "去年咱们不是做了市场调查了吗？用去年的数据不可以吗？"}, {"speaker": "吴经理", "text": "去年是去年，今年是今年，市场的情况和消费者的需求是会随时变化的。我们必须了解最新的市场情况。为了做好市场调查，小王，你要找两家专业的调研公司。"}, {"speaker": "小王", "text": "现在的消费者了解新产品的途径也很多，我们也可以在网站上进行问卷调查。"}, {"speaker": "吴经理", "text": "我已经安排小李去联系了，至于方案，你先写一个草稿，我们下次开会时再加以讨论。"}, {"speaker": "小王", "text": "好的，回去我就设计方案，下周五之前我会把方案交给您。"}, {"speaker": "吴经理", "text": "除了发放调查问卷之外，遇到有代表性的客户，你们最好也能对其进行录音采访。"}, {"speaker": "小王", "text": "您放心，我会亲自负责这次调查。到时候会安排有经验的员工去调查。"}, {"speaker": "吴经理", "text": "这我就放心了。"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "items": [{"text": "小王公司的业绩比上个月增长了 15%。", "answer": false}, {"text": "去年的产品取得成功是因为外观漂亮，价位低。", "answer": true}, {"text": "下半年他们打算针对女性推出一款新产品。", "answer": false}, {"text": "他们公司自己设计方案做市场调查。", "answer": false}, {"text": "总经理安排了别的人去做市场调查。", "answer": true}, {"text": "市场调查过程中，要对所有的客户进行录音。", "answer": false}]}, {"type": "open", "title": "二、回答问题", "items": ["小王的公司今天为什么开会？", "小王他们公司去年的业绩怎么样？", "去年的产品为什么会取得成功？", "今年他们要推出什么样的新产品？", "他们为什么要做市场调查？", "设计问卷的时候要注意什么问题？"]}], "duihua_shengci": [{"word": "形势", "pos": "名词", "def": "指事物的发展状况", "pinyin": "xíng shì"}, {"word": "同比", "pos": "形容词", "def": "今年某个时候与去年相同的时间进行比较", "pinyin": "tóng bǐ"}, {"word": "促使", "pos": "动词", "def": "推动某物或使某事达到一定目的", "pinyin": "cù shǐ"}, {"word": "附加", "pos": "动词", "def": "额外增加", "pinyin": "fù jiā"}, {"word": "追求", "pos": "动词", "def": "尽力寻找", "pinyin": "zhuī qiú"}, {"word": "围绕", "pos": "动词", "def": "包围环绕", "pinyin": "wéi rào"}, {"word": "确保", "pos": "动词", "def": "切实保证", "pinyin": "què bǎo"}, {"word": "途径", "pos": "名词", "def": "方法、路子", "pinyin": "tú jìng"}, {"word": "问卷", "pos": "名词", "def": "为了了解人们对某个问题的看法而设计的一系列相关的问题", "pinyin": "wèn juǎn"}, {"word": "草稿", "pos": "名词", "def": "初步写的文稿或方案", "pinyin": "cǎo gǎo"}, {"word": "采访", "pos": "动词", "def": "搜集寻访", "pinyin": "cǎi fǎng"}], "duihua_yuyandian": [{"num": "1", "sentence": "大家认为是什么原因促使消费者购买咱们的产品呢？", "explanation": ["注意：促使—促进", "两者的区别在于：“促使”和“促进”的宾语不同，“促进”的宾语是工作、学习、事业等，“促使”的宾语是人或由人组成的组织、公司等。例如："], "examples": ["正是这件事促使他放弃了出国留学的机会，留在国内发展。", "发展教育当然能促进经济的发展、并促进社会的进步和老百姓素质的提高。"], "extra": "即学即用：请用“促使”“促进”填空\n(1) 新技术___了人类社会的快速发展。\n(2) 政治稳定、经济发展和社会进步，___很多外国企业到中国投资。\n(3) 中国的改革开放政策___了中国经济的快速发展。\n(4) 上次的交通意外___他改变了看待问题的角度。"}, {"num": "2", "sentence": "咱们的产品正是得益于上面几个因素才取得了成功。", "explanation": ["“得益于”表示在某方面得到好处。一般“得益于”前面是得到的好处，后面是原因。例如："], "examples": ["中国经济的快速发展得益于三十多年的改革开放。", "三星公司的成功得益于一直以来的品牌策略。"], "extra": "即学即用：请用“得益于”完成句子\n(1) A：恭喜你啊，这次又拿到了亚运会的冠军。\nB：说实话，我的父母和家里人为我付出了很多，我的成功___。\n(2) A：中国的经济发展得好快啊，现在的北京已经和以前完全不同了。\nB：自从改革开放以后，中国就发生了巨大的变化。中国的发展___。"}, {"num": "3", "sentence": "去年是去年，今年是今年，市场的情况和消费者的需求是会随时变化的。", "explanation": ["“X（名）是 X, Y（名）是 Y……”，表示两者不同，不能同等对待。例如："], "examples": ["你是你，我是我，咱们的工作要分清楚。", "北京是北京，上海是上海，你在北京的经验未必适合上海。"], "extra": "即学即用：请用“X（名）是 X, Y（名）是 Y……”完成句子\n(1) A：你昨天不是说合同没问题吗？怎么今天又不同意了？\nB：___，出现了新情况，我也没办法。\n(2) A：你们公司的王经理同意进行这个新项目的研发，你可以给他打电话啊！\nB：___，我们考虑问题的重点不同。"}, {"num": "4", "sentence": "我们下次开会时再加以讨论。", "explanation": ["“加以”，一般用在两个音节的动词前，表示如何对待或处理前面所提到的事物。例如："], "examples": ["最近的环境污染问题太严重了，政府需要对这个问题加以认真考虑。", "最近的净化器市场太混乱了，需要认真加以规范。"], "extra": "即学即用：请用“加以”完成下面的句子\n(1) A：最近听说你们公司的售后服务不如以前了，是真的吗？\nB：是有点小问题，不过___。\n(2) A：我昨天看了你交上来的报告，可是有些地方不是太明白。\nB：您可以用红线标注一下，回去我会对这些地方___。"}], "duihua_lianxi": [{"type": "match", "title": "一、词语连线", "items": [["追求", "时尚"], ["销售", "业绩"], ["设计", "问卷"], ["制定", "方案"], ["围绕", "目标"]]}, {"type": "fill", "title": "二、选词填空", "bank": ["问卷", "采访", "同比", "追求", "确保", "途径", "促使", "业绩"], "items": [{"text": "随着网络的发展，人们获得信息的___越来越多。", "answer": "途径"}, {"text": "为了了解消费者的心理，我们专门设计了调查___。", "answer": "问卷"}, {"text": "在对王经理的___中发现，他的成功得益于年轻时积累的实践经验。", "answer": "采访"}, {"text": "有人为了名声，有人为了利益，每个人所___的东西都各不相同。", "answer": "追求"}, {"text": "今年中国的第三产业发展迅速，___增长了 12%。", "answer": "同比"}, {"text": "今年公司推出的新产品很受消费者的欢迎，取得了很好的___。", "answer": "业绩"}, {"text": "为了___经济的稳定快速增长、中国实行了新的经济政策。", "answer": "确保"}, {"text": "这一次失败___他反思自己的错误，并最终使得他走向了成功。", "answer": "促使"}]}, {"type": "open", "title": "三、连词成句", "items": ["1．的得益于成功产品新调查市场对的", "2．会加以问题我们对认真这个考虑", "3．中国情况是美国是一样不美国中国"]}, {"type": "open", "title": "四、完成对话", "items": ["A：上个月我们公司的业绩并不理想，销售量同比下降了 4%。今天我们开会的目的是___。\nB：用什么方法可以促使消费者购买咱们的产品呢？咱们需要讨论一下。\nA：我认为咱们的产品___很有竞争力。\nB：但是___，因而需要再做一下市场调查，以便___。\nA：可以。你去找两个调研公司___。\nB：好的，您放心。我会亲自___。"]}, {"type": "open", "title": "五、看谁演得好", "items": ["人物 1：公司秘书小王\n任务：接受了对手机市场进行调查的任务，并向总经理进行汇报。\n要求：设计好调查的各方面，比如人们的偏好，期望的价位等。", "人物 2：公司的总经理\n任务：小王向你汇报手机市场调查的方案，并对小王的方案进行更正。", "角色扮演：和你身边的同学分别扮演上面的人物，模拟真实的场景，展开一段对话。"]}], "kewen": {"title": "雷克萨斯的成功", "paragraphs": ["诞生于 1989 年的雷克萨斯 (Lexus) 是日本丰田汽车公司旗下的豪华汽车品牌。它仅仅用了 10 年的时间，就成为了全美豪华车销量最大的品牌。为大家所熟知的传统奢侈轿车品牌如梅赛德斯－奔驰也好，宝马也好，其销售量都远远不及雷克萨斯。如今，接近 200 万辆雷克萨斯轿车行走在美国的大街小巷。雷克萨斯过去在中国的中文译名是“凌志”，2004 年 6 月 8 日，丰田公司在北京宣布将 Lexus 的中文译名由“凌志”改为“雷克萨斯”，开始全面进军中国的豪华车市场。", "众所周知，在 20 世纪 80 年代初，丰田虽然已经是非常成功的汽车制造品牌，在全美占据 8％的市场份额，但是当时丰田在人们的眼中，只是值得信赖的廉价轿车制造商，如果要推出豪华轿车就意味着要打破过去坚固耐用可靠而简单的模式。那么丰田车是如何成功占领高级轿车市场，并使雷克萨斯跻身世界顶级豪车之列的呢？", "1983 年 8 月，丰田汽车公司召开了一次意义重大的董事会，它是雷克萨斯汽车的起点。这次会议用一些普通的讨论话题掩饰着丰田公司的真正想法。在会上，董事会主席丰田英二向公司的高层主管、设计师、工程师和企业战略研究专家们提出了一个问题：我们可以创造出一辆豪华汽车去挑战顶级豪华轿车市场吗？出人意料的是，所有人的回答都是一样的—“可以”。虽然大家认同了这个目标，但是丰田公司的所有高层，甚至丰田英二本人也知道，丰田公司将面临着巨大的挑战。这种挑战一方面来自于行业本身，丰田一旦进入豪华车市场，就必须以这一领域的顶级对手为敌，丰田要面对梅赛德斯－奔驰 S 级，要和宝马的顶级 7 系轿车竞争，然而豪华车市场的消费者需求取向对于丰田来说又太过陌生。丰田公司所面临的更大挑战则来自于市场。最让丰田为难的是雷克萨斯的名气。丰田没有销售过豪华车。你能想象去劝说消费者购买一辆与廉价的花冠出自同一公司，但是价格却要数万美元的豪华车，是多么困难的事情吗？丰田在豪华车市场的主要对手凭借他们的品牌就可以卖车了。因为它叫梅赛德斯－奔驰，所以我买它；因为它叫宝马，所以我喜欢它。但是，消费者会愿意拿出接近一辆梅赛德斯－奔驰 S 级的钱去买丰田汽车，甚至去买一辆丰田生产又不叫丰田的车吗？这种做法简直就如同在麦当劳店里销售昂贵的牛排。", "为了应对竞争对手的挑战，雷克萨斯必须以美国为起点，生产出高质量的产品。为此，丰田公司投入了高达 10 亿美元的资金，进行了长达 6 年的产品研发，1400 名工程师以及 2300 名专业技师为此付出了不懈的努力，并对 450 款车型进行了分析。这些工作保证了雷克萨斯卓越的性能。", "同时为了更好地了解市场需求，雷克萨斯对美国的消费者需求进行了更为广泛和细致的分析。雷克萨斯专门对奔驰、宝马、林肯等豪车的所有者进行了市场调查，以了解他们对于奢侈型豪车的定位，以及消费者本身的生活方式和业余爱好，从而使得雷克萨斯能够满足他们的消费需求，并改进他们对于现有车辆不满意的地方。雷克萨斯同时也注重对潜在消费者的分析。他们发现很多年轻人是丰田汽车忠实的消费者，但是他们想购买丰田旗下更为高档的汽车，这也给丰田汽车带来了入主豪车市场的机遇。", "可以说，雷克萨斯这个品牌从创立之日起，在北美市场，就赢得了美国梦“胜利者的象征”的美誉。"]}, "kewen_shengci": [{"word": "诞生", "pos": "动词", "def": "出生、或比喻新事物的出现", "pinyin": "dàn shēng"}, {"word": "奢侈", "pos": "形容词", "def": "浪费钱财，过分追求享受", "pinyin": "shē chǐ"}, {"word": "众所周知", "pos": "成语", "def": "大家都知道", "pinyin": "zhòng suǒ zhōu zhī"}, {"word": "打破", "pos": "动词", "def": "突破原有的限制、约束等", "pinyin": "dǎ pò"}, {"word": "跻身", "pos": "动词", "def": "使自己的（地位）上升到某种行列、位置", "pinyin": "jī shēn"}, {"word": "掩饰", "pos": "动词", "def": "设法遮盖、掩盖（真实情况），不想让他人发现", "pinyin": "yǎn shì"}, {"word": "出人意料", "pos": "成语", "def": "没想到，在人们的意料之外", "pinyin": "chū rén yì liào"}, {"word": "挑战", "pos": "动词", "def": "鼓动对方与自己竞赛", "pinyin": "tiǎo zhàn"}, {"word": "凭借", "pos": "动词", "def": "依靠", "pinyin": "píng jiè"}, {"word": "不懈", "pos": "副词", "def": "不放松", "pinyin": "bù xiè"}, {"word": "保证", "pos": "动词", "def": "确保既定的要求和标准", "pinyin": "bǎo zhèng"}, {"word": "细致", "pos": "形容词", "def": "精细", "pinyin": "xì zhì"}, {"word": "机遇", "pos": "名词", "def": "有利的条件和环境", "pinyin": "jī yù"}, {"word": "赢得", "pos": "动词", "def": "取得；博得", "pinyin": "yíng dé"}], "kewen_yuyandian": [{"num": "1", "sentence": "丰田一旦进入豪华车市场，就必须以这一领域的顶级对手为敌。", "explanation": ["“一旦”，不确定的时间，表示有一天。一般与“就”连用。例如："], "examples": ["一旦学会了骑自行车，就不会忘记。", "一旦发现了问题，就要及时去解决。"], "extra": "即学即用：请用“一旦”完成句子\n(1) A：你们公司会涉足房地产领域吗？\nB：我们公司___。\n(2) A：你的记忆力真好，学过的东西你会忘记吗？\nB：我觉得不会。"}, {"num": "2", "sentence": "丰田在豪华车市场的主要对手凭借他们的品牌就可以卖车了。", "explanation": ["“凭借”，依靠，一般和名词组合，可放在主语前。类似的结构还有“凭着”“借助”等。例如："], "examples": ["凭借多年的经验，他顺利解决了问题。", "凭借不断的创新，联合利华跻身世界 500 强。"], "extra": "即学即用：请用“凭借”完成句子\n(1) A：中国东部的经济为什么发展那么快啊？\nB：这是因为东部地区靠海，它___使经济快速发展。\n(2) A：苹果公司为什么那么成功呢？\nB：___。"}, {"num": "3", "sentence": "这种做法简直就如同在麦当劳店里销售昂贵的牛排。", "explanation": ["“简直”，强调完全如此或差不多如此，含夸张的语气。例如："], "examples": ["这幅画画得真好，简直和真的一样。", "事情来得太突然，我简直不知道怎么办才好。"], "extra": "即学即用：请用“简直”完成句子\n(1) A：你来中国多长时间了？\nB：我来中国五年了。\nA：你的汉语说得真好，简直___。\n(2) A：你们公司刚来的王经理怎么样？\nB：他___，每天只知道工作。"}, {"num": "4", "sentence": "同时为了更好地了解市场需求，雷克萨斯对美国的消费者需求进行了更为广泛和细致的分析。", "explanation": ["注意：细致—细心", "两者的区别在于：“细致”可以描写东西，也可以描写人，而“细心”只能描写人。例如："], "examples": ["一般来说，女孩子要比男孩子细心。（也可以说女孩子要比男孩子细致）", "要深入细致地工作，把群众的意见反映上来。"], "extra": "即学即用：请用“细致”“细心”填空\n(1) 在护士的___照顾下，妈妈的身体恢复得很快。\n(2) 人口普查是一项复杂而___的工作。"}, {"num": "5", "sentence": "这也给丰田汽车带来了入主豪车市场的机遇。", "explanation": ["注意：机遇—机会", "两者的区别在于：“机会”是希望遇到的时机，相对比较容易，而“机遇”强调恰好遇到的、好的、有利的情况或时机，比较难遇到。此外，“机会”可以做“有”或“没有”的宾语，“机遇”不能。例如："], "examples": ["中国抓住了加入世界贸易组织 (WTO) 的机遇，经济快速发展。", "如果有机会我一定去中国的长城看看。"], "extra": "即学即用：请用“机遇”“机会”填空\n(1) 我今天给他们公司的人力资源部打电话问我是否还有面试的___。\n(2) 这次世界杯在我们国际举办，我们一定要抓住这个难得的___，做好广告营销。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "items": [["打破", "模式"], ["不懈", "努力"], ["掩饰", "想法"], ["赢得", "美誉"], ["保证", "性能"], ["分析", "细致"], ["挑战", "对手"], ["带来", "机遇"]]}, {"type": "fill", "title": "二、选词填空", "bank": ["赢得", "诞生", "奢侈", "模式", "跻身", "保证", "不懈", "挑战", "掩饰", "出人意料"], "items": [{"text": "我们已经向总公司___要提前完成今年的销售任务。", "answer": "保证"}, {"text": "这家公司以完善而富有人性化的售后服务___了消费者的好感。", "answer": "赢得"}, {"text": "每个国家都有自己的国情，不能要求所有的国家采用一样的发展___。", "answer": "模式"}, {"text": "谷歌公司___于美国旧金山的山景城。", "answer": "诞生"}, {"text": "这些有钱人，一到国外，第一件事就是去买___品。", "answer": "奢侈"}, {"text": "经过___的努力，他终于获得了成功。", "answer": "不懈"}, {"text": "加入世界贸易组织固然有利于经济的发展，但是同时中国的企业也会面临来自国外同行的___。", "answer": "挑战"}, {"text": "中国像北京、上海这样的大城市现在已经___于国际大都市之列。", "answer": "跻身"}, {"text": "真___，昨晚的比赛他竟然输了。", "answer": "出人意料"}, {"text": "我没法再继续___下去了，很快他就会知道事情的真实情况。", "answer": "掩饰"}]}, {"type": "open", "title": "三、连词成句", "items": ["1．外资企业都规则……也好……也好中国企业要遵守", "2．就和市场必须豪车雷克萨斯竞争一旦进入宝马", "3．是简直个中国通他", "4．自己凭借了他成功获得努力的"]}, {"type": "open", "title": "四、完成对话", "items": ["A：你最近换车了，怎么不开你的丰田了？\nB：雷克萨斯和丰田是同一家公司啊！\nA：丰田在我眼里只是廉价汽车的制造商，它是怎么使雷克萨斯___？\nB：是啊，这对丰田是一个巨大的挑战，为了能够生产卓越的产品，他们还对竞争对手的车型___。\nA：更重要的是，他们能看到自己将来的用户，他们很善于___。\nB：雷克萨斯的 L 形标志代表了___。\nA：我也喜欢雷克萨斯的广告词___。\nB：如果我有钱了，也一定买一辆雷克萨斯。"]}, {"type": "open", "title": "五、看谁说得好", "items": ["如果你来设计雷克萨斯在豪华车市场的定位，看到下面这个调查表，你会怎么定位雷克萨斯呢？并简要说说雷克萨斯是如何成功的。", {"kind": "table", "caption": "各豪华车款的购买理由及舍弃其他竞争车款的理由（20 世纪 80 年代）", "header": ["车　款", "购 买 理 由", "舍弃而改选其他车款的理由"], "rows": [["奔驰（Benz）", "品质、投资、价格、坚固耐用", "太小、外形不够时尚"], ["宝马（BMW）", "时尚、操控、性能", "路上有太多相同车款"], ["奥迪（Audi）", "时尚、空间、负担得起", "品质不佳、服务不佳"], ["沃尔沃（Volvo）", "安全、可靠、品质、坚固耐用", "外形四四方方像盒子"], ["捷豹（Jaguar）", "最具吸引力的外形", "品质不佳，内部空间太小"]]}]}, {"type": "open", "title": "六、看谁演得好", "items": ["人物 1：公司总经理", "人物 2：研发部门的经理", "任务：总经理安排研发部门设计一款新手机，可以和苹果、三星手机竞争。请你根据雷克萨斯成功的经验，来设计一下你要推出的新手机的优点。", "角色扮演：和身边的同学分别扮演上面两个人物，模拟真实场景，展开一段对话。"]}, {"type": "open", "title": "七、看谁写得好", "items": ["假如你是小王，总经理安排你做市场调查，请你根据课文里提到的内容，设计一份雷克萨斯对美国市场的调查问卷。"]}]}, {"id": 10, "title": "商务谈判", "daodu": ["你知道国际谈判中应该注意哪些问题吗？", "现代商务谈判需要具备什么技巧？"], "hexinjv": ["贵公司的生产好归好，只是不知贵方的报价如何？", "贵方未免也太小气了吧！", "话是这么说，可是贵方的报价实在让我们很为难。", "好的谈判者并不是一味固守立场。"], "duihua": {"intro": "高副总带领新锐公司团队和中天公司代表大卫一行进行商务谈判。", "lines": [{"speaker": "高副总", "text": "欢迎各位代表来我们公司进行业务洽谈，我是新锐公司的副总经理高雷，首先，由我来介绍我方的谈判代表，这位是销售部王中。"}, {"speaker": "大卫", "text": "非常高兴认识你们，我是中天国际有限公司亚洲区副总经理大卫。这是我们公司的技术总监彼得先生。"}, {"speaker": "高副总", "text": "欢迎你们！（微笑点头）好的，那么我们开始吧！"}, {"speaker": "大卫", "text": "我方了解到贵公司拥有目前亚洲最大的生产基地，而且拥有独特的生产技术，我们慕名而来就是为了采购一批这样的产品。那么，就请贵方详细介绍一下吧！"}, {"speaker": "小王", "text": "我公司产品连续八年获得 ISO 国际产品质量认证，公司基地园区 2013 年被北京市政府评为“标准化生产示范基地”。"}, {"speaker": "彼得", "text": "贵公司的生产好归好，只是不知贵方的报价如何？"}, {"speaker": "高副总", "text": "那贵公司此行的采购计划是……"}, {"speaker": "大卫", "text": "我方暂定采购特级产品 2000 件，目的港为新西兰琐加雷港口，时间为 2014 年 12 月 15 日之前。"}, {"speaker": "高副总", "text": "我方的报价是 380 美元／件。"}, {"speaker": "大卫", "text": "贵方的报价实在太高了。根据我公司长期的国际采购价格，平均价格也只有 200 美元／件，况且，你方的产品并没有什么特殊之处。"}, {"speaker": "高副总", "text": "大卫先生，我们公司产品采用国际领先的独家制作工艺，与其他公司相比，就这种品质来说，我方的报价是非常合理的。"}, {"speaker": "大卫", "text": "非常合理？贵方的报价如此离谱，还算合理吗？我实在怀疑贵方的诚意。"}, {"speaker": "小王", "text": "如此合理的报价怎么会缺乏诚意？大卫先生，中国有句俗话，百闻不如一见。贵方远道而来，想必也不想空手而归吧！我们不如先来看看样品吧。"}, {"speaker": "场景", "text": "（呈上样品）"}, {"speaker": "彼得", "text": "贵方的产品的确不错，不然我们也不会来商谈了。"}, {"speaker": "高副总", "text": "很高兴贵方能喜欢我们的产品。考虑到我们双方的相互需求，为表诚意，我方愿意将原报价降至 350 美元／件。"}, {"speaker": "彼得", "text": "仅仅让了 30 美元？贵方未免也太小气了吧！"}, {"speaker": "小王", "text": "那么贵方认为什么样的价格才算合理呢？"}, {"speaker": "彼得", "text": "我方认为最合理的报价应该是 210 美元／件。如果不能以此价格达成协议，那么很遗憾我们就只能去其他公司看看了。"}, {"speaker": "小王", "text": "贵方的报价也不见得合理呀！不瞒您说，有很多国外销售商正在与我方洽谈，而且他们开出的条件都比你方优越。况且，贵方如在其他地方采购，根本不可能得到向我方这样大的供应量。"}, {"speaker": "大卫", "text": "话是这么说，可是贵方的报价实在让我们很为难。"}, {"speaker": "高副总", "text": "280 美元。您看怎么样？这确实是我们能够承受的最低价格了，不知您意下如何？"}, {"speaker": "大卫", "text": "虽然贵方已经做出了一定的让步，但是此价格我方仍然难以接受。不过如果贵方愿意将价格降至我方刚才的报价，我方愿意将采购数量提高到 2500 件，并愿意与贵公司建立长期友好的合作关系。"}, {"speaker": "高副总", "text": "抱歉，大卫先生，我方只能一次性为贵方提供 2200 件的特级产品。但如果贵方愿意另购优质一级产品 300 件，我方愿意将特级产品的价格降至 280 美元／件，同时按 200 美元／件的最低价格出售一级产品。要知道，这可是市场上罕见的低价啊！"}, {"speaker": "大卫", "text": "好吧！我方可以接受。但是为确保合理降低风险，我方要求所有产品按 10％加成投保，保险费用由贵方承担。"}, {"speaker": "高副总", "text": "这个没有问题！"}]}, "lijie": [{"type": "open", "title": "回答问题", "items": ["新锐公司的产品质量怎么样？", "中天公司的采购计划是什么？", "双方意见不一样的地方是什么？", "新锐公司通过什么方式让中天公司逐渐认同了他们的价格？", "最后，双方达成了什么样的采购协议？"]}], "duihua_shengci": [{"word": "总监", "pos": "名词", "def": "一种职位的名称，一般是某项领域的第一监管人", "pinyin": "zǒng jiān"}, {"word": "基地", "pos": "名词", "def": "作为发展某种事业基础的地区，如工业建设基地", "pinyin": "jī dì"}, {"word": "慕名", "pos": "动词", "def": "指仰慕名声", "pinyin": "mù míng"}, {"word": "采购", "pos": "动词", "def": "购买", "pinyin": "cǎi gòu"}, {"word": "认证", "pos": "动词", "def": "一种信用保证形式，是指由国家认可的认证机构证明一个组织的产品、服务、管理体系符合相关标准、技术规范 (TS) 或其强制性要求的合格评定活动", "pinyin": "rèn zhèng"}, {"word": "离谱", "pos": "形容词", "def": "形容事物的发展脱离了规律性，不着调、不和谐，比喻一个人在说话、办事等方面不遵循惯例、习惯和规则", "pinyin": "lí pǔ"}, {"word": "遗憾", "pos": "形容词、名词", "def": "因为不够完美而感到可惜", "pinyin": "yí hàn"}, {"word": "优越", "pos": "形容词", "def": "比一般的要好", "pinyin": "yōu yuè"}, {"word": "承受", "pos": "动词", "def": "接受、承担", "pinyin": "chéng shòu"}, {"word": "罕见", "pos": "形容词", "def": "非常少见", "pinyin": "hǎn jiàn"}, {"word": "风险", "pos": "名词", "def": "遭受损失、伤害、不利或毁灭的可能性，危险", "pinyin": "fēng xiǎn"}, {"word": "投保", "pos": "动词", "def": "与保险人（通常是保险公司）订立保险合同，并按照保险合同支付保险费的过程", "pinyin": "tóu bǎo"}, {"word": "承担", "pos": "动词、名词", "def": "担当，担负，敢于担当的责任与义务", "pinyin": "chéng dān"}], "duihua_yuyandian": [{"num": "1", "sentence": "我们慕名而来就是为了采购一批这样的产品。", "explanation": ["“XX ＋而＋动词”是汉语成语中常见的一种构词法，前面的形容词或名词表示后面动作的方式或时间等，“而”在这里表示连接作用，凑足音节。", "注意：类似的词语"], "examples": ["日出而作 日落而息 三思而行", "乘兴而来 败兴而归 不辞而别", "尽力而为 知难而退 侃侃而谈", "脱颖而出 不欢而散 满载而归"], "extra": ""}, {"num": "2", "sentence": "贵公司的生产好归好，只是不知贵方的报价如何？", "explanation": ["“XX 归／是 XX, 可是／但是／不过……”，表示让步，有“虽然……但是……”的意思。例如："], "examples": ["工作归工作，可是平时是另一回事。", "咱们俩朋友归朋友，但是我肯定不会帮你作假。", "路远归路远，但你今天必须按时赶到会场。"], "extra": "即学即用：用“XX 归／是 XX, 可是／但是／不过……”完成对话\n(1) A：你今天吃早饭了吗？\nB：___\n(2) A：你们两个不是朋友吗？为什么还要这么计较价格？\nB：___"}, {"num": "3", "sentence": "贵方未免也太小气了吧！", "explanation": ["“未免”，实在是，不能不说是，指人对过分的事情不以为然，委婉地给予否定的评价。表示对某种行为不以为然，含有不赞许的意思。后面的词语多有表示过分的意思。例如："], "examples": ["你的发言未免长了些。", "初次见面，未免有些害羞。", "你说的未免也太严重了。"], "extra": "即学即用：用“未免”完成句子\n(1) 虽然是我的错，但你的话也___。\n(2) 每斤只降低 10 元，贵方___。"}, {"num": "4", "sentence": "话是这么说，可是贵方的报价实在让我们很为难。", "explanation": ["“话（说）是这么说，（可／可是）……”，口语句式，意思是“虽然是这样，但是……”，表示转折。例如："], "examples": ["话是这么说，可实际上真的干起来，不是那么回事。", "电视广告要比其他媒介好些。话是这么说，哪来的钱？"], "extra": "即学即用：用“话是这么说，可是……”完成对话\n(1) A：你不是说讨厌干这跑腿的活儿吗？\nB：___\n(2) A：中国不是有句俗话“酒香不怕巷子深”吗？\nB：___"}], "duihua_lianxi": [{"type": "match", "title": "一、词语连线", "items": [["条件", "优越"], ["工艺", "独特"], ["错得", "离谱"], ["慕名", "而来"], ["承担", "费用"]]}, {"type": "fill", "title": "二、选词填空", "bank": ["风险", "认证", "承受", "承担", "罕见", "离谱", "确保", "洽谈"], "items": [{"text": "他总认为自己是对的，但事实证明，他错得是多么___。", "answer": "离谱"}, {"text": "最近高副总亲自带领谈判专家前往中国___商务合作项目。", "answer": "洽谈"}, {"text": "在没有进行市场调查的基础上就研发新产品是需要冒很大___的。", "answer": "风险"}, {"text": "6 月下雪，这是一种十分___的天气。", "answer": "罕见"}, {"text": "既然错出在你身上，那你就必须___你的责任。", "answer": "承担"}, {"text": "为了___事情的顺利进行，公司各个部门都提前做了充足的准备。", "answer": "确保"}, {"text": "我们的产品质量绝对没有问题，全部通过了相关部门的质量___。", "answer": "认证"}, {"text": "在大家的一片反对声中，我还是觉得应该开发新产品，当时真是___了很大压力。", "answer": "承受"}]}, {"type": "open", "title": "三、扩展练习", "items": ["信赖 罕见 遗憾", "值得信赖\n质量值得信赖\n产品质量值得信赖\n他们公司产品质量值得信赖"]}, {"type": "open", "title": "四、给下列词语选择合适的位置", "items": ["1．我们公司在 A 北京市企业评选中 B 三次 C 获得 D 奖励。（连续）", "2．我们公司战略的 A 调整，是要 B 市场的变化而进行的，C 销售部门的调整 D 尤其突出。（根据）", "3．A 树绿了，花开了，天气 B 变暖了，C 人们 D 都穿上了春装。（确实）", "4．A 要想搞好国际贸易，我们 B 就必须要了解对方国家的文化习俗，C 就 D 很容易出现一些不必要的误解和麻烦。（不然）"]}, {"type": "open", "title": "五、完成句子", "items": ["1．我们公司的产品要优于其他公司。（就……来说）", "2．你还是不要出去玩了，现在时间太晚了，___。（况且）", "3．他现在虽然成绩不好，___。（不见得）", "4．___，我也不能原谅你。（即便）"]}, {"type": "open", "title": "六、看谁演得好", "items": ["人物 1：公司的广告部经理\n任务：要和电视台的广告部主任就新产品（比如手机）的广告问题进行谈判，尽量降低价格。", "人物 2：电视台广告部主任\n任务：要和某公司的广告部经理就产品的广告问题进行谈判，广告费越高越好。", "角色扮演：和身边的同学分别扮演上面的两个人物，模拟真实场景，展开一场商务谈判。"]}], "kewen": {"title": "国际商务谈判", "paragraphs": ["国际商务谈判是国际商务活动中不同利益主体之间，为了达成某笔交易，就交易的各项条件进行协商的过程。国际商务谈判的内容，不仅包括商务与技术方面的问题，还包括法律与政策，它是一项政策性、策略性、技术性和专业性很强的工作。国际商务谈判的结果，决定着合同条款的具体内容，从而确定合同双方当事人的权利和义务，因此买卖双方都很重视商务谈判这项重要的活动。", "在国际货物买卖中，交易双方分属不同的国家或地区，彼此不仅有不同的社会制度、政治制度、法律体系、经济体制和贸易习惯，还有不同的文化背景、价值观念、信仰和民族习惯，而且语言文字沟通方面也存在困难，因此，商务谈判是一项很复杂的工作。如何妥善处理其中出现的各种问题，在平等互利的基础上达成公平合理和切实可行的协议，就显得尤其重要。", "长期以来，人们在对商务谈判的认识上存在一定的误区，认为谈判一定是要争出个输赢来的。事实上，商务谈判是谈判各方当事人在实现双方商业利益过程中一个不断地化解冲突、实现谈判者最大利益的手段。谈判双方首先要树立的必须是“双赢”的意识。而所谓双赢就是你的利益必须以对方利益的存在为前提，你的利益在对方身上体现出来。一场谈判的结局应该兼顾双方利益，使谈判的双方都要有“赢”的感觉。", "那么如何实现双赢呢？双方在寻求对自己有利的方案的同时，也要满足对方的最大利益。好的谈判者并不是一味固守立场，而是要与对方充分交流，从双方的最大利益出发，创造各种解决方案。用相对较小的让步来换得最大的利益，这才是谈判的最终目的。", "在谈判界有一个广为流传的经典小故事。有一位妈妈把一个橙子给了邻居的两个孩子。这两个孩子便讨论如何分这个橙子，两个人吵来吵去，最终达成了一致意见，由一个孩子负责切橙子，而另一个孩子选橙子。结果，这两个孩子按照商定的办法各自拿了一半橙子，高高兴兴地回家了。第一个孩子回家后，把半个橙子的皮剥掉扔进了垃圾桶。把果肉放到果汁机里打果汁喝。另一个孩子回到家把果肉挖掉扔进了垃圾桶，把橙子皮留下来磨碎了，混在面粉里烤蛋糕吃。", "从上面的故事，我们可以看出，虽然两个孩子各自拿到了看似公平的一半，但他们各自得到的东西却并没有被充分利用。这说明，他们事先并未做好沟通，也就是两个孩子并没有申明各自利益所在。没有事先申明价值导致了双方盲目追求形式上和立场上的公平，结果，双方各自的利益并未在谈判中达到最大化。", "商务谈判的过程实际上就是双方不断沟通，创造最大价值的过程。双方都是要用相对较小的让步来换得最大的利益，那么，双方就要相互沟通、相互宽容以便实现双赢。而如果我们在满足双方最大利益的基础上，还存在达成协议的障碍，那么就不妨站在对方的立场上，替对方着想，帮助扫除达成协议的一切障碍。这样，最终的协议是不难达成的。", "在国际商务谈判中，既要保证自己的合理利益，又要达到预定目标，并不是一件轻松的工作。现代商务工作中，越来越多的人参与到谈判当中，英美等国仅商务谈判人员就占总人口的 5％以上，谈判学在西方现代管理教育中也受到人们的广泛重视。可以说，谈判是一种艺术，虽然充满了很多不可知的因素，但它又是有规律可循的，如果按照一定的原则，就一定能够达到更好的结果。"]}, "kewen_shengci": [{"word": "协商", "pos": "动词", "def": "共同商量以便取得一致意见", "pinyin": "xié shāng"}, {"word": "义务", "pos": "名词", "def": "与权利相对。指政治上、法律上、道义上应尽的责任", "pinyin": "yì wù"}, {"word": "信仰", "pos": "名词", "def": "对某种主张、主义、宗教或某人极其相信和尊敬", "pinyin": "xìn yǎng"}, {"word": "妥善", "pos": "形容词", "def": "稳妥完善的，恰当的", "pinyin": "tuǒ shàn"}, {"word": "误区", "pos": "名词", "def": "错误的认识", "pinyin": "wù qū"}, {"word": "化解", "pos": "动词", "def": "溶化消解", "pinyin": "huà jiě"}, {"word": "兼顾", "pos": "动词", "def": "同时照顾（几方面）", "pinyin": "jiān gù"}, {"word": "固守", "pos": "动词", "def": "保卫和防守得非常坚固", "pinyin": "gù shǒu"}, {"word": "经典", "pos": "形容词", "def": "有代表性的", "pinyin": "jīng diǎn"}, {"word": "剥", "pos": "动词", "def": "把皮去掉", "pinyin": "bō"}, {"word": "磨碎", "pos": "动词", "def": "采用反复辗压、挤压摩擦来使颗粒状的物品变成粉末状", "pinyin": "mó suì"}, {"word": "盲目", "pos": "形容词", "def": "比喻认识不清", "pinyin": "máng mù"}, {"word": "宽容", "pos": "形容词", "def": "宽大有气量，不计较或不追究", "pinyin": "kuān róng"}, {"word": "障碍", "pos": "名词", "def": "阻挡前进的东西", "pinyin": "zhàng ài"}, {"word": "扫除", "pos": "动词", "def": "清除；消除", "pinyin": "sǎo chú"}, {"word": "循", "pos": "动词", "def": "遵守，依照沿袭", "pinyin": "xún"}], "kewen_yuyandian": [{"num": "1", "sentence": "就交易的各项条件进行协商的过程。", "explanation": ["“就……（而）＋动词”，用介词“就”引出动作的对象。例如："], "examples": ["我们双方就价格问题进行了协商。", "他们两家公司就运输方式召开了专门的讨论会。"], "extra": "即学即用：用“就……”完成句子\n(1) 两国领导人___交换了意见。\n(2) 大家___展开了激烈的争论。"}, {"num": "2", "sentence": "如何妥善处理其中出现的各种问题……", "explanation": ["“妥善”，妥当完善，适当。常见的搭配有“～处理、～解决”等。", "注意：妥善—妥当", "二者都可以作状语和补语，但是，“妥当”常作定语和谓语，“妥善”常作定语，不常作谓语。另外，在词语搭配上的区别如下表：", "很～　不～　安排～　～安置　用词～\n妥当　✓　✓　✓　✗　✓\n妥善　✓　✗　✓　✓　✗"], "examples": ["中国的大学对留学生都有妥善（妥当）的安排", "要妥善安置转业军人的工作。"], "extra": "即学即用：用“妥善”“妥当”完成句子\n(1) 这个词用在这里___。\n(2) 这件事处理得___。\n(3) 他___安排了今天的日常工作。\n(4) 我的出国留学手续___。"}, {"num": "3", "sentence": "人们在对商务谈判的认识上存在一定的误区。", "explanation": ["注意：误区—误会", "“误区”，指较长时间形成的某种错误认识或错误做法。“误会”，错误地理解了对方的意思。“误区”常是集体性的偏见，而“误会”多是个人的短时间的错误理解。"], "examples": [], "extra": "即学即用：用“误区”“误会”填空\n(1) 西方国家长期以来都对中国存在认识___。\n(2) 因为不清楚这件事的前因后果，所以造成了大家彼此之间的___。\n(3) 你这么做很容易陷入___。\n(4) 请你不要___，我是个好人。"}, {"num": "4", "sentence": "好的谈判者并不是一味固守立场", "explanation": ["“一味”，副词，一直、单纯地、只是简单地。后加动词。常与“总是”连用。例如："], "examples": ["他总是一味偏爱小王。", "我们公司如果总是一味地相信广告而不重视质量，早晚都会出问题的。"], "extra": "即学即用：用“一味”完成句子\n(1) ___导致公司损失巨大。\n(2) 我们不能___。"}, {"num": "5", "sentence": "它又是有规律可循的。", "explanation": ["“可＋单音节动词”组成一些新的词语，其基本意思是“值得……”或“使人……”“令人……”，例如："], "examples": ["可取（值得学习或赞许）、可喜（值得欣喜）、可贵（值得珍视）", "可恨（让人憎恨）、可歌可泣（值得歌颂，让人感动得哭泣）"], "extra": "即学即用：完成短语\n可___\n可___ 可___ 可___"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "items": [["认识", "立场"], ["妥善", "安排"], ["陷入", "误区"], ["保证", "安全"], ["信仰", "自由"]]}, {"type": "fill", "title": "二、选词填空", "bank": ["信仰", "化解", "固守", "经典", "盲目", "障碍", "协商"], "items": [{"text": "民族矛盾是历史上长期积存下来的问题，很难轻易___。", "answer": "化解"}, {"text": "我们国家法律规定，人民的宗教___自由。", "answer": "信仰"}, {"text": "一味地___传统并不是好事，容易让我们形成固定思维。", "answer": "固守"}, {"text": "很多___老歌至今还在传唱，百听不厌。", "answer": "经典"}, {"text": "落后的管理模式成为经济发展道路上最大的___。", "answer": "障碍"}, {"text": "经过友好___，两家公司最终在价格上达成了一致。", "answer": "协商"}, {"text": "我们要培养独立的见解，不要___地相信他人。", "answer": "盲目"}]}, {"type": "open", "title": "三、连词成句", "items": ["1．吴经理就广告的洽谈和进行对方公司了风格", "2．如何处理妥善重要就尤为冲突显得", "3．我们站在立场不妨对方的替别人想一想多"]}, {"type": "open", "title": "四、看谁读得准", "items": ["中方总经理：那么现在我们就支付方式进行协商吧！\n新方财务总监：我方会在签约后 10 天内开立以贵方为受益人的不可撤销远期信用证，以美元结算。同时，开证行、议付行由我方指定。\n中方财务总监：我方不同意。我们所能接受的是即期信用证支付方式，并且议付行只能为中国工商银行。\n新方财务总监：贵方对我们的条件实在是太苛刻了，要知道，即期支付会占用我方很大的资金，这实在是难以实现。\n中方财务总监：但我公司规模不大，无法承受如此大的风险，希望贵方可以考虑我方的难处。\n新方财务总监：我们怎么能够那样做呢？要不我们各退让一步，50％的即期信用证，剩下的用承兑交单，如何？\n中方总经理：考虑到我们双方的友好关系和各自的疑虑，我方破例接受贵方提出的支付方式。", "1．这次谈判的主要问题是什么？", "2．谈判双方的观点分别是什么？最终是如何达成一致的？"]}, {"type": "open", "title": "五、看谁说得好", "items": ["观点 1：谈判是要实现双方共赢", "观点 2：谈判的结果是要争出个高低输赢", "任务：请你和周围朋友分别就这两种观点展开讨论，看看谁说得有理。"]}, {"type": "open", "title": "六、看谁写得好", "items": ["王中要去电视台就广告制作和播出的问题和电视台广告部李主任进行谈判，你可以帮他写出一个谈判的脚本吗？"]}]}]};
</script>
<script>
/* 第2课《初到公司》开放题参考答案（2026-10-28 补充）。
   依据本课会话、课文、生词与语言点编写；开放题为示例，答案不唯一。
   以 ref 字段附加在原题上，原题数据不改动。ref 与 items 一一对应，null 表示该条不设答案。 */
(function () {
  var L = BOOK_DATA.lessons.filter(function (l) { return l.id === 2 && l.title === "初到公司"; })[0];
  if (!L) return;
  function attach(list, title, ref, note) {
    var ex = (list || []).filter(function (x) { return x.title === title; })[0];
    if (!ex || ex.ref) return;
    ex.ref = ref; if (note) ex.refNote = note;
  }
  /* 课后理解 */
  attach(L.lijie, "二、回答问题", [
    "人力资源部人事助理赵伟帮小王办理了入职手续。",
    "身份证、毕业证书、录用证明，另外还有一张一寸免冠照片。",
    "试用期劳动合同和保密协议，都是一式两份。",
    "销售部。",
    "李丽（李组长）的销售小组。吴经理说：“你以后就跟着她做吧。”"
  ]);
  /* 课后练习（对话部分） */
  attach(L.duihua_lianxi, "一、在横线上填写可以搭配的词语", [
    "办理入职手续　办理（相关）手续",
    "签订劳动合同　签订保密协议　签订合作协议",
    "请教问题　向前辈请教",
    "录用新员工　录用毕业生",
    "接待新员工　接待客户",
    "安排周到　照顾周到　想得周到"

  attach(L.duihua_lianxi, "二、仿照例子，写出三个结构类似的词语", [
