<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商务汉语精读 A · 教学工作台</title>
<style>
:root {
  --primary: #1e4d8c;
  --primary-2: #2b5ea7;
  --accent: #c9a254;
  --bg: #f6f4ef;
  --paper: #ffffff;
  --ink: #2b2b2b;
  --ink-2: #6b6b6b;
  --line: #e5e0d6;
  --ok: #1a8f4d;
  --bad: #d03a2c;
  --radius: 12px;
  --shadow: 0 2px 10px rgba(30, 45, 70, .08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100vh;
  overflow: hidden;
}
.serif { font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif; }

/* ===== Header ===== */
header {
  height: 56px;
  background: linear-gradient(135deg, #1e4d8c 0%, #2b5ea7 100%);
  color: #fff;
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
  position: relative; z-index: 30;
}
header .logo {
  width: 34px; height: 34px; border-radius: 8px;
  background: rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  border: 1px solid rgba(255,255,255,.35);
}
header .htitle { font-size: 16px; font-weight: 600; letter-spacing: .5px; white-space: nowrap; }
header .hsub { font-size: 11px; opacity: .75; white-space: nowrap; }
header .spacer { flex: 1; }
.tbtn {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff; border-radius: 8px;
  padding: 6px 10px; font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
.tbtn:hover { background: rgba(255,255,255,.25); }
.tbtn.on { background: var(--accent); border-color: var(--accent); color: #3a2c07; font-weight: 600; }

/* ===== Layout ===== */
#app { display: flex; height: calc(100vh - 56px); }
aside {
  width: 240px; flex: none;
  background: var(--paper);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 14px 10px 30px;
}
main { flex: 1; overflow-y: auto; padding: 0 0 80px; scroll-behavior: smooth; }

.nav-group { font-size: 12px; color: var(--ink-2); margin: 14px 8px 6px; letter-spacing: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 9px; cursor: pointer;
  font-size: 14px; color: var(--ink);
  border: 1px solid transparent;
}
.nav-item:hover { background: #f0ede5; }
.nav-item.active { background: #eaf1fa; border-color: #c8d9ef; color: var(--primary); font-weight: 600; }
.nav-item .num {
  width: 24px; height: 24px; flex: none;
  border-radius: 7px; background: #eee7d8; color: #7a6234;
  font-size: 12px; display: flex; align-items: center; justify-content: center;
}
.nav-item.active .num { background: var(--primary); color: #fff; }

/* ===== Home ===== */
.cover {
  margin: 28px auto 0; max-width: 900px; padding: 0 24px;
}
.cover-card {
  background: linear-gradient(150deg, #20497f 0%, #2b5ea7 60%, #3a74c4 100%);
  border-radius: 18px; color: #fff; padding: 44px 48px;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.cover-card::after {
  content: "商"; position: absolute; right: -30px; bottom: -70px;
  font-size: 240px; font-family: "Songti SC", serif; opacity: .08; font-weight: 700;
}
.cover-card h1 { margin: 0 0 6px; font-size: 34px; font-family: "Songti SC", serif; letter-spacing: 2px; }
.cover-card .en { opacity: .7; font-size: 13px; margin-bottom: 22px; }
.cover-card .meta { font-size: 14px; line-height: 2; opacity: .92; }
.cover-card .tags { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.cover-card .tag {
  font-size: 12px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
  padding: 4px 10px; border-radius: 20px;
}
.lesson-grid {
  max-width: 900px; margin: 26px auto; padding: 0 24px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px;
}
.lcard {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
}
.lcard:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(30,45,70,.13); }
.lcard .lnum { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 2px; }
.lcard .ltitle { font-size: 19px; font-weight: 700; margin: 6px 0 8px; font-family: "Songti SC", serif; }
.lcard .lmeta { font-size: 12px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; }

/* ===== Lesson view ===== */
.subnav {
  position: sticky; top: 0; z-index: 20;
  background: rgba(246,244,239,.96); backdrop-filter: blur(4px);
  border-bottom: 1px solid var(--line);
  padding: 10px 26px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.subnav .chip {
  font-size: 13px; padding: 5px 12px; border-radius: 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink-2);
}
.subnav .chip:hover { border-color: var(--primary-2); color: var(--primary); }
.subnav .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.subnav .chip .part { font-size: 10px; opacity: .7; margin-right: 2px; }

.lesson-head { max-width: 900px; margin: 30px auto 0; padding: 0 26px; }
.lesson-head .kicker { color: var(--accent); font-weight: 700; letter-spacing: 3px; font-size: 13px; }
.lesson-head h2 { font-size: 32px; margin: 6px 0 4px; font-family: "Songti SC", serif; }
.lesson-head .en { color: var(--ink-2); font-size: 13px; }

.section { max-width: 900px; margin: 26px auto; padding: 0 26px; }
.sec-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 700; margin-bottom: 14px;
}
.sec-title::before { content: ""; width: 5px; height: 20px; border-radius: 3px; background: var(--accent); }
.sec-title .part-tag {
  font-size: 11px; font-weight: 600; color: var(--primary);
  background: #e7effa; padding: 3px 9px; border-radius: 12px;
}

.card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px 22px;
  box-shadow: var(--shadow); margin-bottom: 14px;
}

/* 导读 */
.qcard { display: flex; gap: 14px; align-items: flex-start; }
.qcard .qnum {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: #fdf3e0; color: #8a6a1f; border: 1px solid #ecd9a8;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.qcard .qtext { font-size: 16.5px; line-height: 1.8; padding-top: 2px; }
.qcard .qhint { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

/* 核心句 */
.key-s {
  font-size: 19px; line-height: 1.9; font-family: "Songti SC", serif;
  display: flex; gap: 12px;
}
.key-s .knum { color: var(--accent); font-weight: 700; flex: none; }

/* 对话 */
.dlg-intro {
  background: #eef3fa; border-left: 4px solid var(--primary-2);
  padding: 12px 16px; border-radius: 0 10px 10px 0;
  font-size: 14.5px; line-height: 1.9; margin-bottom: 16px; color: #33455e;
}
.rolebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }
.rolechip {
  padding: 5px 12px; border-radius: 16px; font-size: 13px; cursor: pointer;
  border: 1.5px solid; background: #fff; font-weight: 600;
}
.rolechip.masked { opacity: .45; border-style: dashed; }
.bubble-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start; }
.avatar {
  width: 38px; height: 38px; flex: none; border-radius: 50%;
  color: #fff; font-weight: 700; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 5px rgba(0,0,0,.12);
}
.bubble { max-width: 82%; }
.bubble .who { font-size: 12px; color: var(--ink-2); margin: 0 2px 4px; }
.bubble .text {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 4px 14px 14px 14px; padding: 11px 15px;
  font-size: 16px; line-height: 1.85; box-shadow: var(--shadow);
}
.bubble .text.masked { filter: blur(7px); cursor: pointer; user-select: none; }
.scene-line { text-align: center; color: var(--ink-2); font-size: 14px; margin: 14px 0; }
.scene-line span { background: #efe9db; padding: 4px 16px; border-radius: 14px; }

/* 生词卡 */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.vcard { perspective: 900px; height: 132px; cursor: pointer; }
.vcard-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform .45s; transform-style: preserve-3d;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vface {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--paper); box-shadow: var(--shadow);
  padding: 14px 16px; display: flex; flex-direction: column; justify-content: center;
}
.vface.front .vword { font-size: 26px; font-weight: 700; font-family: "Songti SC", serif; }
.vface.front .vpos { margin-top: 8px; font-size: 12px; color: var(--accent); font-weight: 600; }
.vface.front .vflip { position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: #b7ad99; }
.vface.back { transform: rotateY(180deg); background: #fbf7ee; }
.vface.back .vpinyin { font-size: 15px; color: var(--primary); font-weight: 600; margin-bottom: 6px; }
.vface.back .vdef { font-size: 12.5px; line-height: 1.65; color: #4a4437; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.vtools { margin-bottom: 14px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.mini-btn {
  font-size: 12.5px; padding: 5px 12px; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
}
.mini-btn:hover { border-color: var(--primary-2); color: var(--primary); }

/* 语言点 */
.lp { padding: 0; overflow: hidden; }
.lp-head {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: 16px 20px; display: flex; gap: 12px; align-items: baseline;
  font-size: 15.5px;
}
.lp-head .lpnum {
  flex: none; width: 26px; height: 26px; border-radius: 8px;
  background: var(--primary); color: #fff; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.lp-head .lps { font-family: "Songti SC", serif; font-weight: 600; line-height: 1.7; flex: 1; }
.lp-head .arrow { color: #b7ad99; transition: transform .2s; font-size: 12px; }
.lp.open .lp-head .arrow { transform: rotate(90deg); }
.lp-body { display: none; padding: 0 22px 18px 58px; }
.lp.open .lp-body { display: block; }
.lp-body .exp { font-size: 14.5px; line-height: 1.9; color: #3d3d3d; margin: 0 0 8px; }
.lp-body .ex-list { background: #f6f8fc; border-radius: 10px; padding: 10px 16px; margin: 10px 0; }
.lp-body .ex-list .ex { font-size: 14.5px; line-height: 2; color: #2c3e58; }
.lp-body .ex-list .ex::before { content: "例 "; color: var(--accent); font-size: 11px; font-weight: 700; margin-right: 6px; }
.lp-body .extra { background: #fbf5e7; border: 1px dashed #ddc589; border-radius: 10px; padding: 12px 16px; font-size: 13.5px; line-height: 1.9; white-space: pre-wrap; color: #5d4d25; }

/* 课文 */
.kewen-card { padding: 34px 42px; }
.kewen-card h3 { text-align: center; font-family: "Songti SC", serif; font-size: 24px; margin: 0 0 22px; }
.kewen-card p { font-family: "Songti SC", serif; font-size: 16.5px; line-height: 2.15; text-indent: 2em; margin: 0 0 12px; text-align: justify; }

/* 练习 */
.ex-block { margin-bottom: 18px; }
.ex-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.ex-title { font-size: 16px; font-weight: 700; }
.ex-type { font-size: 11px; padding: 3px 9px; border-radius: 11px; background: #efe9db; color: #7a6234; font-weight: 600; }
.ex-score { font-size: 12.5px; color: var(--ink-2); margin-left: auto; }
.ex-intro { font-size: 13.5px; color: var(--ink-2); margin: -4px 0 12px; line-height: 1.7; }
.ex-item { padding: 12px 0; border-top: 1px dashed var(--line); }
.ex-item:first-of-type { border-top: none; }
.ex-q { font-size: 15.5px; line-height: 1.9; }
.ex-q .qn { color: var(--accent); font-weight: 700; margin-right: 6px; }

.judge-btns { display: inline-flex; gap: 8px; margin-left: 12px; vertical-align: middle; }
.jbtn {
  width: 34px; height: 30px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--line); background: #fff; font-size: 15px; font-weight: 700;
}
.jbtn:hover { border-color: var(--primary-2); }
.jbtn.sel-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.jbtn.sel-bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.fb { font-size: 13px; margin-left: 10px; font-weight: 600; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }

.opt-btn {
  display: inline-block; margin: 4px 8px 4px 0; padding: 7px 14px;
  border: 1.5px solid var(--line); border-radius: 9px; background: #fff;
  font-size: 14.5px; cursor: pointer;
}
.opt-btn:hover { border-color: var(--primary-2); }
.opt-btn.sel-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt-btn.sel-bad { background: var(--bad); border-color: var(--bad); color: #fff; }

.blank-sel {
  font-size: 15px; padding: 4px 8px; margin: 0 4px; min-width: 96px;
  border: 1.5px solid var(--primary-2); border-radius: 8px; color: var(--primary);
  background: #f4f8fe; cursor: pointer;
}
.blank-sel.ok { border-color: var(--ok); color: var(--ok); background: #eef9f1; }
.blank-sel.bad { border-color: var(--bad); color: var(--bad); background: #fdf0ee; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; background: #f6f8fc; padding: 10px 14px; border-radius: 10px; }
.bank .bw { font-size: 14.5px; background: #fff; border: 1px solid #d5e0f0; color: var(--primary); border-radius: 8px; padding: 4px 12px; font-weight: 600; }

.match-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 60px; }
.mcol { display: flex; flex-direction: column; gap: 8px; }
.mitem {
  padding: 9px 14px; border-radius: 9px; border: 1.5px solid var(--line);
  background: #fff; font-size: 15px; cursor: pointer; text-align: center;
  transition: all .15s;
}
.mitem:hover { border-color: var(--primary-2); }
.mitem.picked { border-color: var(--accent); background: #fdf6e6; font-weight: 700; }
.mitem.done { border-color: var(--ok); background: #eef9f1; color: var(--ok); cursor: default; }
.mitem.wrong { border-color: var(--bad); background: #fdf0ee; animation: shake .3s; }
@keyframes shake { 25% {transform: translateX(-4px);} 75% {transform: translateX(4px);} }

.ans-tag {
  display: none; font-size: 12.5px; color: #8a6a1f; background: #fdf3e0;
  border: 1px solid #ecd9a8; border-radius: 8px; padding: 3px 10px; margin-left: 10px;
  vertical-align: middle;
}
body.show-answers .ans-tag { display: inline-block; }
body.show-answers .ans-line { display: block; }
.ans-line { display: none; font-size: 13px; color: #8a6a1f; margin-top: 6px; }

/* 开放题参考答案：默认隐藏，点击后展开（2026-10-28 补充） */
.ref-wrap { margin: 2px 0 12px 26px; }
.ref-btn {
  font: inherit; font-size: 13px; color: #8a6a1f; background: #fdf3e0;
  border: 1px solid #ecd9a8; border-radius: 999px; padding: 3px 12px; cursor: pointer;
  transition: background .2s, color .2s;
}
.ref-btn:hover, .ref-btn:focus-visible { background: #f8e6bf; }
.ref-btn[aria-expanded="true"] { background: #8a6a1f; border-color: #8a6a1f; color: #fff; }
.ref-btn .ref-arrow { display: inline-block; margin-left: 4px; transition: transform .3s; }
.ref-btn[aria-expanded="true"] .ref-arrow { transform: rotate(180deg); }
.ref-ans {
  display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(-6px);
  transition: grid-template-rows .4s ease, opacity .35s ease, transform .35s ease, margin-top .4s ease;
  margin-top: 0; visibility: hidden;
}
.ref-ans > .ref-inner { overflow: hidden; min-height: 0; }
.ref-ans.open, body.show-answers .ref-ans {
  grid-template-rows: 1fr; opacity: 1; transform: none; margin-top: 8px; visibility: visible;
}
.ref-card {
  border-left: 4px solid #d9a93c; background: #fffaf0; border-radius: 0 10px 10px 0;
  padding: 8px 14px; color: #5c4513; font-size: 14.5px; line-height: 1.9; white-space: pre-wrap;
}
.ref-card .ref-label {
  display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: #c08a1e;
  border-radius: 6px; padding: 1px 8px; margin-right: 8px; letter-spacing: 1px; white-space: normal;
}
.ref-card .ref-note { font-size: 12px; color: #a08040; white-space: normal; }
body.show-answers .ref-btn, body.show-answers .ref-all { display: none; }
.ref-all { margin-left: auto; }
@media (prefers-reduced-motion: reduce) {
  .ref-ans, .ref-btn, .ref-btn .ref-arrow { transition: none; }
}
@media print { .ref-btn, .ref-all { display: none !important; } }

/* 教材插图（2026-10-28 补充）：随字号缩放、自适应、可打印 */
.book-figs { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 0 14px 26px; align-items: flex-start; }
.book-fig { margin: 0; flex: 0 1 24em; max-width: 100%; font-size: calc(14px * var(--reading-scale, 1));
  background: #fff; border: 1px solid #e3e7ef; border-radius: 10px; padding: 8px; break-inside: avoid; page-break-inside: avoid; }
.book-figs.multi .book-fig { flex-basis: 15em; }
.book-fig img { display: block; width: 100%; height: auto; border-radius: 6px; background: #f4f4f4; }
.book-fig figcaption { font-size: .9em; color: #4a5568; margin-top: 6px; line-height: 1.6; text-align: center; }
.book-fig figcaption b { color: #2c3e58; }
.book-fig .fig-src { display: inline-block; margin-left: 8px; font-size: .8em; color: #fff; background: #8a94a6; border-radius: 4px; padding: 0 6px; vertical-align: 1px; }
@media (max-width: 640px) { .book-figs { margin-left: 0; } .book-figs.multi .book-fig { flex-basis: calc(50% - 6px); } }
@media print { .book-figs { margin-left: 0; } .book-fig { border-color: #bbb; } .book-fig img { max-height: 9cm; width: auto; max-width: 100%; } }
#main .ref-card { font-size: calc(14.5px * var(--reading-scale, 1)); overflow-wrap: anywhere; }
#main .ref-card .ref-label { font-size: calc(12px * var(--reading-scale, 1)); }
#main .ref-card .ref-note { font-size: calc(12px * var(--reading-scale, 1)); }
#main .ref-btn { font-size: calc(13px * var(--reading-scale, 1)); }

.open-item { display: flex; gap: 10px; }
.open-item .qn { color: var(--accent); font-weight: 700; flex: none; }
.open-item .qt { font-size: 15px; line-height: 1.9; white-space: pre-wrap; }

/* 教材表格（忠实原书版式） */
.book-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14.5px; background: #fff; }
.book-table caption { font-weight: 700; font-size: 14px; padding: 8px 6px; color: #444; letter-spacing: .5px; }
.book-table th, .book-table td { border: 1.5px solid #9aa0a8; padding: 9px 13px; line-height: 1.8; vertical-align: middle; }
.book-table thead th { background: #f0ede4; text-align: center; letter-spacing: 1px; font-size: 14.5px; }
.book-table tbody th { background: #f7f5ef; font-weight: 600; white-space: nowrap; }

/* 夹纸板（招聘启事/空白模板） */
.clipbox {
  position: relative; margin: 26px 0 18px; padding: 24px 34px 26px;
  background: #fff; border: 2.5px solid #9aa0a8; border-radius: 12px;
}
.clip-tab {
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  width: 110px; height: 15px; background: #c6cad2;
  border-radius: 9px 9px 0 0; border: 2.5px solid #9aa0a8; border-bottom: none;
}
.clip-title { text-align: center; font-weight: 700; letter-spacing: 8px; font-size: 17px; margin-bottom: 14px; }
.clip-line { font-size: 14.5px; line-height: 2.15; }
.clip-blank { height: 37px; border-bottom: 1.5px solid #bcc1c9; }
.clip-blank:last-child { margin-bottom: 4px; }

/* 人物 */

<script>
const BOOK_DATA = {"meta": {"book": "新商务汉语精读教程（上册）", "series": "新商务汉语教程 · New Business Chinese Intensive Reading (I)", "authors": "周晨萌 曹晋 唐兴全 编著", "publisher": "清华大学出版社", "characters": [{"name": "王中", "role": "新锐公司销售部新进职员"}, {"name": "高雷", "role": "新锐公司副总经理"}, {"name": "张强", "role": "新锐公司人力资源部经理"}, {"name": "吴云", "role": "新锐公司销售部经理"}, {"name": "陈新", "role": "新锐公司财务部经理"}, {"name": "赵伟", "role": "新锐公司人力资源部人事助理"}, {"name": "李丽", "role": "新锐公司销售部职员"}, {"name": "李一冰", "role": "天乐公司（新锐公司的合作公司之一）总经理"}, {"name": "张畅", "role": "佳培广告公司（新锐公司的合作公司之一）经理"}, {"name": "大卫", "role": "中天国际有限公司（新锐公司的合作公司之一）亚洲区副总经理"}, {"name": "彼得", "role": "中天国际有限公司（新锐公司的合作公司之一）亚洲区技术总监"}]}, "lessons": [{"id": 1, "title": "求职面试", "daodu": ["你参加过面试吗？在面试的时候，你应该怎么介绍自己？", "如果你是公司的人事经理，在面试过程中，你会问什么问题呢？", "你觉得面试的时候应该注意什么？"], "hexinjv": ["我毕业于对外经济贸易大学。", "工资不是最重要的，重要的是工作岗位适合自己。", "短则30分钟，长则几个小时。", "自我介绍，就如同商品广告。"], "duihua": {"intro": "王中去新锐公司应聘，新锐公司高副总经理和人力资源部张经理对小王进行了面试。", "lines": [{"speaker": "场景", "text": "（面试会场）"}, {"speaker": "张经理", "text": "你好！欢迎你来应聘。"}, {"speaker": "小王", "text": "您好！很高兴能有这次面试机会。这是我的求职简历。"}, {"speaker": "张经理", "text": "谢谢！请你做一个简单的自我介绍。"}, {"speaker": "小王", "text": "好的。我叫王中，今年 23 岁，毕业于对外经济贸易大学，专业是国际经济与贸易。"}, {"speaker": "高副总经理", "text": "你选择这份工作的动机是什么？"}, {"speaker": "小王", "text": "我在网上看到了贵公司的招聘启事，觉得贵公司提供的工作岗位与我的专业很对口，因此我很感兴趣，希望能在这儿发挥出自己的优势。"}, {"speaker": "张经理", "text": "你觉得你从事这份工作有什么优势？"}, {"speaker": "小王", "text": "我了解经济贸易方面的基本理论和方法，对国际经贸行业的现状比较熟悉，之前在其他类似公司有过比较多的实习经历，有一定的工作经验。最主要的是，我很喜欢从事这方面的工作。"}, {"speaker": "张经理", "text": "你的外语水平怎么样？"}, {"speaker": "小王", "text": "我用英语和国外客户沟通是没有问题的，口语、听力和写作能力都还不错。另外，我还学过一点儿德语。"}, {"speaker": "张经理", "text": "你有过这方面的工作经验吗？"}, {"speaker": "小王", "text": "我毕业后在一家小公司工作过三个月，有一定的实践经验。"}, {"speaker": "高副总经理", "text": "那为什么选择跳槽呢？"}, {"speaker": "小王", "text": "在这三个月内，我积累了一定的工作经验，但觉得原有的岗位不太适合自己，所以想在更高的平台上锻炼自己。"}, {"speaker": "高副总经理", "text": "你对工资有什么要求？对这份工作有什么期望和目标吗？"}, {"speaker": "小王", "text": "我刚参加工作，工资不是最重要的，重要的是工作岗位适合自己，自己能在工作中发挥自己的能力，得到提高，为公司的发展做出贡献。"}, {"speaker": "张经理", "text": "你还有什么问题想了解的吗？"}, {"speaker": "小王", "text": "没有了。"}, {"speaker": "高副总经理", "text": "好的。刚才看了你的简历，听了你的介绍，我们觉得你很适合这份工作。欢迎你加入我们公司！"}, {"speaker": "小王", "text": "是吗？那太好了！非常感谢贵公司能给我这次工作机会！"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "items": [{"text": "小王毕业于对外经济贸易大学，专业是国际金融。", "answer": false}, {"text": "因为新锐公司工资很高，所以小王选择去新锐公司工作。", "answer": false}, {"text": "小王的外语能力比较好，他精通英语和法语。", "answer": false}, {"text": "小王是一个不负责任的员工，经常性地跳槽。", "answer": false}, {"text": "小王在很多个公司实习或工作过，积累了很多经验。", "answer": true}]}, {"type": "open", "title": "二、回答问题", "items": ["小王是怎么想到去新锐公司应聘的？", "面试小王的考官都有谁？", "小王认为自己从事这份工作有哪些优势？", "小王对工资有什么要求？", "下列问题中，哪一个没有在面试过程中出现？\nA．选择工作的动机　B．工作经验　C．教育背景\nD．工资　E．恋爱经历　F．外语水平"]}], "duihua_shengci": [{"word": "应聘", "pos": "动词", "def": "接受聘请，常指去公司等寻找工作机会", "pinyin": "yìng pìn"}, {"word": "人力资源部", "pos": "名词", "def": "公司的人事部门 (Human Resource, HR)", "pinyin": "rén lì zī yuán bù"}, {"word": "面试", "pos": "动词、名词", "def": "当面考查、测试", "pinyin": "miàn shì"}, {"word": "简历", "pos": "名词", "def": "对个人学习、经历、特长、爱好及其他有关情况所作的简单的介绍", "pinyin": "jiǎn lì"}, {"word": "动机", "pos": "名词", "def": "推动人从事某种活动的念头", "pinyin": "dòng jī"}, {"word": "招聘", "pos": "动词", "def": "用公告的方式招员工", "pinyin": "zhāo pìn"}, {"word": "启事", "pos": "名词", "def": "一种应用文，公开贴在墙上、登在报刊上陈述一件事", "pinyin": "qǐ shì"}, {"word": "发挥", "pos": "动词", "def": "把内在的性质或能力表现出来", "pinyin": "fā huī"}, {"word": "优势", "pos": "名词", "def": "超过同类事物中其他情况的形势。反义词为“劣势”", "pinyin": "yōu shì"}, {"word": "沟通", "pos": "动词、名词", "def": "人与人之间、人与群体之间思想与感情的传递和返回的过程，目的是使思想达成一致和感情的通畅", "pinyin": "gōu tōng"}, {"word": "跳槽", "pos": "动词", "def": "离开原来的工作，另外寻找工作", "pinyin": "tiào cáo"}, {"word": "积累", "pos": "动词", "def": "逐渐聚集", "pinyin": "jī lěi"}, {"word": "锻炼", "pos": "动词", "def": "通过生产劳动、社会斗争和工作实践，使觉悟、工作能力等提高", "pinyin": "duàn liàn"}, {"word": "期望", "pos": "动词、名词", "def": "对人或事物的未来有所等待，希望", "pinyin": "qī wàng"}, {"word": "贡献", "pos": "动词、名词", "def": "对国家或人民做的有益的事", "pinyin": "gòng xiàn"}], "duihua_yuyandian": [{"num": "1", "sentence": "毕业于对外经济贸易大学。", "explanation": ["动词＋于＋宾语：动词后的“于”与“在”“跟”“从”的意思相同，其后可以是处所或时间词语，也可以是其他有关的内容。“于”多用在书面语中。", "形容词＋于＋宾语：这里的“于”跟“比”“对”相当，其后的词语也多是“比”和“对”的对象。这时的“于”既可用在口语中，也可用在书面语中。", "很多时候，“于”用在一个形容词的后面，表示“在……方面很……”，而这样的结构往往已经固化为一个词语。比如“善于”“敢于”“勇于”等。"], "examples": ["这个公司成立于 30 年前。（在）", "李小姐毕业于 1989 年。（在）", "老师的年龄相当于我的三倍。（跟、和）", "他毕业于北京大学。（从）", "我们班的学生多于他们班。（比）", "这样做有利于大家的健康。（对）", "他善于和人沟通，所以有很多朋友。", "我不是一个安于现状的人，总是想着改变。", "真正的勇士总是敢于直面困难，决不后退。"], "extra": ""}, {"num": "2", "sentence": "觉得贵公司提供的工作岗位与我的专业很对口。", "explanation": ["“对口”，形容词，互相联系的两方在工作内容和性质上相一致。常见的搭配有：专业对口、对口公司。"], "examples": ["你想专业对口，发挥专长，这是很自然的事情。", "他们公司正好是我们公司的对口公司。", "中国东部地区要进一步搞好对西部地区的对口支持和技术合作。"], "extra": ""}, {"num": "3", "sentence": "之前在其他类似公司有过比较多的实习经历。", "explanation": ["“实习”，动词，意思是把学到的理论知识拿到实际工作中去应用和检验，以锻炼工作能力。"], "examples": ["每个大学生都应该去一些公司进行社会实习。", "经理很认真地指导我的工作，好像我是一个来这儿实习的学生。", "我们公司今年会招聘一些实习生，你可以投简历来这儿实习。", "你的实习报告写完了吗？老师催我们交呢。"], "extra": "注意：实习—实践\n“实践”，动词，实际去做，实行。也可以用作名词，意思是指改造自然和社会的有意识的活动。\n员工可以用这 20% 的时间实践，可以进行大量的测试，不用担心犯错。\n这个伟大的梦想需要我们努力去探索和实践。\n这个理论在实践中行得通吗？\n理论和实践相结合才能更好地发挥作用。\n即学即用：用“实习／实践”填空\n(1) 小王读书的时候就很注重参加各类社会___活动，假期的时候也经常会去一些机构___，这让他在求职过程中很有优势。\n(2) 学生会开展了丰富多彩的社会___活动，同时还与各个跨国公司进行联系，为同学们提供了很多___岗位."}, {"num": "4", "sentence": "我毕业后在一家小公司工作过三个月，有一定的实践经验。", "explanation": ["“经验”，名词，从多次的工作或活动中得到的知识或技能。在现代汉语中，经验不可以用作动词。"], "examples": ["他是一个经验丰富的老师。", "对这件事的处理，他是有经验的。"], "extra": "注意：经验—经历\n“经历”，动词，亲身遇到过、体验过。也可以用作名词，意思是亲身见过、做过或遭遇过的事。\n几年前他曾经经历过一次车祸。\n我在北京的留学经历使我在求职时很有优势。\n即学即用：用“经验／经历”填空\n(1) 他是一位___丰富的警察，在十年的时间里___了很多大的案件。\n(2) 正因为他___了很多事情，才积累了丰富的实践___。"}, {"num": "5", "sentence": "工资不是最重要的，重要的是工作岗位适合自己。", "explanation": ["“……不是最重要的，重要的是……”，以对比的方式，指出更重要的方面。", "这个句子还可以用“不是……而是……”的结构来表达：", "类似的表达还有："], "examples": ["选择什么不是最重要的，重要的是你怎么做。", "知识本身并不是最重要的，重要的是掌握知识的能力。", "选择什么工作不是最重要的，重要的是你怎么去做。", "最重要的不是工资，而是工作岗位适合自己。", "我最高兴的不是他这次考试的好成绩，而是他第一次在考试前进行了认真的准备。", "最让人生气的不是商品的质量，而是商场负责人对待这件事的态度。"], "extra": ""}], "duihua_lianxi": [{"type": "open", "title": "一、写出下列词语的反义词", "items": ["熟悉", "优势", "积累", "提高"]}, {"type": "open", "title": "二、在横线上填写可以搭配的词语", "items": ["贡献", "熟悉", "积累", "发挥", "招聘", "对口", "实践", "锻炼"]}, {"type": "fill", "title": "三、选词填空", "bank": ["动机", "贡献", "期望", "积累", "沟通", "发挥"], "items": [{"text": "经过十年的辛勤工作，他___了一定的资金，可以独立创业开公司了。", "answer": "积累"}, {"text": "中国的父母都___自己的孩子能成为一个优秀的成功者。", "answer": "期望"}, {"text": "这个孩子是个很认真的学生，他没有任何___去抄别人的试卷啊。", "answer": "动机"}, {"text": "很多时候，矛盾的产生都源于缺乏___，只要大家互相解释清楚了，就不会有这么多误会。", "answer": "沟通"}, {"text": "你们公司的平台太小了，使得小王无法___他的才能，真的是大材小用了。", "answer": "发挥"}, {"text": "他是我们公司的老员工，为公司的发展做出了很大___。", "answer": "贡献"}]}, {"type": "open", "title": "四、仿照例句完成句子", "items": ["1．我是来参加今天下午的面试的。\n___是来___的。\n___是___的。", "2．工资不是最重要的，重要的是工作岗位适合自己。\n___不是最重要的，重要的是___。\n___不是最重要的，重要的是___。", "3．他毕业于对外经济贸易大学。\n___于___。\n___于___。", "4．这份工作最重要的不是工资，而是工作岗位适合自己。\n最___不是___，而是___。\n最___不是___，而是___。"]}, {"type": "open", "title": "五、看谁答得好", "items": ["求职过程中求职者经常会被问到什么问题？我们应该怎么回答比较好？和朋友们一起练习一下吧。", "提问：你可以做一个自我介绍吗？　回答：___", "提问：___　回答：___", "提问：___　回答：___", "提问：___　回答：___"]}, {"type": "open", "title": "六、看谁演得好", "items": ["场景：求职面试会场\n人物1：求职者　任务：参加求职面试。\n人物2：人力资源部经理　任务：主要负责向求职者提问，并回答问题。\n人物3：人力资源部助理　任务：向求职者提问，并回答问题。\n角色扮演：和你身边的两位同学分别扮演上面的人物，模拟真实的场景，展开一段对话。"]}], "kewen": {"title": "面试方法", "paragraphs": ["求职面试好像相亲一样。企业希望在短则 30 分钟，长则几个小时的面试过程中，选出适合企业岗位工作要求的最佳人选，而应聘者也希望通过面试，展示自己，最终应聘成功。", "面试前，应聘者需要积极进行准备，仔细阅读招聘启事，明确招聘启事中对工作岗位的要求。然后，应聘者最好了解一下企业的基本现状，比如企业的规模和发展模式、主要产品或服务等，并对企业文化、经营理念进行一些了解。在此基础上，应聘者要为自己做一份内容全面并有针对性的个人简历，说明自己的基本情况以及对工作岗位的认识。此外，在正式参加面试前，求职者最好根据公司的特点选择一套得体的服装。", "面试当天，一定不要迟到，最好能提前 10 分钟到面试地点。到达目的地后求职者应耐心等候，许多公司会要求求职者填写一份应聘表格。面试时，经常会被问到一些常见问题，对这些问题要提前准备答案，这会使自己在面试的时候更从容。比如，一般面试官都会先请应聘者做一下自我介绍。而一段短短的自我介绍，其实是为进入更深入的面谈而设计的。一两分钟的自我介绍，就如同商品广告，在有限的时间内，针对客户的需要，将自己最美好的一面，毫无保留地表现出来，不但要给对方留下深刻的印象，还要立刻能引发购买欲。另外，面试中还会涉及工作经验、求职动机、薪资要求、处理突发问题的能力等。对这些常见问题进行充分的准备是面试成功的重要基础。", "面试时，良好的语言表达也很重要。首先，在发音上，要求发音清楚、声音自然；其次，在表达上，要尽量减少口头语；最后，在回答问题时要简练，不要过多谈论无关的事情。", "面试即将结束时，求职者不要在面试官面前表现出急着想离开的样子，也不要在当时就急切地问“请问我下次的面试时间是在何时”或是“您认为我怎么样”之类的问题。面试结束后的一段时间内一定要注意电话是否畅通，不要让自己错过时机。"]}, "kewen_shengci": [{"word": "展示", "pos": "动词", "def": "展现，显示，摆出来让人看。如“给你展示一下我的成果”", "pinyin": "zhǎn shì"}, {"word": "模式", "pos": "名词", "def": "某种事物的标准形式或者使人可以照着做的标准样式", "pinyin": "mó shì"}, {"word": "理念", "pos": "名词", "def": "看法、思想、思维活动的成果。如“人生理念、教学理念、办学理念、投资理念、管理理念”", "pinyin": "lǐ niàn"}, {"word": "得体", "pos": "形容词", "def": "言行恰到好处。比如“服装得体”“举止得体”", "pinyin": "dé tǐ"}, {"word": "从容", "pos": "形容词", "def": "指人镇定、时间充足", "pinyin": "cóng róng"}, {"word": "设计", "pos": "动词、名词", "def": "为做某项工作或进行某项工程而事先制定方案、计划、图样等；也可以指这些方案、计划、图样等", "pinyin": "shè jì"}, {"word": "如同", "pos": "动词", "def": "就好像。常见的结构“如同……一样”", "pinyin": "rú tóng"}, {"word": "保留", "pos": "动词", "def": "使继续存在。如“保留了下来”", "pinyin": "bǎo liú"}, {"word": "涉及", "pos": "动词", "def": "关联到，牵连到。指的是事物的关联状态", "pinyin": "shè jí"}, {"word": "薪资", "pos": "名词", "def": "工资，劳动报酬的钱", "pinyin": "xīn zī"}, {"word": "突发", "pos": "动词", "def": "突然发生，出人意料地发生。如“突发事件”", "pinyin": "tū fā"}, {"word": "充分", "pos": "形容词", "def": "足够", "pinyin": "chōng fèn"}, {"word": "简练", "pos": "形容词", "def": "简明精练。如“文笔简练、语言简练”", "pinyin": "jiǎn liàn"}, {"word": "急切", "pos": "形容词", "def": "紧急迫切", "pinyin": "jí qiè"}, {"word": "畅通", "pos": "形容词", "def": "无阻碍地通行或通过", "pinyin": "chàng tōng"}], "kewen_yuyandian": [{"num": "1", "sentence": "企业希望在短则 30 分钟，长则几个小时的面试过程中，选出适合企业岗位工作要求的最佳人选。", "explanation": ["“……则……，……则……”，“则”前加正反义形容词，表示可能的情况，类似于“……的话……，……的话……”。"], "examples": ["一些专家认为，短则三年，长则五年，存款上限放开的政策会很快开始实行。", "有的人认为，未来一段时间，房价肯定会下跌，短则数月，长则两三年。", "交通运输问题处理不好，轻则耽误人们的学习工作，重则可以使整个城市陷入混乱。", "噪声污染过大，轻则失眠睡不着，重则会导致一系列生理和心理疾病。"], "extra": ""}, {"num": "2", "sentence": "而应聘者也希望通过面试，展示自己，最终应聘成功。", "explanation": ["“而”，连词，可连接词、短语和分句，表示多种关系，比如并列关系、承接关系、转折关系、递进关系等。"], "examples": ["他是一个善良而大方的人。", "大家都在认真地上课，而他却在玩手机。", "我们公司更重视根据客观条件的限制而采取相应的行动。", "而一段短短的自我介绍，其实是为进入更深入的面谈而设计的。"], "extra": ""}, {"num": "3", "sentence": "应聘者要为自己做一份内容全面并有针对性的个人简历。", "explanation": ["“针对”，动词，对准某个目标或对象，可用于句首。", "另外，“针对”还可以指“专有所指”。"], "examples": ["我们要针对儿童的心理特点进行教育。", "针对这个问题，我们讨论过好几次。", "我这么说不是针对某个人，而是针对这种现象。", "这件事是针对我来的。"], "extra": "即学即用\n(1) ___市场需求，他们开发了多样化的产品。\n(2) 这些话都是___这个问题说的。"}, {"num": "4", "sentence": "其实是为进入更深入的面谈而设计的。", "explanation": ["“其实”，表示说明事情的真实情况。一般前后意思上往往有转折，说明上文所说的不是真实的，需要用下文更正。例如："], "examples": ["我们都以为小王出国了，其实他仍然在国内。", "他说他很熟悉北京，其实他和我一样，也不太熟悉。"], "extra": "即学即用：请用“其实”完成对话\n(1) A：山田总说自己的汉语水平不太高，也不了解北京。\nB：其实他___。\n(2) A：我今天才知道，王总原来喜欢吃中餐。\nB：你搞错了吧，估计他是不好意思，其实___。"}, {"num": "5", "sentence": "一两分钟的自我介绍，就如同商品广告。", "explanation": ["“就如同”，就好像，表示比喻。比喻句常见的结构是“（好）像……一样（似的）”，而“如”“如同”“犹如”是比喻句中比较文雅、书面的比喻词。", "“就”则表示强调。"], "examples": ["平静的湖面就如同一面大大的银镜。", "他急得就如同热锅上的蚂蚁。", "这就是我住的宾馆。", "他家就在电影院东边。", "大夫越不让我出院，我就越想出院。", "我就不相信我赶不上他。"], "extra": ""}, {"num": "6", "sentence": "针对客户的需要，将自己最美好的一面，毫无保留地表现出来。", "explanation": ["“毫无”，一点儿也没有。后面一般接名词，组成四字短语。"], "examples": ["你这样做是毫无道理的。", "他跟这件事毫无关系。", "他的病太重了，医生也毫无办法。"], "extra": "注意：毫无—毫不\n“毫不”，一点儿也不。后面一般接动词或形容词，组成四字短语。\n他批评别人的时候毫不留情。\n毫不夸张地说，他真是一个很没主见的人。\n他毫不犹豫地答应了我的要求。\n即学即用：用“毫无／毫不”填空\n(1) ___疑问，未成年人吸烟应该加以禁止。\n(2) 他成绩虽然已经很好了，但在学习上仍然___松懈。\n(3) 他一下子变得___主意了。\n(4) 我对这个问题至今___头绪。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "items": [["表现", "从容"], ["衣着", "得体"], ["语言", "简练"], ["表情", "自然"], ["准备", "充分"], ["错过", "机会"], ["突发", "事件"], ["保留", "职位"], ["贴近", "生活"], ["处理", "问题"]]}, {"type": "fill", "title": "二、选词填空", "bank": ["展示", "模式", "常见", "得体", "从容", "涉及", "突发", "理念"], "items": [{"text": "虽然形势很紧张，但他表现得非常___。", "answer": "从容"}, {"text": "他详细介绍了旅游过程中的___问题。", "answer": "常见"}, {"text": "过去几十年，中国经济的发展___以经济的高速增长为主要目标。", "answer": "模式"}, {"text": "我们一定要抓紧训练，把最精彩的表演___给观众。", "answer": "展示"}, {"text": "这次研讨会的内容___生物医药、新能源等很多领域。", "answer": "涉及"}, {"text": "当我们在遇到一些___事件的时候，一定要镇定。", "answer": "突发"}, {"text": "在面试时，___的语言表达是成功的基础。", "answer": "得体"}, {"text": "这家企业有着先进的经营___。", "answer": "理念"}]}, {"type": "open", "title": "三、连词成句", "items": ["如同美丽人间西湖的仙境", "清楚发展我们应该职业未来自己的", "参加得体时宴会我们要服装选择的", "是认真基础好学习成绩是取得的", "他最佳适合这个人选岗位是的"]}, {"type": "open", "title": "四、用所给词语完成句子", "items": ["你有什么困难就告诉我们，___。（尽量）", "你现在感冒很严重，___。（最好）", "我们积极了解用户需求，认真为用户考虑，___。（而）", "___，这家企业推出了不少保健产品。（针对）", "大家都说我汉语说得好，___。（其实）"]}, {"type": "open", "title": "五、用所给词语改写句子", "items": ["1．毫无\n你这样做一点儿意义都没有。\n改写：___。\n关于这件事我们调查了半个月，一点儿收获也没有。\n改写：___。", "2．……则……，……则……\n我想他一定能取得成功的，可能在两三年后，也可能在六七年后。\n改写：___。\n这件事的后果很严重，可能会使销售额降低，也可能会使公司倒闭。\n改写：___。"]}, {"type": "open", "title": "六、任务练习", "items": ["看谁说得好\n根据王中的个人简历，向你的同学们介绍一下王中吧。", {"kind": "table", "rows": [["姓名", "王中", "性别", "男", {"t": "照片", "r": 3}], ["出生日期", "1993 年 4 月 2 日", "籍贯（jí guàn）", "中国北京"], ["联系电话", "× × × × × × × × ×", "E-mail", "× × × × @ × × × × .com"], ["教育经历", {"t": "2010 年 9 月—2014 年 7 月，对外经济贸易大学，经济学专业，本科", "c": 4}], [{"t": "工作经历", "r": 3}, {"t": "2011 年 1 月—2 月，三星公司中国有限公司，销售部，实习生", "c": 4}], [{"t": "2012 年 7 月—8 月，西门子公司中国有限公司，人力资源部，实习生", "c": 4}], [{"t": "2013 年 7 月—8 月，京东商城有限公司，售后服务部，实习生", "c": 4}], ["获奖经历", {"t": "2013 年度一等奖学金", "c": 4}], ["求职意向", {"t": "销售专员", "c": 4}], ["自我评价", {"t": "性格开朗，容易与人相处；专业扎实，有相关工作经验。", "c": 4}]]}, "看谁写得好\n某汽车公司正在招聘一名销售员，假如你现在是一名求职者，请参考下边的招聘启事写一份有针对性的个人简历。", {"kind": "clipbox", "title": "招 聘 启 事", "lines": ["职位：汽车 4S 店销售员", "要求：", "• 能力要求：本科及本科以上学历，熟练掌握一门以上外语，有一定的销售经验。", "• 性格要求：认真，善于学习，对新事物有热情。"]}, {"kind": "clipbox", "title": "求 职 简 历", "blank": 9}]}]}, {"id": 2, "title": "初到公司", "daodu": ["今天是你第一天到公司上班，你打算怎么跟同事打招呼？", "你觉得一个新员工在公司应该注意哪些问题？"], "hexinjv": ["看你说到哪儿去了。", "有什么需要帮忙的，你尽管说。", "总是担心犯错误而过于小心，以致无法完全展示自己真实的能力。", "不妨重新考虑自己的职业选择。"], "duihua": {"intro": "王中第一天上班，人力资源部人事助理赵伟给他办理了入职手续，销售部部门经理吴经理带他认识新同事，并领他参观了公司。", "lines": [{"speaker": "场景", "text": "（早上 8:00，王中准时来到公司，在人力资源部，赵伟接待了他。）"}, {"speaker": "小王", "text": "赵助理，你好！我是销售部新入职的王中，是来办理入职手续的。"}, {"speaker": "小赵", "text": "你的相关证件都带齐了吧？"}, {"speaker": "小王", "text": "身份证、毕业证书、录用证明这些都带了。另外，还有一张一寸免冠照片。"}, {"speaker": "小赵", "text": "好的。这里还有些材料，分别是试用期劳动合同和保密协议，都是一式两份，你签一下字。三个月试用期满后，表现合格才会签订转正后的劳动合同。"}, {"speaker": "小王", "text": "好的，我签好了。"}, {"speaker": "小赵", "text": "那这样入职手续就都办完了，我这里就没问题了，你可以到销售部报到了。"}, {"speaker": "小王", "text": "您的安排真周到，真的非常感谢您的帮助！"}, {"speaker": "小赵", "text": "看你说到哪儿去了，没什么，以后我们都是同事了。"}, {"speaker": "场景", "text": "（销售部）"}, {"speaker": "小王", "text": "吴经理，您好！我来报到。"}, {"speaker": "吴经理", "text": "你好！小王，欢迎你加入我们的团队！"}, {"speaker": "小王", "text": "我刚来公司，有什么不懂的地方，还请您多加指教。"}, {"speaker": "吴经理", "text": "别客气。来，和大家认识一下。这是李丽李组长，你以后就跟着她做吧。"}, {"speaker": "小王", "text": "李组长，您好！我是王中，能和您一起工作我感到非常高兴，请多多指教！"}, {"speaker": "小李", "text": "欢迎你，小王。我也算是你的前辈了，以后有什么需要帮忙的，你尽管说。"}, {"speaker": "小王", "text": "那我就不客气了！"}, {"speaker": "小李", "text": "走，我领你参观参观，顺便介绍一下公司，让你熟悉一下工作环境。"}, {"speaker": "小王", "text": "谢谢！我会尽快熟悉工作内容的。"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "items": [{"text": "小王上班第一天，人力资源部张经理帮他办理了入职手续。", "answer": false}, {"text": "小王上班第一天就与公司签订了正式的劳动合同。", "answer": false}, {"text": "新员工在三个月的试用期结束后都能转正。", "answer": false}, {"text": "李丽是小王的长辈。", "answer": false}, {"text": "吴经理带小王参观了公司，向他介绍了销售部的同事。", "answer": true}]}, {"type": "open", "title": "二、回答问题", "items": ["谁帮小王办理了入职手续？", "办理入职手续的时候，小王需要带哪些证件？", "入职第一天，小王签了哪些协议？", "小王要到哪个部门报到？", "小王被分到了谁的销售小组里？"]}], "duihua_shengci": [{"word": "助理", "pos": "名词", "def": "协助主要负责人办事的人员", "pinyin": "zhù lǐ"}, {"word": "手续", "pos": "名词", "def": "办事时需要经过的步骤", "pinyin": "shǒu xù"}, {"word": "接待", "pos": "动词", "def": "迎接、招待", "pinyin": "jiē dài"}, {"word": "证件", "pos": "名词", "def": "用来证明身份、经历等的证书和文件", "pinyin": "zhèng jiàn"}, {"word": "录用", "pos": "动词", "def": "考试或考察之后决定吸收、任用", "pinyin": "lù yòng"}, {"word": "免冠", "pos": "动词", "def": "不戴帽子", "pinyin": "miǎn guān"}, {"word": "试用期", "pos": "名词", "def": "指新员工在正式聘用以前，先试用一个时期，看是否合适", "pinyin": "shì yòng qī"}, {"word": "保密", "pos": "动词", "def": "保守机密，使不泄露出去", "pinyin": "bǎo mì"}, {"word": "签订", "pos": "动词", "def": "订立合同或协议等并签字", "pinyin": "qiān dìng"}, {"word": "转正", "pos": "动词", "def": "组织中的非正式成员成为正式成员", "pinyin": "zhuǎn zhèng"}, {"word": "周到", "pos": "形容词", "def": "（办事情、想问题）很全面，每个地方都考虑到", "pinyin": "zhōu dào"}, {"word": "指教", "pos": "动词", "def": "指点教导，多用作请人提批评意见的套语。如“请多加指教”“请多多指教”", "pinyin": "zhǐ jiào"}, {"word": "尽快", "pos": "副词", "def": "尽量加快", "pinyin": "jǐn kuài"}], "duihua_yuyandian": [{"num": "1", "sentence": "你的相关证件都带齐了吧？", "explanation": ["“证件”，证明身份、经历等的文件，它是一个所指范围较大的概念，如身份证、工作证、医疗证等。我们一般不说“身份证件”“工作证件”“医疗证件”。"], "examples": [], "extra": "注意：证件——证书——证明\n“证书”，有机关、学校、团体等发的证明资格或权利的文件，如毕业证书、学历证书、结婚证书等。证书，是“证件”的一种，侧重于“有效性”“合法性”。\n“证明”，可以用来表明或断定人或事真实性的材料。我们常说“证明信”“证明函（hán）”等。"}, {"num": "2", "sentence": "您的安排真周到。", "explanation": ["“周到”，形容词，各方面都照顾到。常见的搭配有“照顾周到”“想得周到”“安排周到”等。"], "examples": ["这次会议的安排非常周到，让大家感觉像到了家一样。", "他们为我们花费了不少的时间和精力，他们想得周到，做得自然。", "你第一次来我家做客，如果有什么不周到之处，可以尽管告诉我。"], "extra": "注意：周到—周全、周密\n“周全”“周密”，形容词，和“周到”是同义词，都有“没有疏忽、漏洞”之意。“周到”主要侧重于“各方面安排、照顾得很好”；“周全”侧重于“（东西）齐全、完备”之意，常见搭配是“想得周全”“准备得周全”；而“周密”侧重于“（思想）严密”，常见搭配是“思想周密”。\n做好周全的准备是这次旅行所必需的。\n你竟然想得这么周全，真不错。\n他的信仰更坚定，思想也更周密。\n这篇文章首尾周密，思路清晰。\n即学即用：用“周到”“周全”“周密”填空\n(1) 在正式推出这款产品之前，我们应该把顾客的反应考虑得___些。\n(2) 为了签下这个合同，我们为各个前来公司参观的客户提供了___的服务。\n(3) 只有考虑得___，设计规划才会更科学可行。"}, {"num": "3", "sentence": "看你说到哪儿去了。", "explanation": ["“说到哪儿去了”，表示对对方的说法、观点或态度的不认同，一般会在前面或后面陈述自己的理由或看法。类似的“想到哪儿去了”。如："], "examples": ["看你说到哪儿去了，都是自家人嘛！", "我们是自由恋爱，您说到哪里去了！", "这个规定是排斥外来文化吗？说到哪里去了！", "这是想到哪儿去了，他决不会干出这种事的。"], "extra": ""}, {"num": "4", "sentence": "我也算是你的前辈了。", "explanation": ["“算是”，动词，可以认为是，后跟名词。", "“算是”还可以作副词，表示经过努力或很长时间，终于实现某种愿望或达到某种目的，也可以说成“总算是”“可算是”。", "“算是”作副词，还可以表示推测想避免的事情要出现。"], "examples": ["我在这里学习过半年，咱们算是校友了。", "北京绝对可以算是国际大都市了。", "他也算是我们学校的名人了。", "等了这么长时间，你总算是来了。", "忙碌了一个多月，这个工作今天可算是做完了。", "看样子，今天这场比赛算是输定了。", "雪下得这么大，今天开车回家算是不可能了。"], "extra": ""}, {"num": "5", "sentence": "有什么需要帮忙的，你尽管说。", "explanation": ["“尽管说”，是礼貌客气的表达方式。一般是说话人想要表达自己真诚的心意。", "另外还有其他搭配，“尽管”＋动词，如“尽管提”“尽管买”“尽管点”等。"], "examples": ["看看你想吃什么，尽管点。", "今天想买什么，尽管买，我来埋单。", "有什么要求，不要客气，尽管提出来。"], "extra": ""}], "duihua_lianxi": [{"type": "open", "title": "一、在横线上填写可以搭配的词语", "items": ["办理", "签订", "请教", "录用", "接待", "周到"]}, {"type": "open", "title": "二、仿照例子，写出三个结构类似的词语", "items": ["免冠", "周到", "证书"]}, {"type": "fill", "title": "三、选词填空", "bank": ["录用", "试用", "保密", "签订", "接待", "尽快"], "items": [{"text": "您请放心，我们公司一定会___处理你说的这个问题。", "answer": "尽快"}, {"text": "我们对口公司的经理明天会来参观，我们这些天一直在准备___的工作。", "answer": "接待"}, {"text": "经过三轮面试，我们公司今年一共___了十名名牌大学的毕业生。", "answer": "录用"}, {"text": "两家公司商谈了很久才终于在公平公正的基础上___了合作协议。", "answer": "签订"}, {"text": "我告诉你的这个消息在正式公布之前，还请你严加___。", "answer": "保密"}, {"text": "我___了很多不同品牌的产品之后，决定采购他们公司的产品。", "answer": "试用"}]}, {"type": "fill", "title": "四、词语辨析", "bank": ["指教", "请教", "录用", "录取"], "items": [{"text": "我今天有很多问题想向您___。", "answer": "请教"}, {"text": "我想给父母买一台电脑，不知道什么牌子好，请大家___。", "answer": "指教"}, {"text": "___一下，新锐公司还在招聘员工吗？", "answer": "请教"}, {"text": "这是我以前做的项目书，还要请您多___。", "answer": "指教"}, {"text": "这家企业经过招聘面试，最终___了他。", "answer": "录用"}, {"text": "高中毕业后，他被中山大学文学院___了。", "answer": "录取"}, {"text": "公司业务越来越多，今年需要___新员工了。", "answer": "录用"}, {"text": "我们学校的___分数明显高于其他学校。", "answer": "录取"}]}, {"type": "open", "title": "五、仿照例句完成句子", "items": ["1．看你说到哪儿去了，没什么，以后我们都是同事了。\n看你说到哪儿去了，___。\n看你想到哪儿去了，___。", "2．有什么需要帮忙的，您尽管说。\n___，您尽管说。\n___，您尽管___。", "3．经过大家的讨论，这个问题算是搞清楚了。\n___算是___。\n___算是___。"]}, {"type": "open", "title": "六、看谁演得好", "items": ["场景：某公司人力资源部\n人物1：要办理入职手续的新员工　任务：办理入职手续。\n人物2：人力资源部经理　任务：接待新员工。\n人物3：人力资源部人事助理　任务：帮助新员工办理入职手续。\n角色扮演：和你周围的两名同学分别扮演上面三个人物，模拟真实场景展开对话。"]}], "kewen": {"title": "初入职场", "paragraphs": ["资料表明，新员工有 50%~60% 在前六个月离职，而这一情况还在不断恶化。究其原因，大部分是因为这些大学毕业生的心态并没有调整过来。那么大学毕业生应该如何更快地适应工作岗位呢？专家提醒，优秀学生不等于合格员工，做好自我心理调节是大学毕业生在职场取胜的关键。同时，企业把握好新员工的心态变化，也是留住人才的重要方法。", "走上工作岗位，意味着学生角色向职业角色转化的真正开始。大学生初入职场，非常希望得到肯定。但刚开始工作时，新员工往往会被安排做一些技术含量较低的工作；曾经是学校里的优等生，如今却只是一名普通员工；学的是热门专业，但却没有获得期望的薪资和机会。这些让许多优秀大学生都无法适应，我们经常会听到他们抱怨“做这些工作，我的才能什么时候才能发挥出来呢”“总是让我干些跑腿的活，感觉就像受罪”，等等，这就需要他们进行自我心理调节。", "作为职场新人，毕业生应当尽快地从以往的生活模式中摆脱出来，尽快熟悉并适应新的职场生活。对新入职场的大学生来说，最重要的不是一个月拿多少薪水，而是获得经验。岗位和薪资都不会是永远不变的，所以不要太在意自己一时的得失，真正的人才决不会被永远埋没。", "此外，新员工还应认识到一点，那就是在校期间学习到的东西是有限的，很多知识和能力需要在工作实践中去学习和提高。因此，在工作中，职场新人们应该虚心地向有经验的前辈学习，不断丰富自己的专业知识，提高专业技能。曾经有一位很有才华的毕业生进入到一家国有大型企业工作，但是他总认为自己才是最了不起的，听不进老员工的意见，而事实上，他只是学到了书本上的知识，却严重缺乏实践经验，最终他的态度给公司造成了巨大损失。", "当然，在虚心学习的同时，职场新人们也要学会运用自己的知识去努力解决问题，培养自己独立开展工作的能力，以便可以尽快独当一面。总是担心犯错误而过于小心，以致无法完全展示自己真实的能力，这是工作中最要不得的。", "而在逐渐熟悉工作之后，职场新人们有必要对目前的工作进行总结，分析自己对工作的适应情况，同时对自己的能力也要进行正确的评价。如果觉得这份工作确实不适合自己，不妨重新考虑自己的职业选择，对以后的事业进行规划。当前流行的“先就业后择业”的说法不无道理。"]}, "kewen_shengci": [{"word": "表明", "pos": "动词", "def": "表示清楚", "pinyin": "biǎo míng"}, {"word": "调整", "pos": "动词", "def": "改变原来的状态，使适应新的情况和要求", "pinyin": "tiáo zhěng"}, {"word": "岗位", "pos": "名词", "def": "职位", "pinyin": "gǎng wèi"}, {"word": "调节", "pos": "动词", "def": "从数量上或程度上调整，使适合要求", "pinyin": "tiáo jié"}, {"word": "意味着", "pos": "动词", "def": "代表；表示；标志着", "pinyin": "yì wèi zhe"}, {"word": "抱怨", "pos": "动词", "def": "心中怀有不满，责怪别人", "pinyin": "bào yuàn"}, {"word": "受罪", "pos": "动词", "def": "受到折磨", "pinyin": "shòu zuì"}, {"word": "摆脱", "pos": "动词", "def": "冲破束缚和障碍而获得自由", "pinyin": "bǎi tuō"}, {"word": "埋没", "pos": "动词", "def": "使显不出来；使不发挥作用", "pinyin": "mái mò"}, {"word": "缺乏", "pos": "动词", "def": "（所需要的、想要的或一般应有的事物）没有或不够", "pinyin": "quē fá"}, {"word": "损失", "pos": "动词", "def": "失去，没有补偿", "pinyin": "sǔn shī"}, {"word": "培养", "pos": "动词", "def": "按照一定的目的长期地教育和训练；使成长", "pinyin": "péi yǎng"}, {"word": "独当一面", "pos": "", "def": "单独负责一个方面的工作", "pinyin": "dú dāng yī miàn"}, {"word": "评价", "pos": "动词", "def": "通常指对一件事或人物进行判断、分析后的结论", "pinyin": "píng jià"}, {"word": "不妨", "pos": "副词", "def": "表示可以，最好还是", "pinyin": "bù fáng"}, {"word": "规划", "pos": "动词、名词", "def": "个人或组织制订的比较全面长远的发展计划", "pinyin": "guī huà"}], "kewen_yuyandian": [{"num": "1", "sentence": "走上工作岗位，意味着学生角色向职业角色转化的真正开始。", "explanation": ["“意味着”，表示；标志着；含有某种意思，可以理解为。多用于书面语，主语多为动词性短语，后面加名词、动词或动宾结构短语表示结果。"], "examples": ["加入 WTO 意味着中国企业面临着挑战和机遇。", "科学的发展意味着人类的进步。", "年龄的增长意味着责任的增加。"], "extra": "即学即用：用“意味着”完成句子\n(1) 大学毕业___。\n(2) 两国领导人的会面___。\n(3) 新的交通法规马上就要实施了，___。"}, {"num": "2", "sentence": "对新入职场的大学生来说，最重要的不是一个月拿多少薪水，而是获得经验。", "explanation": ["“对……来说”，中间是与人有关的词语，表示后面的内容是针对这个人说的。"], "examples": ["对我来说汉字不难，语法比较难。", "对留学生来说，汉语基础学习非常重要。"], "extra": "注意：对……来说—在……看来\n“对……来说”“在……看来”中间都是与人相关的词语，后边则表示这个人或跟这个人有关的看法。\n在我看来，这并没有什么可吃惊的。\n在你看来，这个问题应该怎么解决？\n即学即用：用“对……来说”“在……看来”完成句子\n(1) ___，可是个不小的打击。\n(2) ___，与众不同是一种时尚。"}, {"num": "3", "sentence": "对新入职场的大学生来说，最重要的不是一个月拿多少薪水，而是获得经验。", "explanation": ["“不是……而是……”，这个格式中“而是”前后可以是词、词组或小句，否定前面的，肯定后面的。“而是”不能单用。"], "examples": ["给你打电话的不是安娜，而是玛丽。", "我们班不是学经贸的，而是学金融的。", "他不是病了，而是心情不太好。"], "extra": ""}, {"num": "4", "sentence": "总是担心犯错误而过于小心，以致无法完全展示自己真实的能力。", "explanation": ["“以致”，连词，经常用在复句的后一个分句的前边，表示后面的内容是前面说的原因造成的结果，多指不好的结果或不希望出现的情况。"], "examples": ["刚刚下过一场大雪，以致路上交通非常拥堵。", "他只听一面之词，以致做出了错误的判断。"], "extra": "注意：以致—以至\n“以至”和“以致”都是连词，但在用法上有很大差别。“以至”，有“一直到”的意思，表范围、数量、程度、时间等延伸和发展，一般指从小到大，从少到多，从浅到深。\n从沿海城市以至广大农村，到处是一片动人景象。（表范围）\n要学会游泳，必须一次、两次以至十次百次地反复练习。（表时间、数量）\n另外，“以至”有甚至的意思，用在一句开头，表示由于前一分句的情况而产生某种结果。\n他专心致志地工作，以至有人招呼他也没有听到。\n即学即用：用“以致”“以至”填空\n(1) 现代科学技术的发展日新月异，___从前神话、童话中的一些幻想故事，现在都有可能成为现实。\n(2) 由于不注意安全操作___出了严重的事故。\n(3) 遇事要积极思考，要想到问题的两面、三面___多面。\n(4) 如今人们已经不仅能够预知几天的，而且能够预知几个月___几年的天气趋势。"}, {"num": "5", "sentence": "不妨重新考虑自己的职业选择。", "explanation": ["“不妨”，副词，可以。用于动词前，委婉地表示建议的一种说法，意思是“可以这样做”。"], "examples": ["这个菜不太辣，你不妨尝一尝。", "据说这种新药效果不错，你不妨试试看。", "他不是外人，你不妨当面跟他说清楚这件事。"], "extra": "即学即用：用“不妨”完成句子\n(1) 既然大家都说这个办法好，___。\n(2) 他总是要知道的，___。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "items": [["适应", "环境"], ["调整", "日程"], ["缺乏", "资金"], ["埋没", "人才"], ["职业", "规划"]]}, {"type": "fill", "title": "二、选词填空", "bank": ["调节", "调整", "损失", "抱怨", "热门", "克服", "摆脱", "埋没", "缺乏", "评价"], "items": [{"text": "巴西队是这次足球世界杯的夺冠___。", "answer": "热门"}, {"text": "是金子总会发光的，而只要有才能就永远不会被___。", "answer": "埋没"}, {"text": "初到公司，新员工需要通过___自己来适应工作环境，而不是让别人来适应自己。", "answer": "调整"}, {"text": "他从来不承认自己做错了，总是___别人对不住自己。", "answer": "抱怨"}, {"text": "要想完成这项工作，必须___很多困难才行。", "answer": "克服"}, {"text": "由于太空中没有白天和黑夜，所以飞行器的窗口是可以___的。", "answer": "调节"}, {"text": "财务工作必须很仔细才行，一个小的失误就会让公司___惨重。", "answer": "损失"}, {"text": "他最近一直做噩梦，很难从中___出来。", "answer": "摆脱"}, {"text": "中国西部地区有丰富的资源，但___人才和资金，一直没能发展起来。", "answer": "缺乏"}, {"text": "他设计的产品虽然很好，但顾客的___却不高。", "answer": "评价"}]}, {"type": "fill", "title": "三、词语辨析", "bank": ["职业", "事业", "规划", "计划"], "items": [{"text": "这名退休老教师将自己的一生都投入到了祖国的教育___中。", "answer": "事业"}, {"text": "越来越多的___女性因忙于工作而忽视了自我保健。", "answer": "职业"}, {"text": "改革开放三十多年来，我国的体育___获得了全面发展。", "answer": "事业"}, {"text": "他的这份___是全家人现在主要的生活来源。", "answer": "职业"}, {"text": "随着假期的来临，大家都制定了出行___。", "answer": "计划"}, {"text": "环境保护的问题，政府应该全面___。", "answer": "规划"}, {"text": "我们公司___明年招聘一批新员工。", "answer": "计划"}, {"text": "在国家的整体发展___中，长江三角洲是重点发展地区。", "answer": "规划"}]}, {"type": "open", "title": "四、连词成句", "items": ["新老同事虚心学习向员工应该", "认真得失成功迈向只有工作不计较才能", "评价年轻人要能力正确有自己的对", "大学环境很差异的工作与有大校园"]}, {"type": "open", "title": "五、看谁说得好", "items": ["职场和校园生活是完全不一样的，结合课文和你的理解，和朋友们一起说一说在职场中我们应该怎么做才好呢？", "1．怎么样调节心态？", "2．如何对待工作？", "3．怎么发挥才能？", "4．如何规划职业发展？"]}, {"type": "open", "title": "六、看谁写得好", "items": ["假如你现在刚到一个公司工作，怎么向同事们介绍自己呢？请写下来并向周围的朋友介绍自己。"]}]}, {"id": 3, "title": "入职培训", "daodu": ["如果你马上要到一家公司工作，你想了解这家公司哪些方面？", "入职培训会涉及哪些方面呢？"], "hexinjv": ["好在今年招聘了你们这一批新员工。", "除了生产部外，还有研发部、销售部、人力资源部和行政部。", "让新员工全面了解公司，以增强他们对企业的使命感。", "不管是企业价值观还是企业的行为规范，都需要通过企业的员工来体现。"], "duihua": {"intro": "王中和其他新入职职员参加了新锐公司组织的入职培训，高副总经理、人力资源部张经理和财务部陈经理分别给他们作了讲座。", "lines": [{"speaker": "吴经理", "text": "各位新员工，大家好！首先我代表公司全体员工，向你们这些新入职的同事表示热烈的欢迎！欢迎你们加入到新锐公司这个大家庭中。我们今天在这里举行一年一度的新员工入职培训。下面欢迎高副总为我们大家介绍公司的一般情况。"}, {"speaker": "高副总", "text": "各位，正如大家所知道的，我们公司是一家生产型企业，从 1993 年 2 月成立至今已有 20 多年，经营范围从一种产品的生产发展到近百种，营业收入连续三年超过 1 亿元，公司也在国内有了一定的知名度。我们公司目前一共大约有 190 多名员工，但现在公司业务发展很快，现有人员已经不足以应付这么大的业务量了！好在今年招聘了你们这一批新员工，希望各位的加入为公司带来新的活力！也祝各位自己都能有好的发展。"}, {"speaker": "吴经理", "text": "谢谢高副总精彩的讲话，下面有请人力资源部张经理为大家介绍公司的组织结构。"}, {"speaker": "张经理", "text": "公司一共有五个部门，除了生产部以外，还有研发部、销售部、人力资源部和行政部。研发部主要负责产品的设计与开发；销售部主要负责产品的市场销售，也是和客户打交道最多的部门；人力资源部主要负责员工的招聘、培训；行政部则负责公司的日常活动、规章制定等工作。今后大家就会慢慢了解到各个部门的工作业务。"}, {"speaker": "吴经理", "text": "好的，下面就由财务部陈经理介绍大家最关心的薪资问题。有请！"}, {"speaker": "陈经理", "text": "我们公司的薪资待遇在同类公司中还是不错的，除了每月的薪水以外，公司还有丰厚的奖金。在休假方面，每年除了公休假期以外，还有半个月的带薪假期。"}, {"speaker": "吴经理", "text": "好的，通过各位经理的介绍，相信大家应该对公司的情况有了一定的了解，希望这次培训对大家今后的工作能有一定的帮助，也希望大家能尽快投入工作。"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "intro": "", "bank": [], "items": [{"text": "给小王等新员工进行入职培训的一共有四位经理。", "answer": true}, {"text": "吴经理给新员工详细地介绍了公司的组织结构。", "answer": false}, {"text": "新锐公司成立于 1992 年，至今已经有 190 多名员工。", "answer": false}, {"text": "新锐公司一共有五个部门，包括研发部、行政部、销售部、商务发展部等。", "answer": false}, {"text": "新锐公司的员工除了有公休假期以外，还有半个月的带薪假期。", "answer": true}]}, {"type": "match", "title": "二、连线：请将新锐公司各个具体部门和所负责的业务进行连线", "intro": "", "bank": [], "items": [["研发部", "产品的设计与开发"], ["行政部", "日常活动、规章制定"], ["人力资源部", "员工的招聘、培训"], ["销售部", "产品的市场销售"], ["生产部", "产品的生产"]]}], "duihua_shengci": [{"word": "培训", "pos": "动词、名词", "def": "有组织地进行知识、技能等的传递", "pinyin": "péi xùn"}, {"word": "讲座", "pos": "名词", "def": "由教师不定期地向学生讲授与学科有关的知识的一种教学活动形式", "pinyin": "jiǎng zuò"}, {"word": "应付", "pos": "动词", "def": "对人对事采取措施、办法。如：“应付复杂的局面”", "pinyin": "yìng fù"}, {"word": "精彩", "pos": "形容词", "def": "表现超出一般，出色。如“表演精彩”“精彩的演讲”", "pinyin": "jīng cǎi"}, {"word": "结构", "pos": "名词", "def": "组成整体的各部分的搭配和安排。如“经济结构”“组织结构”“人员结构”", "pinyin": "jié gòu"}, {"word": "研发", "pos": "动词", "def": "研制开发", "pinyin": "yán fā"}, {"word": "销售", "pos": "动词", "def": "出售", "pinyin": "xiāo shòu"}, {"word": "行政", "pos": "名词", "def": "指机关、企业、团体等内部的管理工作", "pinyin": "xíng zhèng"}, {"word": "开发", "pos": "动词", "def": "通过研究或努力，发现、利用新的资源或新的领域", "pinyin": "kāi fā"}, {"word": "制定", "pos": "动词", "def": "定出；拟定。“制定规划、制定制度”", "pinyin": "zhì dìng"}, {"word": "待遇", "pos": "名词", "def": "经济报酬、社会福利等", "pinyin": "dài yù"}, {"word": "奖金", "pos": "名词", "def": "对与生产或工作直接相关的超额劳动给予报酬", "pinyin": "jiǎng jīn"}, {"word": "投入", "pos": "动词", "def": "进入某个环境或状态", "pinyin": "tóu rù"}], "duihua_yuyandian": [{"num": "1", "sentence": "正如大家所知道的……", "explanation": ["“正如”，就像……。“如”是“像”“和……一样”的意思，而“正”表示强调，“就”的意思。"], "examples": ["正如吴经理说的，我们公司有五个部门。", "正如新闻里讲的，今年我们公司的销售额超过了 1 亿元。", "我轻轻地走了，正如我轻轻地来。"], "extra": ""}, {"num": "2", "sentence": "已经不足以应付这么大的业务量了。", "explanation": ["“足以”，动词，完全可以；够得上。否定式是“不足以”。"], "examples": ["这九种灾难足以毁灭整个地球。", "我们在大学里所学的知识不足以应付以后的工作。", "这些证据不足以证明他就是凶手。"], "extra": "即学即用：请用“足以”完成下面的句子\n(1) A: 听说你们采用了新的营销模式，效果怎么样？\nB: 我们公司的客户这个月增加了 10%, 消费者的数量足以说明。\n(2) A: 这次比赛你能打败你的对手吗？\nB: 凭借我的实力，我。"}, {"num": "3", "sentence": "好在今年招聘了你们这一批新员工。", "explanation": ["“好在”，副词，用在分句的开头，表示具有某种有利的条件或情况。"], "examples": ["我有空再来，好在我住的地方离这儿不远。", "这栋房子面积不大，好在质量不错，而且是朝南的。", "好在他比较喜欢交朋友，不然很难一个人在另一个国家工作这么多年。", "天气忽然冷了，好在我多带了一件衣服。"], "extra": ""}, {"num": "4", "sentence": "除了生产部以外，还有研发部、销售部、人力资源部和行政部。", "explanation": ["(1)“除了……以外，……还（也）……”表示“在什么以外，还有别的”，有“……一共……”的意思。", "(2)“除了……以外，……都……”，表示排除特殊的，强调一般的，有“……只有……”的意思。"], "examples": ["我来中国除了学习汉语以外，还学习中医。", "我除了去过上海、天津以外，还去过广州。", "我们班除了玛丽不喜欢滑冰以外，别的同学都喜欢。", "北京的公园很多，我除了去过颐和园以外，别的都没去过。"], "extra": ""}, {"num": "5", "sentence": "也是和客户打交道最多的部门。", "explanation": ["“打交道”，口语词，“交往”的意思。一般用在“和／跟／同……打交道”的结构中。"], "examples": ["他喜欢跟各种人打交道。", "我没跟他打过交道。"], "extra": ""}], "duihua_lianxi": [{"type": "open", "title": "一、在横线上填写可以搭配的词语", "intro": "", "bank": [], "items": ["开发___", "加入___", "研发___", "制定___", "投入___", "培训___", "举行___", "设计___"]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["精彩", "应付", "投入", "开发", "打交道", "连续", "组织", "培训"], "items": [{"text": "最近公司业务繁忙，我们已经___加班两个星期了。", "answer": "连续"}, {"text": "张经理以他___的演讲获得了大家阵阵掌声。", "answer": "精彩"}, {"text": "我们公司新引进的生产线将于本月底___使用。", "answer": "投入"}, {"text": "他们公司太不讲信用了，我决定以后再也不和他们___了。", "answer": "打交道"}, {"text": "最近事情太多，我真是难以___。", "answer": "应付"}, {"text": "公司___的新产品主要以绿色天然为主题。", "answer": "开发"}, {"text": "这次暴力事件是由几个非法分子___实施的。", "answer": "组织"}, {"text": "在这次技术___中，我获得了很多新知识。", "answer": "培训"}]}, {"type": "open", "title": "三、用“除了……以外……”改写句子", "intro": "", "bank": [], "items": ["对外经贸大学有外国留学生，还有很多中国学生。", "他会很多种外语，会说英语，还会说法语和日语。", "参加这次学术讨论会的，有中国专家，还有一些外国专家。", "医生只给他检查了眼睛，耳朵、鼻子、牙齿都没有检查。", "我今天下午有事儿不能跟你一起去，下午和晚上都可以。"]}, {"type": "open", "title": "四、模仿例句，用括号中的词语造句", "intro": "", "bank": [], "items": ["单身的日子有些孤单，好在他还有网络。（好在）", "这些事实足以说明问题。（足以）", "正如经理所说的，这次培训内容很丰富。（正如）"]}, {"type": "open", "title": "五、看谁演得好", "intro": "", "bank": [], "items": ["场景：某跨国公司销售部", "人物 1：初入公司的新员工。任务：到公司上班第一天，表达自己的想法。", "人物 2：销售部部门经理。任务：向部门同事介绍新员工，并介绍公司的情况。", "人物 3：销售部老员工。任务：认识新员工，并简单交谈。", "角色扮演：和你周围的两名同学分别扮演以上三个人物，模拟真实场景展开对话、完成任务。"]}], "kewen": {"title": "入职培训", "paragraphs": ["入职培训，又叫岗前培训，是企业给新员工介绍企业历史、工作内容、行为规范、企业组织结构等活动的总称。入职培训的目的不是为了促进员工的发展，而是使员工尽快融入企业。", "从培训内容上来说，入职培训主要包括三个方面。首先，要给新进员工介绍企业概况，例如企业发展史、现阶段的组织结构等，让新员工全面了解公司，以增强他们对企业的使命感。其次，还要向员工介绍企业的价值观、管理制度以及行为模式等，帮助他们尽快适应企业环境和新的工作岗位。最后，企业还应使新员工了解所从事工作的基本内容，使他们明确自己的工作职责和工作流程。", "在上面三项内容中，第二项最为重要。不管是企业价值观还是企业的行为规范，都需要通过企业的员工来体现。对企业来说，通过入职培训，让员工了解企业的使命和经营理念是促进员工对企业文化认可的重要环节。因此，入职培训不仅仅是单纯的职业技能培训，而更应该是让员工了解企业文化的重要方法。另外，这些新员工，不管是否是初入职场，都希望多了解一下自己将要工作的地方，尽快融入到团队中去。而通过入职培训，新员工就可以充分了解企业文化，并在此基础上规划自己的职业生涯。因此，入职培训也是使新员工从社会人成为公司职业人的过程。", "从培训形式上看，目前入职培训可分为两大类。第一类是传统型培训，主要是以讲座的形式来进行的。如果采用这种形式培训的话，培训形式、时间安排等问题都需要认真考虑。比如，在培训的技巧方面一定要引用恰当的例子，以便于新员工准确理解培训的内容。每次培训的时间不宜过长，单次培训的时间最好不要超过 120 分钟。而另一类是新型培训形式，比如户外式培训等。"]}, "kewen_shengci": [{"word": "规范", "pos": "名词", "def": "大家共同遵守的或用文字规定下来的标准", "pinyin": "guī fàn"}, {"word": "促进", "pos": "动词", "def": "促使前进；推动使向前发展", "pinyin": "cù jìn"}, {"word": "融入", "pos": "动词", "def": "融合；混入、混合。也指一个人从思想上和形式上融入一个群组", "pinyin": "róng rù"}, {"word": "概况", "pos": "名词", "def": "大概的情况", "pinyin": "gài kuàng"}, {"word": "使命", "pos": "名词", "def": "责任，任务", "pinyin": "shǐ mìng"}, {"word": "明确", "pos": "形容词、动词", "def": "清楚明白而且确定；使……变得清楚明白而且确定。如“目的明确”“分工明确”“主题明确”；“明确表示态度”“明确了任务”“明确了权利”", "pinyin": "míng què"}, {"word": "职责", "pos": "名词", "def": "职务上应尽的责任", "pinyin": "zhí zé"}, {"word": "体现", "pos": "动词、名词", "def": "指某种性质或现象在某一事物上具体表现出来", "pinyin": "tǐ xiàn"}, {"word": "环节", "pos": "名词", "def": "相互关联的许多人或事物中的一个。如“生产环节”", "pinyin": "huán jié"}, {"word": "单纯", "pos": "形容词", "def": "单一", "pinyin": "dān chún"}, {"word": "生涯", "pos": "名词", "def": "指从事某种活动或职业的生活，也指生命、人生", "pinyin": "shēng yá"}, {"word": "技巧", "pos": "名词", "def": "指表现在艺术、工艺、体育等方面的巧妙的技能，如“绘画技巧”", "pinyin": "jì qiǎo"}, {"word": "恰当", "pos": "形容词", "def": "合适、适当", "pinyin": "qià dàng"}, {"word": "不宜", "pos": "动词", "def": "不适宜", "pinyin": "bù yí"}], "kewen_yuyandian": [{"num": "1", "sentence": "让新员工全面了解公司，以增强他们对企业的使命感。", "explanation": ["“以……”，表示想要达到某一种目的，而这个目的出现在后一分句。“以”多用于书面语，有时候我们也可以用“以便”。"], "examples": ["每个人都必须参加入职培训，以提高自身的工作能力。", "你应该努力学习，以便取得好成绩。", "你说话的时候发音要清晰，以便别人可以听懂你的意思。", "在培训的技巧方面一定要引用恰当的例子，以便于新员工准确理解培训的内容。"], "extra": "即学即用：请用“以／以便……”改写下面的句子\n(1) 你最好带身份证过来，这样我可以统计信息。\n(2) 请把安全出口的杂物拿走，如果以后发生火灾的话可以逃生。"}, {"num": "2", "sentence": "让新员工全面了解公司，以增强他们对企业的使命感。", "explanation": ["“××感”，感觉，情感，感想的意思。“感”前面经常用和心理活动有关的词语修饰。", "汉语中有很多类似的后缀，放在词语的后面组成新词。比如这一课中出现的“生产型”“知名度”“传统型”“户外式”，这里的“××型”“××度”“××式”都是构词能力较强的后缀。"], "examples": [], "extra": "即学即用\n使命感 亲切感 责任感 安全感 失落感\n传统型 型 型 型 型\n知名度 度 度 度 度\n户外式 式 式 式 式"}, {"num": "3", "sentence": "企业还应使新员工了解所从事工作的基本内容。", "explanation": ["“所”，助词，“所＋动词＋的”作定语，或代替名词词组。如：“所说的话”“所做的事”“所学的知识”。这种情况口语里可以不用“所”，意思一样，如“我所了解的情况不多（＝我了解的情况不多）”，“他所说的不一定正确（＝他说的话不一定正确）”。"], "examples": ["大家所学的都不一样。", "我所知道的情况就这些。", "我所关心的是你来还是不来。"], "extra": "即学即用：用“‘所’字结构”完成下列句子\n(1) ，我都记住了。\n(2) 老王 都教给了徒弟。"}, {"num": "4", "sentence": "不管是企业价值观还是企业的行为规范，都需要通过企业的员工来体现。", "explanation": ["“不管”，连词，表示在任何条件下，结果或结论都不会改变。“不管”后边经常跟疑问代词或者并列短语，后一小句经常搭配“都、也”。"], "examples": ["不管天气好还是不好，我们明天都去长城。", "不管电影还是电视，他都不喜欢。", "不管是否是真正的初入职场，每个人都希望多了解一下自己将要工作的地方。", "老师说，不管谁有问题，现在都可以去问他。"], "extra": ""}, {"num": "5", "sentence": "入职培训不仅仅是单纯的职业技能培训，而更应该是让员工了解企业文化的重要方法。", "explanation": ["“不仅仅是……而更（应该）是……”，这个构式意思和“不是……而是……”完全不一样，同时肯定前后两个小句，只不过后一小句更为重要。有时候也会说“不仅仅是……更重要的是……”。"], "examples": ["给你打电话不仅仅是想和你聊几句，而更是要通知你上课时间的变化。", "我们不仅仅要学好汉语，而更是要学好经贸知识。"], "extra": ""}, {"num": "6", "sentence": "每次培训的时间不宜过长。", "explanation": ["“不宜”，动词，不适宜。多用于书面语。一定要带动词、形容词做宾语。有时也用“不宜于”。"], "examples": ["你的病还没完全好，可以工作，但不宜太累。", "现在病人正在休息，不宜见客。", "这个地方很危险，不宜停留。", "他今天身体不好，不宜饮酒。"], "extra": ""}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["融入", "团队"], ["规范", "行为"], ["明确", "职责"], ["促进", "发展"], ["职业", "生涯"], ["职责", "明确"], ["入职", "培训"], ["精神", "体现"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["促进", "引用", "融入", "适应", "恰当", "环节", "使命", "生涯"], "items": [{"text": "带领整个团队不断发展是总裁肩负的重大___。", "answer": "使命"}, {"text": "虽然他是第一次来北京，但很快就___了北京的生活。", "answer": "适应"}, {"text": "2004 年世界杯的失利是齐达内职业___中最大的遗憾。", "answer": "生涯"}, {"text": "信息技术已经___我们每一个人的生活。", "answer": "融入"}, {"text": "我们必须严格把控好每一个生产___的质量。", "answer": "环节"}, {"text": "他的这本书中___了很多经济学家的看法。", "answer": "引用"}, {"text": "你之所以没有得到好成绩，是因为你没有使用___的词语进行表述。", "answer": "恰当"}, {"text": "好的管理制度可以大大___生产力的发展；反之，则不会。", "answer": "促进"}]}, {"type": "fill", "title": "三、词语辨析", "intro": "", "bank": ["单纯", "单一", "规范", "规定"], "items": [{"text": "1.（单纯／单一）(1) ___地采用一种方法是没办法学好汉语的。", "answer": "单纯"}, {"text": "1.（单纯／单一）(2) 我要扩大自己的阅读范围，现在的知识太___。", "answer": "单一"}, {"text": "1.（单纯／单一）(3) 他虽然已经进入社会很多年了，但还是像小孩子一样___。", "answer": "单纯"}, {"text": "2.（规范／规定）(1) 许多道德___是人们必须遵守的。", "answer": "规范"}, {"text": "2.（规范／规定）(2) 毕业论文的格式一定要___。", "answer": "规范"}, {"text": "2.（规范／规定）(3) 要用大学生守则来___大学生们的言行。", "answer": "规范"}, {"text": "2.（规范／规定）(4) 新的交通法___，机动车闯红灯会更严厉处罚。", "answer": "规定"}, {"text": "2.（规范／规定）(5) 用人单位安排加班的，应当按照国家有关___向劳动者支付加班费。", "answer": "规定"}]}, {"type": "open", "title": "四、连词成句", "intro": "", "bank": [], "items": ["入职培训的目的融入为了员工使团队是尽快", "企业文化应该员工影响产生行为能对", "入职培训职业生涯规划自己的员工可以使"]}, {"type": "open", "title": "五、用所给词语完成句子", "intro": "", "bank": [], "items": ["昨天你在三楼看见的___。（不是……而是……）", "不管是___还是___，___。（……都……）", "他不管怎么忙，___。（不管……都……）", "入职培训时的讲授___。（有利于）", "新员工都需要培训，___。（便于）"]}, {"type": "open", "title": "六、看谁说得好", "intro": "", "bank": [], "items": ["四人一组，一个人做主持人，另外三个人每人一张图，根据图片内容，并参考课文内容，分角色向大家介绍一下新锐公司入职培训的情况。", "图 1（培训内容介绍：Part1：公司介绍 Part2：HR Part3：财务部）组织结构：总经理—生产部、销售部", "图 2 薪资待遇：□薪水 □奖金 □休假 □其他福利", "图 3"]}]}, {"id": 4, "title": "商务宴请", "daodu": ["宴请对于商务谈判有什么作用？", "参加商务宴会的时候应该注意哪些问题？"], "hexinjv": ["请允许我代表我们公司热烈欢迎各位朋友！", "无论是为了推进双方的合作，还是表达一种尊重，中国人总是喜欢选择宴请这种方式在餐桌上解决问题。", "从而增加彼此间商务合作的机会。"], "duihua": {"intro": "新锐公司副总经理高雷在酒店宴请天乐公司总经理李一冰。", "lines": [{"speaker": "场景", "text": "（酒店包间内）"}, {"speaker": "李总经理", "text": "您好，高总！久仰贵公司大名，今天终于见面了。"}, {"speaker": "高副总", "text": "哪里哪里，李总客气了！来，大家请入席。李总，您是我们的贵客，您请上座。"}, {"speaker": "李总经理", "text": "谢谢贵公司的热情款待！您也请坐！"}, {"speaker": "高副总", "text": "非常荣幸可以在这里招待各位朋友，请允许我代表我们公司热烈欢迎各位朋友。"}, {"speaker": "李总经理", "text": "我们也很高兴能和大家一起共进晚餐。"}, {"speaker": "高副总", "text": "对了，李总，我听说最近你们公司的产品出了一点小问题，对咱们的合作影响大吗？"}, {"speaker": "李总经理", "text": "您放心。为了防止产生误会，我们早已向消费者解释清楚了。"}, {"speaker": "高副总", "text": "太好了！这下我们可以放心了！"}, {"speaker": "李总经理", "text": "这件事差点儿影响了咱们的合作，来，我敬您一杯。祝咱们的合作顺利"}, {"speaker": "高副总", "text": "另外，我还想问一下，贵方最近研发的新产品究竟卖得怎么样？"}, {"speaker": "李总经理", "text": "那个产品很畅销，最近我们正在招各个地区的代理商。因为是新产品，所以我们对代理商有很多优惠。高总如果有合适的人选，也可以给我们推荐！"}, {"speaker": "高副总", "text": "没问题！来，为我们的合作举杯！"}, {"speaker": "李总经理", "text": "祝咱们两家公司都生意兴隆。"}, {"speaker": "高副总", "text": "这是闻名中国的鱼香肉丝。来，李总，您尝尝。"}, {"speaker": "李总经理", "text": "谢谢！哎哟，这个菜好辣啊！请问有甜点吗？"}, {"speaker": "高副总", "text": "中国人一般先吃凉菜，随后才是主菜和汤。中国人的主食一般吃米饭和面食，不吃甜点。"}, {"speaker": "李总经理", "text": "那我来点面条吧。今天的菜太丰盛了！高总，我敬您一杯，感谢您和各位的热情款待！"}, {"speaker": "高副总", "text": "那大家一起干一杯吧，为我们的合作再次干杯！"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "intro": "", "bank": [], "items": [{"text": "高副总坐在了上位。", "answer": false}, {"text": "李总公司的产品让消费者产生了误会。", "answer": false}, {"text": "李总公司的产品问题影响了他们的合作。", "answer": false}, {"text": "李总公司的新产品在全国卖得很好。", "answer": true}, {"text": "高副总很喜欢吃辣。", "answer": false}, {"text": "中国人喜欢吃甜点。", "answer": false}]}, {"type": "open", "title": "二、回答问题", "intro": "", "bank": [], "items": ["李总为什么坐在上座呢？", "李总公司的产品问题会影响新产品吗？", "李总公司的新产品卖得怎么样？", "中国人一般吃饭时上菜的顺序是什么？"]}], "duihua_shengci": [{"word": "宴请", "pos": "名词", "def": "设酒宴招待", "pinyin": "yàn qǐng"}, {"word": "久仰", "pos": "动词", "def": "仰慕已久，初次见面时的客气说法", "pinyin": "jiǔ yǎng"}, {"word": "入席", "pos": "动词", "def": "举行宴会时坐在已经安排好的座位上", "pinyin": "rù xí"}, {"word": "款待", "pos": "名词", "def": "招待", "pinyin": "kuǎn dài"}, {"word": "荣幸", "pos": "形容词", "def": "指荣耀而幸运。一般是表现自己谦虚的意思", "pinyin": "róng xìng"}, {"word": "允许", "pos": "动词", "def": "答应、同意", "pinyin": "yǔn xǔ"}, {"word": "防止", "pos": "动词", "def": "事先行动或做好准备，不让不好的事情发生", "pinyin": "fáng zhǐ"}, {"word": "究竟", "pos": "副词", "def": "到底", "pinyin": "jiū jìng"}, {"word": "畅销", "pos": "形容词", "def": "产品受欢迎，卖得很快", "pinyin": "chàng xiāo"}, {"word": "代理", "pos": "动词", "def": "受委托代表当事人进行某种活动", "pinyin": "dài lǐ"}, {"word": "优惠", "pos": "形容词", "def": "给予好处", "pinyin": "yōu huì"}, {"word": "推荐", "pos": "动词", "def": "指介绍好的人或事物希望被任用或接受", "pinyin": "tuī jiàn"}, {"word": "兴隆", "pos": "形容词", "def": "生意特别好", "pinyin": "xīng lóng"}, {"word": "闻名", "pos": "动词", "def": "名声大，大家都听说过", "pinyin": "wén míng"}, {"word": "丰盛", "pos": "形容词", "def": "食物丰富，充足", "pinyin": "fēng shèng"}], "duihua_yuyandian": [{"num": "1", "sentence": "请允许我代表我们公司热烈欢迎各位朋友。", "explanation": ["“请允许我……”，在宴会或者酒会上，祝酒者表达美好的愿望。例如："], "examples": ["请允许我代表我们公司祝贺咱们双方的合作成功。", "请允许我举杯祝贺我们今年的销售量突破 1000 万。"], "extra": "即学即用：请用“请允许我……”完成下面的句子\n(1) A: 总经理，今年咱们取得了这么好的业绩，您说点什么。\nB：请允许我。\n(2) A: 今天咱们新店开业，您说点什么吧。\nB: 请允许我。\n注意：礼貌用语举例\n欢迎你来我们公司应聘。（欢迎……）\n很高兴能有这次机会。（很高兴……）\n非常荣幸加入到销售部这个大家庭中来。（非常荣幸……）\n请入席、请上座\n请多多关照、请多指教\n贵公司、贵方（贵＋名词）\n为我们的合作干杯！（为……干杯）"}, {"num": "2", "sentence": "为了防止产生误会，我们早已向消费者解释清楚了。", "explanation": ["“防止”，事先行动或做好准备，不让不好的事情发生。例如："], "examples": ["夏天到了，要注意食品卫生，防止发生食物中毒。", "这件事你要好好和他解释，防止发生误会。"], "extra": "即学即用：请用“防止”完成下面的句子\n(1) A: 今天的雨好大啊。\nB：要注意交通安全，。\n(2) A: 听说你下个月要去旅游。\nB: 是的，我大概去半个月。\nC: 时间挺长的，记得买保险啊，。"}, {"num": "3", "sentence": "这件事差点儿影响了咱们的合作。", "explanation": ["“差点儿”，表示某种事情接近实现或者勉强实现。如果是说话人不希望发生的事情，说“差点儿＋动词”或“差点儿没＋动词”，都表示事情没有实现，表明说话人有一点幸运的意思。如果说话人希望事情发生，说“差点儿＋动词”是惋惜事情没有能实现，说“差点儿没＋动词”是庆幸事情终于实现了。例如："], "examples": ["我今天差点儿迟到。（没迟到）", "这件事我差点儿忘记了。（没忘记）", "我刚才差点儿没摔倒。", "今天我差点儿没有赶上公司的班车。"], "extra": "即学即用：请用“差点儿／差点儿没”完成下面的句子\n(1) A: 老板让你买的资料，你买到了吗？\nB: 我今天去的时候，就剩最后一本了，差点儿。\n(2) A: 今天你走得那么晚，迟到了吗？\nB: 幸好我打的了，差点儿。"}, {"num": "4", "sentence": "贵方最近研发的新产品究竟卖得怎么样？", "explanation": ["“究竟”，用在问句里，表示进一步追究。例如：", "另外，究竟还可以用作名词，表示事情的原因和结果。例如："], "examples": ["明天你究竟愿不愿意跟我们一起去？", "山上究竟有没有人？", "这件事我一定要问个究竟。"], "extra": "即学即用：请用“究竟”完成下面的句子\n(1) A：都七点了，小王怎么还没来？\nB: 我给他打个电话吧，问问他。\n(2) A: 听说你们的产品最近出问题了，你们的经销商一定很着急吧？\nB: 是啊，最近每天都有经销商打电话来"}, {"num": "5", "sentence": "因为是新产品，所以我们对代理商有很多优惠。", "explanation": ["注意：代理—代办", "这两个词都是动词。", "它们的区别在于：代办侧重于日常生活替人办理某事，如代理签证、代办托运；而代理一般则具有法律效力，通常是受当事人委托代表他进行某种活动，如贸易、诉讼、签订合同等。", "此外，“代理”可以带兼语，“代办”则不能。例如："], "examples": ["请律师全权代理我处理这件事。"], "extra": "即学即用：请用“代理”“代办”填空\n(1) 现在出去旅游方便多了，旅行社可以___签证。\n(2) 我们总经理出差了，这段时间王经理___他负责这个项目。\n(3) 如果你明天有事，这件事就由我___吧。\n(4) 新锐公司是这家美国公司在中国的总___。"}, {"num": "6", "sentence": "为我们的合作再次干杯！", "explanation": ["“为……＋动词”，也常说“为……而……”，表示动作、行为的目的，后接动词词组，“而”起连接的作用，有时候可以省略。"], "examples": ["为自己的利益伤害别人，是非常错误的。", "我们是为了了解中国而学习中文的。", "每一个学生都应该为建设祖国而努力学习。"], "extra": ""}, {"num": "7", "sentence": "今天的菜太丰盛了！", "explanation": ["注意：丰盛—丰富", "两者的区别在于：“丰盛”多形容食品酒菜等；“丰富”可以修饰物质的东西，也可以修饰精神的东西，例如物产、书籍、知识、经验、感情等，还可以用作动词。例如："], "examples": ["昨天的宴会非常丰盛。", "中国的水力资源非常丰富，只是还没有充分开发和利用。", "我想多参加一些社会活动，丰富自己的阅历和经验。"], "extra": "即学即用：请用“丰富”“丰盛”填空\n(1) 要开展多种多样的文化活动，___员工的业余生活。\n(2) 他已经做了几十年生意了，有着___的经商经验。\n(3) 这本书的内容非常___。"}], "duihua_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["久仰", "大名"], ["生意", "兴隆"], ["闻名", "全国"], ["食物", "丰盛"], ["出售", "商品"], ["代理", "产品"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["款待", "兴隆", "代理", "推荐", "允许", "畅销", "丰盛", "闻名"], "items": [{"text": "你们真是太客气了，非常感谢你们的热情___。", "answer": "款待"}, {"text": "今年他们公司改变了营销策略，生意十分___。", "answer": "兴隆"}, {"text": "请律师___我处理这件事。", "answer": "代理"}, {"text": "今晚的饭菜真___，我都吃不下了。", "answer": "丰盛"}, {"text": "中国的长城、埃及的金字塔都___世界。", "answer": "闻名"}, {"text": "今年我们想打开华北地区的市场，您能给我___一个代理商吗？", "answer": "推荐"}, {"text": "请___我先来介绍一下，这位是广告部的马经理，那位是销售部的王经理。", "answer": "允许"}, {"text": "今年我们的新产品很___，销售量比去年同期增长了 15%。", "answer": "畅销"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["生意咱们请允许我举杯祝贺的兴隆", "拉肚子带我了防止药的", "电影票差点儿没买到我"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["A：你再尝尝北京的烤鸭。", "B：这道菜我知道。它可是___的名菜。今天的饭菜___。非常感谢___。", "A：您太客气了，只是家常便饭。请允许我举杯祝贺咱们的合作___。", "B：也祝贺咱们的生意___。"]}, {"type": "open", "title": "五、看谁说得好", "intro": "", "bank": [], "items": ["小王的部门这个月业绩非常好，总经理安排他参加公司总部的晚宴。", "图 1 晚宴现场图片。任务：请描述一下晚宴的现场，突出现场热烈的气氛。", "图 2 集团总裁敬酒。任务：说明敬酒的原因，比如公司取得的成绩以及对未来美好的祝愿。", "图 3 酒菜摆满桌子。任务：介绍一下中国人的饮食习惯（包括酒水以及主食）。"]}], "kewen": {"title": "中国人的商务宴请", "paragraphs": ["前不久，《舌尖上的中国》让中国的美食闻名世界，中国有句俗话叫“民以食为天”，可以看出，吃在中国是一件多么重要的事。在中国，饮食从不仅仅是为了满足人的基本需要，更重要的是一项非常普遍的社会活动，同时还可以延续传统习俗。在商务人士的眼中，宴请的重要性更是不言而喻。无论是为了推进双方的合作（比如在商务洽谈的过程中，双方的观点出现了分歧的时候），还是表达一种尊重（比如为你初到中国准备的欢迎晚宴），中国人总是喜欢选择宴请这种方式在餐桌上来解决问题。中国人认为，与正式的商务洽谈相比，宴请这种方式，更容易帮助自己和客户交流经验、联络感情，而且双方沟通起来也更为轻松，更容易求得对方的支持，从而增加彼此间商务合作的机会。商务宴请可以说已经成为当前商务活动的重要形式之一。", "如果你收到中国人邀请你参加商务宴请的请柬，请一定不要错过这个联络感情、促进商务合作成功的机会。有时候，在一次商务宴请上表现得是否得体，甚至会影响到职业生涯的成败。那么参加商务宴会的时候应该注意哪些问题呢？", "首先，双方参加宴会的人数要相当，地位也要差不多。如果对方公司的总经理参加宴会，那么你们公司的总经理自然也应该参加宴会。反之，如果你们公司的总经理没去参加宴会，而只去了一位部门经理，对方公司就会认为你们不尊重他们，商务谈判的结果就可想而知了。", "其次，宴请的时候，排座位也很有讲究。一般来说，贵宾和主人被安排在面对着门或入口的上座。如果双方的人数相当，最好互相间隔着坐，这样不仅有利于私下交流，还可以创造一种轻松的气氛，不至于像商务洽谈时那么紧张。", "此外，中国人待客向来以热情著称。中国人的宴会一向非常丰盛。据说著名的满汉全席有一百多道菜。即使是普通的宴会，也有十多道菜。中国有句俗话叫“无酒不成宴”，在宴会上当然少不了酒，酒是餐桌上用于交流的重要工具，甚至有人认为喝酒的多少代表了双方感情的深浅。但是喝酒的时候一定要适度。如果你喝得太少，大家会认为你的诚意不足以感动大家，会影响进一步的交流。但如果你喝得太多，自己又会很难受。如果中国人和你干杯，你要是不想马上就醉的话，最好不要一口气把酒喝完，要不然主人会一直喝，直到你喝不动为止。有些热情的主人，担心客人不好意思，还会使劲给客人夹菜。如果你不习惯这种做法，你可以对主人说“谢谢，让我自己来”。"]}, "kewen_shengci": [{"word": "俗话", "pos": "名词", "def": "通俗的说法，一般都是有传统的意义，有一定的道理", "pinyin": "sú huà"}, {"word": "满足", "pos": "形容词", "def": "对某一事物感到足够", "pinyin": "mǎn zú"}, {"word": "延续", "pos": "动词", "def": "照原来的样子继续下去", "pinyin": "yán xù"}, {"word": "不言而喻", "pos": "", "def": "不用说就可以明白，形容道理很明显", "pinyin": "bù yán ér yù"}, {"word": "洽谈", "pos": "动词", "def": "接洽商谈，一般是指在商业活动中对商品交易、买卖的交谈行为", "pinyin": "qià tán"}, {"word": "分歧", "pos": "名词", "def": "意见不一致，有差别", "pinyin": "fēn qí"}, {"word": "尊重", "pos": "动词", "def": "敬重、重视", "pinyin": "zūn zhòng"}, {"word": "联络", "pos": "动词", "def": "互相之间联系", "pinyin": "lián luò"}, {"word": "请柬", "pos": "名词", "def": "以书面形式表示的请人参加的卡片", "pinyin": "qǐng jiǎn"}, {"word": "甚至", "pos": "连词", "def": "表示所提出的是进一步的事例", "pinyin": "shèn zhì"}, {"word": "可想而知", "pos": "", "def": "可以根据推想而知道结果", "pinyin": "kě xiǎng ér zhī"}, {"word": "讲究", "pos": "动词", "def": "重视，讲求", "pinyin": "jiǎng jiū"}, {"word": "间隔", "pos": "名词", "def": "隔开，彼此之间有一定的距离", "pinyin": "jiàn gé"}, {"word": "气氛", "pos": "名词", "def": "特定环境中给人强烈感觉的景象", "pinyin": "qì fēn"}, {"word": "著称", "pos": "动词", "def": "著名、出名", "pinyin": "zhù chēng"}], "kewen_yuyandian": [{"num": "1", "sentence": "在中国，饮食从不仅仅是为了满足人的基本需要，", "explanation": ["“从不”，从来不做，不愿意做或者不想做。例如："], "examples": ["我从不吸烟。（从过去到现在都不干，不愿意干，不想干）", "我从不干这种事。"], "extra": "即学即用：请用“从不”完成下面的句子\n(1) A：您喝酒吗？\nB: 对不起，我。\n(2) A：您想吃中国的火锅吗？\nB: 火锅太辣了，我。"}, {"num": "2", "sentence": "同时还可以延续传统习俗。", "explanation": ["“延续”，动词，（传统、习俗、模式等）从过去一直沿用到现在。"], "examples": ["中国人过春节包饺子、贴春联的传统一直延续至今。", "这种哭嫁的习俗延续了近千年。"], "extra": "注意：延续—继续\n两者的区别在于：“延续”表示某种事物从过去一直到现在，中间没有中断，而“继续”则表示某个动作的连续，而且也可以中间有中断。例如：\n他走出去冲了一杯咖啡之后，回来继续读书。\n即学即用：请用“延续”“继续”填空\n(1) 在中国的很多地方，过去的风俗习惯都保留了下来，一直___至今。\n(2) 虽然天气非常炎热，但是为了按时完成任务，他___工作。"}, {"num": "3", "sentence": "无论是为了推进双方的合作，还是表达一种尊重，中国人总是喜欢选择宴请这种方式在餐桌上来解决问题。", "explanation": ["“无论是……还是……”，不论，不管。表示在任何条件下结果都一样。例如："], "examples": ["无论是老板还是员工都要遵守公司的规定。", "无论是大人还是小孩都喜欢吃麦当劳。"], "extra": "即学即用：请用“无论是……还是……”完成下面的句子\n(1) A: 小王今年的业绩真好，快升职了吧？\nB: 是啊，他是个工作狂。，他都在工作。\n(2) A: 你应聘我们的公司有什么优势吗？\nB：，我都能和熟练运用。"}, {"num": "4", "sentence": "从而增加彼此间商务合作的机会。", "explanation": ["“从而”，连词，连接原因和结果，表示结果或者进一步的行动。用于同一主语的复句中后一小句的开头。前一小句常常表示条件、方法、原因等。", "“进而”，副词，继续向前；在已有基础上更进一步。“进而”表示递进关系，“从而”表示因果关系。"], "examples": ["大部分考研学生更重视毕业后的就业机会，从而选择名校或优势专业。", "政府用了三年的时间治理这条河，从而改善了这个地区的环境。", "由于国家和家长对外语的重视，学生们会重视英语从而轻视语文这项科目吗？", "认真学习词法，进而学习句法，才能全面学好语法。"], "extra": "即学即用：用“从而”“进而”填空\n(1) 对学习过的知识进行归纳总结，___加深对知识的理解，是一种重要的学习方法。\n(2) 我们深信，爱读书，会读书，___养成读书的好习惯，能使人受用一辈子。\n(3) 当经济衰退（shuai tui）时，更多的人处于失业状态，个人收入下降，个人消费需求也下降。\n(4) 我们应该减少不必要的浪费，___达到降低成本的目的。"}, {"num": "5", "sentence": "有时候，在一次商务宴请上表现得是否得体，甚至会影响到职业生涯的成败。", "explanation": ["“甚至”，用于强调突出的事例。例如：", "另外，“甚至”也可以放在并列的名词、形容词、动词、介词短语、小句的最后一项之前，突出这一项。例如："], "examples": ["他比以前胖多了，甚至有的人都认不出他来了。", "现在网络非常普及了，在城市，在农村，甚至在偏僻的地区，人们都可以上网。"], "extra": "即学即用：请用“甚至”完成下面的句子\n(1) A: 昨天的报告你听懂了吗？\nB: 别提了，昨天的报告太难了，。\n(2) A: 你也换智能手机了？\nB: 是啊，智能手机多方便啊，它不仅改变了我们的生活方式，。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["收到", "请柬"], ["满足", "需求"], ["商务", "洽谈"], ["延续", "传统"], ["交流", "经验"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["讲究", "尊重", "满足", "洽谈", "交流", "请柬", "延续", "著称"], "items": [{"text": "他对穿衣服很___，不同的天气要穿不同颜色的衣服。", "answer": "讲究"}, {"text": "虽然我以记忆力好而___，但这件事已经过去好久了，我实在想不起来了。", "answer": "著称"}, {"text": "李总专门到新锐公司拜访了高副总，主要是因为想和他___合作的事情。", "answer": "洽谈"}, {"text": "咱们定在下周末举办开业典礼，你要提前把___发给咱们的同行和朋友。", "answer": "请柬"}, {"text": "东西方文化差异较大，我们应该___对方的风俗习惯。", "answer": "尊重"}, {"text": "中国人过春节，贴春联、包饺子的传统已经___了很多年了。", "answer": "延续"}, {"text": "现在经济形势不好，能够维持现状我就很___了。", "answer": "满足"}, {"text": "通过及时和对方公司___意见，我们双方最终解决了分歧。", "answer": "交流"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["交流从不喜欢陌生人和他", "都失败有无论是还是信心成功要", "主人足以饭菜的说明好客丰盛的"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["A：今天我可以了解中国的美食了，老板安排我和他参加中天公司的晚宴。", "B：你得准备准备啊？晚宴可不只是吃饭那么简单？", "A：那你有什么建议呢？", "B：晚宴可以便于双方___。而且，晚宴的座位也很有讲究。主人和贵宾要坐在___。", "A：那我得准备一下。另外，我听说中国人很喜欢喝酒，是这样的吗？", "B：中国人和你干杯的时候，你尽量不要___，要不然___。", "A：这么多讲究啊！", "B：最后教给你一句话，如果中国人给你夹菜，你不太习惯的话，你可以说___。"]}, {"type": "open", "title": "五、看谁说得好", "intro": "", "bank": [], "items": ["小王今晚邀请客户参加公司的商务晚宴。", "图 1、图 2 餐厅包间的座位安排。任务：根据上图说一下宴请座位的安排以及这样做的好处。", "图 3 给重要的客户敬酒。任务：给客户敬酒，说出适当敬酒词，并说说劝酒应该注意什么。"]}, {"type": "open", "title": "六、看谁演得好", "intro": "", "bank": [], "items": ["人物 1：办公室秘书小王。任务：小王要接待中天公司人力资源部的部长，并为他安排了晚宴。要求：提前排好座位，并给领导敬酒。", "人物 2：中天公司的人力资源部张部长。任务：参加对方公司安排的商务晚宴。要求：接受对方的邀请，并在晚宴上合理应对，保持和谐、热闹的气氛。", "角色扮演：和你周围的同学分别扮演上面的两个人物，模拟真实场景展开对话。"]}, {"type": "open", "title": "七、看谁写得好", "intro": "", "bank": [], "items": ["小王的公司要邀请客户参加商务晚宴。请你代小王写一封商务请柬。请柬标题、称呼、正文、结尾和落款都要齐全。并在正文部分写清楚活动的内容、地点、时间和方式。", "请柬"]}]}, {"id": 5, "title": "会见客户", "daodu": ["约见客户时，在电话里要注意什么问题？", "见到客户后，通常会说些什么？", "销售人员要怎么做才能敲开客户的大门，并取得对方的信任？"], "hexinjv": ["毕竟张经理最熟悉我们公司的业务。", "现在和我们联系的广告公司确实也有不少。", "同样，一个销售人员，纵然有再强的能力，也必须走出自己的办公室，去拜访客户。", "坚持下去，以免以失败收场。"], "duihua": {"intro": "吴云要到新锐公司的合作公司——佳培广告公司拜访张畅经理。", "lines": [{"speaker": "场景", "text": "（小王电话预约见面时间）"}, {"speaker": "秘书", "text": "您好，这里是佳培广告公司经理室。"}, {"speaker": "小王", "text": "您好，我是新锐公司销售部的王中，我们吴经理想和张经理谈一下新产品的市场推广问题，请问他现在方便吗？"}, {"speaker": "秘书", "text": "抱歉，张经理去银行洽谈业务去了，方便给您转接销售部吗？"}, {"speaker": "小王", "text": "哦，谢谢，不过我们吴总经理还是想拜访张经理，毕竟张经理最熟悉我们公司的业务。麻烦你帮我预约一下时间，可以吗？"}, {"speaker": "秘书", "text": "（看了看日程表）下周二上午10点，您看怎么样？"}, {"speaker": "小王", "text": "不好意思，我们吴经理那天上午有安排，可以推迟到下午3点吗？"}, {"speaker": "秘书", "text": "那好吧。"}, {"speaker": "小王", "text": "好的，谢谢您！"}, {"speaker": "场景", "text": "（张经理办公室）"}, {"speaker": "张经理", "text": "吴经理，欢迎光临。"}, {"speaker": "吴经理", "text": "张经理，幸会，这是我的名片。"}, {"speaker": "张经理", "text": "幸会幸会，这是我的（递名片给吴经理）。我让秘书去拿资料了，马上就送来，你先喝杯茶。"}, {"speaker": "吴经理", "text": "张经理，我这次来的目的是想和贵公司洽谈一下新产品的广告宣传的问题。这是我们新研发的产品，打算在明年春天正式上市。目前需要提前投放广告。所以我想来看看贵公司是否有适合我们的设计方案。"}, {"speaker": "张经理", "text": "这是我们以前制作出来的广告设计。您看一下，对哪种风格比较满意。我们也还可以根据贵公司的产品再进一步修改。"}, {"speaker": "吴经理", "text": "（仔细看方案）我个人比较欣赏第三种方案，设计得很精致，广告词也不错。具体确定哪一种，我还需要回公司后和同事们商议一下。不瞒您说，现在和我们联系的广告公司确实也有不少。但你也知道，我们两家一直合作得不错，我们当然会优先考虑老搭档。"}, {"speaker": "张经理", "text": "谢谢吴经理对我们公司的认可。我们也会尽全力来设计这次的广告。"}, {"speaker": "吴经理", "text": "好的。"}]}, "lijie": [{"type": "judge", "title": "一、判断对错", "intro": "", "bank": [], "items": [{"text": "小王电话约见张经理的时候，他正好在公司。", "answer": false}, {"text": "吴经理拜访张经理的时间有点晚了。", "answer": true}, {"text": "吴经理公司的新产品现在就要投放市场了。", "answer": false}, {"text": "张经理已经设计好三个广告了。", "answer": false}, {"text": "吴经理决定采用张经理的设计。", "answer": false}]}, {"type": "open", "title": "二、回答问题", "intro": "", "bank": [], "items": ["小王帮吴经理第一次约见张经理的时候，他做什么去了？", "吴经理因为什么事去拜访张经理？", "新锐公司和佳培公司在哪些方面有合作？", "吴经理为什么愿意照顾张经理的公司？", "吴经理喜欢张经理他们公司设计的广告风格吗？为什么？"]}], "duihua_shengci": [{"word": "拜访", "pos": "动词", "def": "看望并谈话", "pinyin": "bài fǎng"}, {"word": "毕竟", "pos": "副词", "def": "用于强调原因", "pinyin": "bì jìng"}, {"word": "推迟", "pos": "动词", "def": "把预定的时间往后移", "pinyin": "tuī chí"}, {"word": "光临", "pos": "动词", "def": "敬词。称宾客的来到", "pinyin": "guāng lín"}, {"word": "幸会", "pos": "动词", "def": "能见到你很荣幸，出于对对方的尊敬", "pinyin": "xìng huì"}, {"word": "宣传", "pos": "动词", "def": "传播；宣扬", "pinyin": "xuān chuán"}, {"word": "投放", "pos": "动词", "def": "把......放入", "pinyin": "tóu fàng"}, {"word": "方案", "pos": "名词", "def": "设计的计划", "pinyin": "fāng àn"}, {"word": "制作", "pos": "动词", "def": "制造", "pinyin": "zhì zuò"}, {"word": "风格", "pos": "名词", "def": "不同于其他人的表现、打扮、做事方法等行为和观念", "pinyin": "fēng gé"}, {"word": "修改", "pos": "动词", "def": "改正文章、计划里的错误、缺点", "pinyin": "xiū gǎi"}, {"word": "欣赏", "pos": "动词", "def": "认为好和喜欢", "pinyin": "xīn shǎng"}, {"word": "精致", "pos": "形容词", "def": "精巧细致", "pinyin": "jīng zhì"}, {"word": "商议", "pos": "动词", "def": "商量", "pinyin": "shāng yì"}, {"word": "瞒", "pos": "动词", "def": "隐藏真实的情况，不让别人知道", "pinyin": "mán"}, {"word": "搭档", "pos": "名词", "def": "同另一个人组成一对相互配合", "pinyin": "dā dàng"}], "duihua_yuyandian": [{"num": "1", "sentence": "毕竟张经理最熟悉我们公司的业务。", "explanation": ["“毕竟”，副词，表示追根究底所得出的结论，即使出现了新情况，原来的状况也不容否认；强调事物的本质特点不会改变，事实不可否认。例如：", "“毕竟”常与“不管”“不论”在一起使用。"], "examples": ["虽然弟弟打坏了我最喜欢的花瓶，但是我还是原谅了他，毕竟他是我的弟弟。", "外国人刚开始学习汉语的时候，经常会出错，但这很正常，毕竟他们学习的时间还很短。", "情况毕竟还不怎么清楚，你别急于下结论。", "不管你有什么理由，迟到了毕竟是你的错。", "他毕竟是你的爸爸，虽然他和你相处的时间短，但是他仍然十分爱你。", "不管怎么说，你这么做毕竟不太好。"], "extra": "注意：毕竟—终究\n“毕竟”一般可以用“终究”代替。但“终究”还有最终的意思，表示预料、期望或肯定要发生的事情必然发生。“毕竟”没有这种用法。\n你们对工作这么不负责任，终究会出问题的。\n进步终究要战胜落后。\n即学即用：请用“毕竟”“终究”填空\n(1) 大家___会明白事情的真相。\n(2) 话虽这样说，___只是一种猜想。\n(3) ___是你的终究是你的，不是你的强求也无法得到。\n(4) 这件衣服很漂亮，但是___已经过时了。"}, {"num": "2", "sentence": "我让秘书去拿资料了，马上就送来，你先喝杯茶。", "explanation": [], "examples": [], "extra": "注意：资料—材料\n两者的共同点是都可以指用于制造精神产品的东西。\n两者的区别在于：“材料”还可以是制造物质产品的东西。“资料”多指物，“材料”除了指物之外，还可以指人。例如：\n这份材料我已经看过了，还给你吧。（或这份资料我已经看过了，还给你吧。）\n最近由于原材料供应不足，我们公司的成本明显提高了。\n他天生一副好嗓子，是唱歌的好材料。\n即学即用：请用“资料”“材料”填空\n(1) 我要到国家图书馆去查阅近几年来中国经济发展情况的___。\n(2) 在中国市场上，生活___供应充足，而且价格都比较便宜。\n(3) 他从小就跑得很快，是做运动员的___。"}, {"num": "3", "sentence": "我们也还可以根据贵公司的产品再进一步修改。", "explanation": ["“根据”，表示以某种事物或行动作为前提或基础。"], "examples": ["求职者最好根据公司的特点选择一套得体的服装。", "我会根据你的意见进行修改的。", "根据调研数据，我们公司的竞争力下降了。"], "extra": "即学即用：请用“根据”完成下面的句子\n(1) ___，我们可以判断天气的情况。\n(2) 作为经理，你不可以说这么___。\n(3) ___，我们设计了最新的手机样式。"}, {"num": "4", "sentence": "设计得很精致。", "explanation": [], "examples": [], "extra": "注意：精致——精美\n两者都有“精巧美丽”的意思，但是“精致”用来形容做工，“精美”用来形容外观。例如：\n这些工艺品做得都很精致。（做工好）\n这些工艺品做得都很精美。（很美观）\n即学即用：请用“精致”“精美”填空\n(1) 这件旗袍的用料不错，做工也很___。\n(2) 其实，看起来___的食品，营养未必丰富。\n(3) 这种酒的包装很___。"}, {"num": "5", "sentence": "现在和我们联系的广告公司确实也有不少。", "explanation": ["“确实”的意思是真实可靠，对客观情况的真实性表示肯定。例如："], "examples": ["我确实没有拿你的资料。"], "extra": "注意：确实—实在\n“实在”带有一定的主观性。此外，“确实”多用来指事，“实在”多用于指人。例如：\n互联网确实好，它改变了我们的生活。（表示肯定客观的情况）\n互联网实在好，它改变了我们的生活。（带有自己的主观态度）\n他这个人很实在。\n即学即用：请用“确实”“实在”填空\n(1) 抱歉，我___把这件事忘了。\n(2) 他这个人心眼儿很___。\n(3) 这个消息___吗？"}], "duihua_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["修改", "方案"], ["投放", "广告"], ["推迟", "时间"], ["设计", "作品"], ["欣赏", "设计"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["确实", "推迟", "投放", "方案", "制作", "风格", "修改", "欣赏", "商议", "瞒"], "items": [{"text": "展览会___有助于商家推广自己的产品。", "answer": "确实"}, {"text": "为了应对突发事件，尤其是自然灾害，政府制定了应急___。", "answer": "方案"}, {"text": "这部电影已经拍摄完成，目前正在进行后期___，估计春节可以上映。", "answer": "制作"}, {"text": "为了宣传自己的新产品，我们公司今年___了大量广告。", "answer": "投放"}, {"text": "这份报告中的一些数字是不够可靠的，需要进一步___。", "answer": "修改"}, {"text": "我很___欧洲的古典建筑艺术，每次去欧洲都要去参观这些古建筑。", "answer": "欣赏"}, {"text": "关于合同的条款，我还需要回公司和同事们___一下。", "answer": "商议"}, {"text": "出国留学的事，我一直___着我的父母，怕他们知道了不高兴。", "answer": "瞒"}, {"text": "这是一座具有18世纪建筑___的楼房。", "answer": "风格"}, {"text": "因为有大雾，飞机只好___起飞。", "answer": "推迟"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["是只毕竟富人做不能少数他们的生意", "根据要规定的公司办事", "没确实我北京过去"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["A: 不好意思，这次因为天气原因，我们公司的货物没有能按时到达。\nB：没关系，毕竟___。\nA：对了，听说你们公司研发了___。\nB：是的，我们的新产品最近卖得很好。\nA：你们公司真厉害！那么了解市场。\nB：这都是因为我们公司前期对市场进行了认真的调查，___准确。\nA：听说你们公司还在上海建了一个新工厂，我们可以___。\nB: 没问题。我会让___。"]}, {"type": "open", "title": "五、看谁说得好", "intro": "", "bank": [], "items": ["请根据下面的三幅图片，来谈谈小王今天的工作。", "图1 小王给张经理的秘书打电话约时间。任务：表达清楚自己打电话的目的。", "图2 小王见到了张经理，双方互换名片并进行自我介绍。任务：通过交换名片进行自我介绍。", "图3 小王向张经理介绍拜访他的目的。任务：表达清楚拜访张经理的目的，以及希望达成目的的信心。"]}], "kewen": {"title": "拜访客户——走向成功的第一步", "paragraphs": ["就一个销售人员而言，需要做的第一件事，就是走出办公室去拜访客户。一张地图无论多么精确，都无法带着他的主人在地面上移动半步。同样，一个销售人员，纵然有再强的能力，也必须走出自己的办公室，去拜访客户。尤其是当竞争转到服务领域时，商家们不仅要拼实力、拼产品，还要拼客户。谁能依靠更好的服务拥有消费者，谁就能在未来的市场竞争中获得优势。因而，拜访客户，是销售人员走向成功的第一步。", "但是在迈出第一步的时候，很多人会非常犹豫。因为他们会担心自己是否会被拒绝，即使进入对方的办公室后，他们也在担心客户是否会选择自己的产品。其实，成功与失败之间的差别也许只有一步。也许你多拜访一个客户，你就会取得成功。也许你事先作了详尽的计划，但是没有成功，仅仅是因为你没有继续拜访下一个客户。因而，拜访客户的时候，需要销售人员对自己有强大的自信，相信自己的能力，相信自己可以成功。", "其次，就是要坚持，当你无比疲惫，想不做了的时候，必须要自己跟自己说“再试一次”“坚持下去”，以免以失败收场。", "再次，就是要和客户做朋友，让客户对你产生信任感。销售人员可以分为两种类型：一种是把客户看作自己的工具，只会向客户要订单；第二种是把客户当作自己的朋友，为了更好地出售自己的产品，固然需要不断地拜访客户，去维系与客户之间的感情，但更为重要的是不断地帮助客户，当客户遇到困难或者难以解决的问题的时候，首先想到的就是向你求助。前一种类型的销售人员完成自己销售任务的道路将会很漫长；而后一种类型的销售人员在完成自己任务的同时，也得到了客户的尊敬。", "当然，上面所说的这一切，都要以销售人员的业务能力为基础，销售人员不仅要熟悉自己的产品，而且也需要随时了解自己产品在整个市场的情况，以便使得自己能够准确判断市场发展的趋势。这就需要销售人员要随时了解客户的需求，收集不同客户群体的信息，来分析和判断新的市场趋势。", "最后，不管你现在是否具有上面的能力，都要勇敢地走出去，去拜访你的客户，成功不是等待，现在就要行动，敲开那扇成功的大门。"]}, "kewen_shengci": [{"word": "精确", "pos": "形容词", "def": "非常正确", "pinyin": "jīng què"}, {"word": "领域", "pos": "名词", "def": "意识形态或社会活动的范围", "pinyin": "lǐng yù"}, {"word": "拼", "pos": "动词", "def": "用尽各种条件去比赛", "pinyin": "pīn"}, {"word": "依靠", "pos": "动词", "def": "借助，凭借（别的人或事来达到一定的目的）", "pinyin": "yī kào"}, {"word": "犹豫", "pos": "形容词", "def": "不果断，拿不定主意", "pinyin": "yóu yù"}, {"word": "详尽", "pos": "形容词", "def": "详细而全面", "pinyin": "xiáng jìn"}, {"word": "疲惫", "pos": "形容词", "def": "非常累", "pinyin": "pí bèi"}, {"word": "收场", "pos": "动词", "def": "结束", "pinyin": "shōu chǎng"}, {"word": "信任", "pos": "动词", "def": "互相信赖", "pinyin": "xìn rèn"}, {"word": "维系", "pos": "动词", "def": "维持和联系", "pinyin": "wéi xì"}, {"word": "漫长", "pos": "形容词", "def": "形容时间或道路很长，看不见尽头", "pinyin": "màn cháng"}, {"word": "尊敬", "pos": "动词", "def": "尊崇，敬重", "pinyin": "zūn jìng"}, {"word": "判断", "pos": "动词", "def": "分析并作出决定", "pinyin": "pàn duàn"}, {"word": "趋势", "pos": "名词", "def": "事物发展的方向", "pinyin": "qū shì"}, {"word": "收集", "pos": "动词", "def": "把零散的东西聚集在一起", "pinyin": "shōu jí"}], "kewen_yuyandian": [{"num": "1", "sentence": "就一个销售人员而言……", "explanation": ["“就……而言”，引出一个话题。"], "examples": ["就我而言，我非常喜欢中国的文化。", "就找工作而言，由于竞争激烈，现在的工作越来越难找了。"], "extra": "即学即用：请用“就……而言”完成下面的句子\n(1) A：你觉得咱们公司怎么样？\nB：___，我非常满意。\n(2) A：你觉得公司目前还存在着什么问题？\nB：___，还不是很好，消费者总是会抱怨有问题的产品不能及时维修。"}, {"num": "2", "sentence": "一张地图无论多么精确，都无法带着他的主人在地面上移动半步。", "explanation": [], "examples": [], "extra": "注意：精确——精密\n两者都有准确、精准的意思。区别在于：两者修饰的对象不同，“精确”一般用于修饰数据等，而“精密”用于修饰仪器、机器等。例如：\n计算机的运算十分精确。\n这台机器每个部件的设计和制造都非常精密。\n即学即用：请用“精确”“精密”填空\n(1) 航天技术方面的数据，要求极高的___度。\n(2) 这是从国外进口的___仪器。"}, {"num": "3", "sentence": "纵然有再强的能力，也必须走出自己的办公室。", "explanation": ["“纵然……也……”，表示假设的让步，后面常有副词“都”“总”“也”等跟它呼应。例如："], "examples": ["纵然这个问题再难，我们也要想办法解决。", "纵然现在的市场销量再好，也只是暂时的，还是需要不断创新。"], "extra": "即学即用：请用“纵然……也……”完成下面的句子\n(1) A：这个问题重要吗？\nB：是的，纵然你现在没有办法解决，___。\n(2) A：王经理会接受咱们的邀请吗？\nB：您亲自和我们一起去邀请，___，也不好意思当面拒绝。"}, {"num": "4", "sentence": "以免以失败收场。", "explanation": ["“以免”，连词。用在复句中的后一个分句的开头，表示前面说的内容是为了避免发生下面所说的情况。"], "examples": ["有事可以打电话来，以免你来回跑。", "把水龙头的水关小一点，以免浪费。", "睡觉前准备好明天要带的东西，以免早上起来忘了。", "下雨天不要跑步，以免摔跤。", "青少年运动不要过量，以免影响睡眠。"], "extra": "即学即用：请用“以免”完成下面的句子\n(1) A：这次新产品的销售模式你想好了吗？\nB：我觉得应该借鉴一下国外的销售模式，___。\n(2) A：最近好多人都生病了。\nB：是啊，最近流行性感冒很厉害，应该少到公共场所去，___。"}, {"num": "5", "sentence": "固然需要不断地拜访客户。", "explanation": ["“固然”表示确认某一事实，转入下文。前后小句意思矛盾。“固然”的用法与“虽然”接近，但是“固然”多用在主语后，后面的小句常用“但是、可是、却”配合。例如："], "examples": ["工作固然很忙，但还是可以抽出一些时间来的。", "药固然可以治病，但是服用过量会产生相反的作用。"], "extra": "即学即用：请用“固然”完成下面的句子\n(1) A：你通过了新锐公司的面试了吗？\nB：唉，别提了，招8个人，我正好排在第九位。\nA：通过面试___，没通过也别灰心。\n(2) A：你们的厂商好像交通不大方便，会考虑近一点的吗？\nB：那个厂商___，但是他们的产品质量很好。"}, {"num": "6", "sentence": "……，也得到了客户的尊敬。", "explanation": [], "examples": [], "extra": "注意：尊敬——尊重\n两者的区别在于：“尊敬”的对象只能是人，一般是下对上，幼对长；“尊重”的对象可以是人，也可以是事物。“尊敬”比“尊重”的程度要深，带有敬重的意思。例如：\n尊重知识，尊重人才是一个社会文明进步的表现。\n尊敬老师，团结同学，是一个学生最基本的行为规范。\n即学即用：请用“尊重”“尊敬”填空\n(1) ___历史，不忘历史的教训，这是发展我们两国关系的基础。\n(2) ___的来宾，女士们，先生们，我们一起举杯。\n(3) 夫妻之间应该相互___。\n(4) 他是我最___的老师，他对我的教导改变了我的一生。"}], "kewen_lianxi": [{"type": "match", "title": "一、词语连线", "intro": "", "bank": [], "items": [["服务", "领域"], ["判断", "趋势"], ["依靠", "努力"], ["拼", "实力"], ["收集", "信息"], ["计划", "详尽"], ["维系", "感情"]]}, {"type": "fill", "title": "二、选词填空", "intro": "", "bank": ["犹豫", "领域", "疲惫", "收场", "依靠", "维系", "尊敬", "详尽", "收集", "漫长"], "items": [{"text": "今天加了一天的班，回到家以后，他感到非常___。", "answer": "疲惫"}, {"text": "为了完成这次收购，他们公司制订了___的计划。", "answer": "详尽"}, {"text": "随着经济的发展，服务___的竞争越来越激烈。", "answer": "领域"}, {"text": "要取得成功，只能___自己的努力。", "answer": "依靠"}, {"text": "这件事不要再___了，就这样决定了吧。", "answer": "犹豫"}, {"text": "好多售后服务有助于___商家和消费者之间的感情。", "answer": "维系"}, {"text": "___长辈是中华民族的传统美德。", "answer": "尊敬"}, {"text": "永远瞒着客户是不可能的，这件事看他怎么___。", "answer": "收场"}, {"text": "在国外留学的时候，他___了很多资料。", "answer": "收集"}, {"text": "人生的道路很___，但关键的地方只有几步，特别是当人年轻的时候。", "answer": "漫长"}]}, {"type": "open", "title": "三、连词成句", "intro": "", "bank": [], "items": ["忙按时也要纵然工作再休息", "中国菜就……而言很我喜欢味道", "会别人麻烦自己以免我做的", "但是固然好未必市场不企业都不好"]}, {"type": "open", "title": "四、完成对话", "intro": "", "bank": [], "items": ["A: 现在的竞争真激烈，已经从价格领域转移到___。\nB：是啊，谁能依靠好的服务拥有用户，谁___。\nA: 既然客户这么重要，你经常去___。\nB：是的，拜访客户也很辛苦，不仅事先___，而且纵然再___，也要坚持下去。\nA：那么辛苦啊，你也可以向有经验的老员工学习学习。\nB：是的，我也打算向他们请教，___。\nA: 时候不早了，咱们下次再聊。"]}, {"type": "open", "title": "五、看谁说得好", "intro": "", "bank": [], "items": ["小王今天要去向张经理推销自己的新手机。", "图1 小王在办公室准备手机促销的宣传资料。任务：表达清楚促销活动可以吸引消费者的地方。", "图2 小王进办公室时，发现张经理正在忙。任务：怎么打招呼，可以引起张经理注意，并得到他的好感。", "图3 小王成功地向张经理介绍自己的产品。任务：介绍清楚自己产品的优势。"]}, {"type": "open", "title": "六、看谁演得好", "intro": "", "bank": [], "items": ["人物1：销售员小张。任务：小张要
