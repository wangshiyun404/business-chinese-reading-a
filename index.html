  var D = [{"id":1,"t":"求职面试","ex":[{"s":"lijie","t":"二、回答问题","ref":["他在网上看到了新锐公司的招聘启事，觉得公司提供的工作岗位与自己的专业很对口，因此很感兴趣。","新锐公司的高副总经理和人力资源部的张经理。","他了解经济贸易方面的基本理论和方法，对国际经贸行业的现状比较熟悉；之前在类似公司有过比较多的实习经历，有一定的工作经验；英语沟通没有问题，还学过一点儿德语；最主要的是，他很喜欢从事这方面的工作。","他刚参加工作，工资不是最重要的，重要的是工作岗位适合自己，能在工作中发挥能力、得到提高，为公司的发展做出贡献。","E．恋爱经历。（选择工作的动机、工作经验、教育背景、工资、外语水平在面试中都谈到了。）"]},{"s":"duihua_lianxi","t":"一、写出下列词语的反义词","ref":["陌生","劣势","消耗（耗费）","降低"],"note":"答案不唯一，意思相反即可"},{"s":"duihua_lianxi","t":"二、在横线上填写可以搭配的词语","ref":["做出贡献　巨大的贡献","熟悉环境　熟悉业务","积累经验　积累知识","发挥优势　发挥能力","招聘员工　招聘启事","专业对口　工作对口","实践经验　社会实践","锻炼自己　锻炼能力"],"note":"答案不唯一，搭配合理即可"},{"s":"duihua_lianxi","t":"五、看谁答得好","ref":[null,"您好！我叫××，今年××岁，毕业于××大学，专业是××。我性格开朗，学习能力强，在××公司实习过，有一定的工作经验。我很喜欢这份工作，希望能在贵公司发挥自己的优势。","提问：你选择这份工作的动机是什么？\n回答：我在网上看到了贵公司的招聘启事，觉得这个岗位与我的专业很对口，希望能在这儿发挥自己的优势。","提问：你觉得你从事这份工作有什么优势？\n回答：我熟悉本专业的基本理论，有过比较多的实习经历，外语沟通也没有问题；最重要的是，我很喜欢这方面的工作。","提问：你对工资有什么要求？\n回答：我刚参加工作，工资不是最重要的，重要的是岗位适合自己，能在工作中得到锻炼和提高。"],"note":"示例，答案不唯一；还可练习“工作经验”“为什么跳槽”“处理突发问题”等问题"},{"s":"duihua_lianxi","t":"六、看谁演得好","ref":["【示例对话】\n经理：你好！欢迎你来应聘。请你先做一个简单的自我介绍。\n求职者：您好！很高兴能有这次面试机会。我叫××，毕业于××大学，专业是国际经济与贸易。这是我的求职简历。\n助理：你为什么选择应聘我们公司？\n求职者：我在网上看到了贵公司的招聘启事，觉得这个岗位与我的专业很对口，希望能在这儿发挥自己的优势。\n经理：你有过这方面的工作经验吗？\n求职者：我在一家贸易公司实习过三个月，积累了一定的实践经验。\n助理：你的外语水平怎么样？\n求职者：我用英语和客户沟通没有问题。\n经理：你对工资有什么要求？\n求职者：工资不是最重要的，重要的是工作岗位适合自己，能得到锻炼和提高。\n经理：好的，你还有什么问题想了解的吗？\n求职者：没有了，谢谢您！\n【评价要点】三人都完成角色任务；用上“应聘、动机、优势、对口、实习、经验、跳槽、发挥”等本课词语。"],"note":"示例，答案不唯一"},{"s":"duihua_lianxi","t":"四、仿照例句完成句子","ref":["他是来应聘销售员的。\n这份简历是昨天晚上写好的。","钱不是最重要的，重要的是能学到东西。\n成绩不是最重要的，重要的是学习的过程。","这家公司成立于2008年。\n这位经理毕业于北京大学。","最重要的不是速度，而是质量。\n最让我难忘的不是风景，而是那里的人。"],"note":"答案不唯一，句式正确即可"},{"s":"kewen_lianxi","t":"三、连词成句","ref":["美丽的西湖如同人间的仙境。","我们应该清楚自己未来的职业发展。","参加宴会时我们要选择得体的服装。","认真学习是取得好成绩的基础。","他是适合这个岗位的最佳人选。"]},{"s":"kewen_lianxi","t":"五、用所给词语改写句子","ref":["你这样做毫无意义。\n关于这件事我们调查了半个月，毫无收获。","我想他一定能取得成功的，短则两三年，长则六七年。\n这件事的后果很严重，轻则会使销售额降低，重则会使公司倒闭。"]},{"s":"kewen_lianxi","t":"六、任务练习","ref":["【示例】大家好！我来介绍一下王中。他是男生，1993年4月2日出生，籍贯是中国北京。2010年9月到2014年7月，他在对外经济贸易大学学习经济学专业，本科毕业。上大学期间，他先后在三星公司中国有限公司销售部、西门子公司中国有限公司人力资源部和京东商城有限公司售后服务部做过实习生，有一定的工作经验。他还获得过2013年度一等奖学金。他性格开朗，容易与人相处，专业扎实。他的求职意向是销售专员。",null,"【示例：求职简历（要点）】\n姓名：××　性别：×　出生日期：××\n联系电话／E-mail：××\n求职意向：汽车4S店销售员\n教育经历：××大学，市场营销专业，本科\n外语水平：英语熟练（听、说、写都没有问题）\n工作经历：曾在××汽车销售公司实习，负责接待客户、介绍车型，有一定的销售经验\n自我评价：做事认真，善于学习，对新事物有热情，善于与人沟通\n【写作提示】简历要“有针对性”：逐条对应招聘启事的学历、外语、销售经验和性格要求。",null,null],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"四、用所给词语完成句子","ref":["你有什么困难就告诉我们，我们会尽量帮你解决。","你现在感冒很严重，最好去医院看看，在家好好休息。","我们积极了解用户需求，认真为用户考虑，而用户也越来越信任我们的产品。","针对老年人的健康需求，这家企业推出了不少保健产品。","大家都说我汉语说得好，其实我只会说一些简单的日常用语。"],"note":"答案不唯一，用对所给词语即可"}],"yyd":[{"s":"duihua_yuyandian","n":"3","ref":"(1) 实践；实习\n(2) 实践；实习"},{"s":"duihua_yuyandian","n":"4","ref":"(1) 经验；经历\n(2) 经历；经验"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 针对\n(2) 针对"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 其实他的汉语说得很流利，对北京也很熟悉。\n(2) 其实他并不太喜欢吃中餐，只是不好意思说。（答案不唯一）"},{"s":"kewen_yuyandian","n":"6","ref":"(1) 毫无\n(2) 毫不\n(3) 毫无\n(4) 毫无"}]},{"id":2,"t":"初到公司","ex":[],"yyd":[{"s":"duihua_yuyandian","n":"2","ref":"(1) 周全\n(2) 周到\n(3) 周密"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 大学毕业意味着要开始独立生活了。\n(2) 两国领导人的会面意味着两国关系进入了一个新阶段。\n(3) 新的交通法规马上就要实施了，这意味着司机们要更加严格地遵守交通规则。（答案不唯一）"},{"s":"kewen_yuyandian","n":"2","ref":"(1) 对刚参加工作的他来说，这次失败可是个不小的打击。\n(2) 在年轻人看来，与众不同是一种时尚。（答案不唯一）"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 以至\n(2) 以致\n(3) 以至\n(4) 以至"},{"s":"kewen_yuyandian","n":"5","ref":"(1) 我们不妨试一试。\n(2) 你不妨现在就告诉他。（答案不唯一）"}]},{"id":3,"t":"入职培训","ex":[{"s":"duihua_lianxi","t":"一、在横线上填写可以搭配的词语","ref":["开发新产品　开发市场","加入公司　加入团队","研发新产品　研发新技术","制定规章制度　制定计划","投入工作　投入资金","培训新员工　培训内容","举行培训　举行会议","设计产品　设计方案"],"note":"答案不唯一，搭配合理即可"},{"s":"duihua_lianxi","t":"三、用“除了……以外……”改写句子","ref":["对外经贸大学除了有外国留学生以外，还有很多中国学生。","他会很多种外语，除了英语以外，还会说法语和日语。","参加这次学术讨论会的，除了中国专家以外，还有一些外国专家。","医生除了给他检查了眼睛以外，耳朵、鼻子、牙齿都没有检查。","除了今天下午以外，其他时间（比如明天下午和晚上）我都可以跟你一起去。（原句“下午和晚上”前疑缺时间词，按“排除”义改写）"]},{"s":"duihua_lianxi","t":"五、看谁演得好","ref":[null,null,null,null,"【示例对话】\n部门经理：大家停一下手里的工作。这位是我们销售部新来的同事××，大家欢迎！\n新员工：大家好！我叫××，今天第一天上班，很高兴加入这个大家庭。我刚入职场，很多地方还不熟悉，请大家多多指教。\n部门经理：我们公司是一家生产型企业，成立二十多年了。公司除了销售部以外，还有生产部、研发部、人力资源部和行政部。销售部是和客户打交道最多的部门，以后你会慢慢了解各个部门的业务。\n老员工：欢迎你！我在销售部工作三年了，以后有什么不明白的，尽管来问我。\n新员工：太好了，谢谢！我会尽快投入工作，也希望能为公司带来一些新的活力。\n【评价要点】新员工表达想法与态度；经理介绍公司概况与部门；用上“加入、投入、除了……以外、好在、足以”等。"],"note":"示例，答案不唯一"},{"s":"duihua_lianxi","t":"四、模仿例句，用括号中的词语造句","ref":["路上堵车很厉害，好在我们出发得早，没有迟到。","他这几年的销售业绩足以证明他的能力。","正如老师所说的，多练习才能提高口语水平。"],"note":"答案不唯一"},{"s":"kewen_lianxi","t":"五、用所给词语完成句子","ref":["昨天你在三楼看见的不是我，而是我的双胞胎弟弟。","不管是新员工还是老员工，都要遵守公司的规章制度。","他不管怎么忙，都坚持每天学习一个小时汉语。","入职培训时的讲授要引用恰当的例子，这样有利于新员工准确理解培训内容。","新员工都需要培训，这样便于他们尽快适应新的工作岗位。"],"note":"答案不唯一"},{"s":"kewen_lianxi","t":"六、看谁说得好","ref":["主持人（示例）：各位新同事，大家好！欢迎参加新锐公司的入职培训。今天的培训分三部分：公司介绍、组织结构和薪资待遇。下面请三位同事分别为大家介绍。","图1·公司介绍（示例）：我们公司是一家生产型企业，1993年2月成立，至今已有20多年。经营范围从一种产品发展到近百种，营业收入连续三年超过1亿元，在国内有了一定的知名度。目前有190多名员工，业务发展很快，希望新员工为公司带来新的活力。","图2·组织结构（示例）：公司在总经理下面设五个部门：研发部负责产品的设计与开发；生产部负责生产；销售部负责市场销售，是和客户打交道最多的部门；人力资源部负责员工的招聘和培训；行政部负责日常活动和规章制定。","图3·薪资待遇（示例）：公司的薪资待遇在同类公司中不错。除了每月的薪水以外，还有丰厚的奖金；休假方面，除了公休假期以外，每年还有半个月的带薪假期。（“其他福利”课文未具体说明，可自由补充。）"],"note":"示例，内容据本课会话","items":{"1":"图 1　培训内容介绍","2":"图 2　组织结构","3":"图 3　薪资待遇"},"figs":{"1":[{"src":"L03-zh6-fig1.jpg","cap":"图1","desc":"培训内容介绍：Part1 公司介绍、Part2 HR、Part3 财务部","page":58}],"2":[{"src":"L03-zh6-fig2.jpg","cap":"图2","desc":"组织结构：总经理—研发部、生产部、销售部、人力资源部、行政部","page":58}],"3":[{"src":"L03-zh6-fig3.jpg","cap":"图3","desc":"薪资待遇：薪水、奖金、休假、其他福利","page":58}]}},{"s":"kewen_lianxi","t":"四、连词成句","ref":["入职培训的目的是为了使员工尽快融入团队。","企业文化应该能对员工行为产生影响。","入职培训可以使员工规划自己的职业生涯。"]}],"yyd":[{"s":"duihua_yuyandian","n":"2","ref":"(1) 消费者的数量足以说明新的营销模式效果很好。\n(2) 凭借我的实力，我足以打败他。（答案不唯一）"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 你最好带身份证过来，以便我统计信息。\n(2) 请把安全出口的杂物拿走，以便以后发生火灾时可以逃生。"},{"s":"kewen_yuyandian","n":"2","ref":"……感：使命感 亲切感 责任感 安全感 失落感（已给出）\n……型：新型 开放型 实用型 外向型\n……度：满意度 透明度 可信度 难度\n……式：讲座式 开放式 中式 西式（答案不唯一）"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 你所说的话，我都记住了。\n(2) 老王把自己所掌握的技术都教给了徒弟。（答案不唯一）"}]},{"id":4,"t":"商务宴请","ex":[{"s":"lijie","t":"二、回答问题","ref":["因为李总是高副总宴请的贵客。按照中国的习惯，贵宾和主人一般被安排在面对着门或入口的上座。","不会（影响不大）。李总说，为了防止产生误会，他们早已向消费者解释清楚了；而且新产品卖得很好。","新产品很畅销。他们最近正在招各个地区的代理商，并对代理商有很多优惠。","一般先吃凉菜，随后才是主菜和汤；主食一般是米饭和面食，不吃甜点。"]},{"s":"duihua_lianxi","t":"三、连词成句","ref":["请允许我举杯祝贺咱们的生意兴隆。","我带了防止拉肚子的药。","我差点儿没买到电影票。"]},{"s":"duihua_lianxi","t":"五、看谁说得好","ref":[null,"（示例）晚宴在酒店的大宴会厅举行，现场灯光明亮，摆满了几十张圆桌，坐满了来自各地分公司的同事。台上正在举行颁奖仪式，大家一边吃饭一边热烈鼓掌，气氛非常热闹。","（示例）总裁举杯说：“各位同事，今年我们的营业收入比去年增长了很多，这离不开大家的努力！请允许我代表集团向大家表示感谢。来，为我们取得的好成绩干杯！祝明年的业绩更上一层楼，祝大家身体健康、工作顺利！”","（示例）中国人请客，饭菜一向非常丰盛，一般先上凉菜，随后是主菜和汤；主食一般是米饭和面食，不吃甜点。中国有句俗话叫“无酒不成宴”，宴会上少不了酒，但喝酒一定要适度。"],"note":"示例，答案不唯一","figs":{"1":[{"src":"L04-dh5-fig1.jpg","cap":"图1","desc":"晚宴现场","page":69}],"2":[{"src":"L04-dh5-fig2.jpg","cap":"图2","desc":"集团总裁敬酒","page":69}],"3":[{"src":"L04-dh5-fig3.jpg","cap":"图3","desc":"酒菜摆满桌子","page":70}]}},{"s":"duihua_lianxi","t":"四、完成对话","ref":[null,"闻名中国（闻名世界）；太丰盛了；您的热情款待","顺利（成功）","兴隆"],"note":"答案不唯一，参考本课会话"},{"s":"kewen_lianxi","t":"七、看谁写得好","ref":["【示例】\n请　柬\n尊敬的李一冰总经理：\n　　为感谢贵公司一直以来的支持与合作，我公司定于2026年12月20日（星期日）晚上6点30分，在北京饭店二层宴会厅举行商务晚宴，届时将介绍我公司新产品并共商明年合作事宜。敬请光临！\n　　（请着正装出席，如能出席，请于12月15日前回复。）\n此致\n敬礼！\n新锐公司\n2026年12月1日\n【写作提示】标题、称呼、正文（内容、时间、地点、方式）、结尾、落款（单位与日期）要齐全。",null],"note":"示例，日期、地点等均为虚拟"},{"s":"kewen_lianxi","t":"三、连词成句","ref":["他从不喜欢和陌生人交流。","无论是成功还是失败，都要有信心。","丰盛的饭菜足以说明主人的好客。"]},{"s":"kewen_lianxi","t":"五、看谁说得好","ref":[null,"（示例）主人1坐在面对着门的上座，主宾1、主宾2坐在主人1的两边，其余的主人和客人互相间隔着坐，主人6坐在主人1的对面（靠门一侧）。这样安排表示对客人的尊重；双方人数相当、间隔着坐，不仅有利于私下交流，还可以创造一种轻松的气氛，不至于像商务洽谈时那么紧张。","（示例）敬酒词：“李总，非常荣幸今天能和您共进晚餐。请允许我代表公司敬您一杯，感谢您一直以来的支持，祝咱们合作顺利、生意兴隆！我干了，您随意。”\n劝酒注意：喝酒要适度；不要强迫客人喝得太多；客人不想一口气喝完时要尊重对方的习惯。"],"note":"示例，答案不唯一","figs":{"1":[{"src":"L04-kw5-fig1.jpg","cap":"图1","desc":"餐厅包间座位安排示意","page":77},{"src":"L04-kw5-fig2.jpg","cap":"图2","desc":"餐厅包间","page":77}],"2":[{"src":"L04-kw5-fig3.jpg","cap":"图3","desc":"给重要的客户敬酒","page":77}]}},{"s":"kewen_lianxi","t":"六、看谁演得好","ref":[null,null,"【示例对话】\n小王：张部长，欢迎您！今天的晚宴是我安排的，您是我们的贵客，请上座。\n张部长：谢谢！贵公司太客气了。\n小王：非常荣幸能在这里招待您，请允许我代表公司热烈欢迎您。这是闻名中国的北京烤鸭，您尝尝。\n张部长：味道真不错！今天的菜太丰盛了。\n小王：您太客气了，只是家常便饭。来，我敬您一杯，祝我们两家公司合作顺利！\n张部长：谢谢！也祝咱们的生意兴隆！我酒量不大，就喝一半吧。\n小王：没关系，您随意。\n张部长：感谢你们的热情款待，为我们的合作干杯！\n【评价要点】小王提前排好座位（贵宾坐上座）、主动敬酒；张部长礼貌应对，喝酒适度，气氛和谐热闹。"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"四、完成对话","ref":[null,null,null,"交流经验、联络感情（沟通）；面对着门或入口的上座",null,"一口气把酒喝完；主人会一直喝，直到你喝不动为止",null,"谢谢，让我自己来"],"note":"据课文"}],"yyd":[{"s":"duihua_yuyandian","n":"1","ref":"(1) 请允许我代表公司向全体员工表示衷心的感谢！\n(2) 请允许我代表公司对各位来宾的光临表示热烈的欢迎！（答案不唯一）"},{"s":"duihua_yuyandian","n":"2","ref":"(1) 要注意交通安全，开车慢一点儿，防止发生交通事故。\n(2) 时间挺长的，记得买保险啊，防止发生意外。（答案不唯一）"},{"s":"duihua_yuyandian","n":"3","ref":"(1) 差点儿没买到（＝差点儿就买不到了，结果买到了）。\n(2) 差点儿迟到（＝差点儿没赶上，结果没迟到）。"},{"s":"duihua_yuyandian","n":"4","ref":"(1) 我给他打个电话吧，问问他究竟什么时候能到。\n(2) 是啊，最近每天都有经销商打电话来问我们究竟是怎么回事。（答案不唯一）"},{"s":"duihua_yuyandian","n":"5","ref":"(1) 代办\n(2) 代理\n(3) 代办\n(4) 代理"},{"s":"duihua_yuyandian","n":"7","ref":"(1) 丰富\n(2) 丰富\n(3) 丰富"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 对不起，我从不喝酒。\n(2) 火锅太辣了，我从不吃辣的东西。"},{"s":"kewen_yuyandian","n":"2","ref":"(1) 延续\n(2) 继续"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 无论是工作日还是周末，他都在工作。\n(2) 无论是英语还是汉语，我都能熟练运用。（答案不唯一）"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 从而\n(2) 进而\n(3) 进而（原书此句未印出空格，宜在“个人消费需求”前填）\n(4) 从而"},{"s":"kewen_yuyandian","n":"5","ref":"(1) 昨天的报告太难了，我甚至连题目都没听懂。\n(2) 它不仅改变了我们的生活方式，甚至改变了我们的工作方式。（答案不唯一）"}]},{"id":5,"t":"会见客户","ex":[{"s":"lijie","t":"二、回答问题","ref":["张经理去银行洽谈业务去了。","吴经理想和佳培广告公司洽谈新产品的广告宣传问题，看看对方是否有适合新产品的设计方案。","在广告宣传方面：佳培广告公司为新锐公司设计、制作广告，两家一直合作得不错。","因为两家公司一直合作得不错，佳培公司是“老搭档”，而且张经理最熟悉新锐公司的业务，所以吴经理会优先考虑。","喜欢。他比较欣赏第三种方案，认为设计得很精致，广告词也不错；但具体选哪一种，还要回公司和同事们商议。"]},{"s":"duihua_lianxi","t":"三、连词成句","ref":["他们毕竟不能只是做少数富人的生意。","要根据公司的规定办事。","我确实没去过北京。"]},{"s":"duihua_lianxi","t":"五、看谁说得好","ref":[null,"（示例）小王：您好，我是新锐公司销售部的王中。我们吴经理想和张经理谈一下新产品的市场推广问题，麻烦您帮我预约一下时间，可以吗？……下周二下午3点可以，谢谢您！","（示例）小王：张经理，幸会！这是我的名片。我叫王中，是新锐公司销售部的销售员，以后请多多指教。\n张经理：幸会幸会，这是我的名片。","（示例）小王：张经理，我这次来的目的是想和贵公司谈一下新产品的广告宣传问题。我们的新产品打算明年春天正式上市，需要提前投放广告。我们两家一直合作得不错，我相信这次合作一定也会很顺利。"],"note":"示例，答案不唯一","figs":{"1":[{"src":"L05-dh5-fig1.jpg","cap":"图1","desc":"小王给张经理的秘书打电话约时间","page":88}],"2":[{"src":"L05-dh5-fig2.jpg","cap":"图2","desc":"双方互换名片","page":89}],"3":[{"src":"L05-dh5-fig3.jpg","cap":"图3","desc":"小王向张经理介绍拜访目的","page":89}]}},{"s":"duihua_lianxi","t":"四、完成对话","ref":["毕竟天气原因是谁也没办法控制的\n新产品（一种新型手机）\n所以对市场需求的判断才这么\n去参观一下吗\n工厂的负责人带你们参观"],"note":"答案不唯一，按空格顺序"},{"s":"kewen_lianxi","t":"七、写作","ref":["【示例名片】\n新锐公司\n吴云　销售部经理\n电话：010-××××××××　手机：×××××××××××\nE-mail：××@××.com\n地址：北京市××区××路××号\n【介绍示例】这位是新锐公司销售部经理吴云。销售部主要负责产品的市场销售，是和客户打交道最多的部门。如果有业务需要，可以按名片上的电话或邮箱联系他。"],"note":"示例，电话、地址等为虚拟"},{"s":"kewen_lianxi","t":"三、连词成句","ref":["纵然工作再忙，也要按时休息。","就味道而言，我很喜欢中国菜。","我会自己做的，以免麻烦别人。","市场固然不好，但是企业未必都不好。"]},{"s":"kewen_lianxi","t":"五、看谁说得好","ref":[null,"（示例）这次“夏季优惠风暴”促销活动，多款新手机只要299元起，最贵的也只要456元，价格非常优惠，而且机型多、选择多，很能吸引消费者。","（示例）小王在门口轻轻敲门，等张经理抬头后微笑着说：“张经理，您好！打扰您一下，我是新锐公司的小王。您先忙，我在这儿等您一会儿。”有礼貌、不打断对方工作，容易得到好感。","（示例）张经理，这款手机是我们公司新研发的产品，设计得很精致，功能齐全，价格却比同类产品便宜；而且我们的售后服务很周到，一年内免费维修。"],"note":"示例，答案不唯一","figs":{"1":[{"src":"L05-kw5-fig1.jpg","cap":"图1","desc":"手机促销宣传资料","page":97}],"2":[{"src":"L05-kw5-fig2.jpg","cap":"图2","desc":"张经理正在忙","page":97}],"3":[{"src":"L05-kw5-fig3.jpg","cap":"图3","desc":"小王向张经理介绍产品","page":97}]}},{"s":"kewen_lianxi","t":"六、看谁演得好","ref":[null,null,"【示例对话】\n小张：李主任，您好！我是××公司的销售员小张，这是我的名片。今天来是想向您介绍我们公司的财务软件。\n李主任：最近来找我的公司可不少，你们的软件有什么特别的？\n小张：就功能而言，我们的软件计算精确、操作简单，能和贵公司现有的系统连接；价格固然不是最低的，但我们提供免费培训和一年的售后服务。\n李主任：听起来不错，不过我还要和同事们商议一下。\n小张：没问题。我可以先给您的同事做一个演示，以免大家有不清楚的地方。\n李主任：好吧，比较下来，你们的方案确实最适合我们，那就选你们的软件吧。\n【评价要点】小张自信、坚持，说清产品优势；李主任不轻易接受，最后做出选择。"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"四、完成对话","ref":["服务领域\n就能在未来的市场竞争中获得优势\n拜访客户吧\n要作详尽的计划\n疲惫（累）\n以便提高自己的业务能力（以免走弯路）"],"note":"答案不唯一，按空格顺序"}],"yyd":[{"s":"duihua_yuyandian","n":"1","ref":"(1) 终究\n(2) 毕竟\n(3) 终究（俗语“是你的终究是你的”；原书空格位置可能有误）\n(4) 毕竟"},{"s":"duihua_yuyandian","n":"2","ref":"(1) 资料\n(2) 资料（“生活资料”）\n(3) 材料（“是……的材料”，指适合做某事的人）"},{"s":"duihua_yuyandian","n":"3","ref":"(1) 根据天气预报\n(2) 没有根据的话\n(3) 根据年轻消费者的需求（答案不唯一）"},{"s":"duihua_yuyandian","n":"4","ref":"(1) 精致\n(2) 精美\n(3) 精美"},{"s":"duihua_yuyandian","n":"5","ref":"(1) 实在（也可用“确实”）\n(2) 实在\n(3) 确实"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 就工作环境而言，我非常满意。\n(2) 就售后服务而言，还不是很好。（答案不唯一）"},{"s":"kewen_yuyandian","n":"2","ref":"(1) 精确\n(2) 精密"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 纵然你现在没有办法解决，也要先把它记下来。\n(2) 您亲自和我们一起去邀请，他纵然不想来，也不好意思当面拒绝。"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 我觉得应该借鉴一下国外的销售模式，以免走弯路。\n(2) 应该少到公共场所去，以免被传染。"},{"s":"kewen_yuyandian","n":"5","ref":"(1) 通过面试固然好，没通过也别灰心。\n(2) 那个厂商交通固然不方便，但是他们的产品质量很好。"},{"s":"kewen_yuyandian","n":"6","ref":"(1) 尊重\n(2) 尊敬\n(3) 尊重\n(4) 尊敬"}]},{"id":6,"t":"日程安排","ex":[{"s":"duihua_lianxi","t":"三、连词成句","ref":["我得给王经理调整一下日程。","我根本不了解情况。","其实我们部门的工作效率也很高。"]},{"s":"duihua_lianxi","t":"五、看谁写得好","ref":[null,"【示例：总经理今日日程表】\n9:00—10:30　听客户介绍公司情况（会议室）\n10:30—10:45　休息\n10:45—12:00　与客户就合作事宜进行谈判\n12:00—14:00　午餐、午休\n14:30—16:00　参加新员工入职培训并讲话\n16:00—17:30　机动时间（处理文件，留有余地）\n18:00—20:30　出席客户商务宴请\n【安排要点】重要、紧急的事情先做；谈判放在上午精力最好的时候；活动之间留有余地，不要安排得太满。"],"note":"示例，答案不唯一"},{"s":"duihua_lianxi","t":"四、完成对话","ref":["安排一下日程（预订去上海的票）\n今天就把火车票预订好\n可以取消一些（就算了吧）\n一个也不能取消（宁可累一点儿，也要都参加）"],"note":"答案不唯一，按空格顺序"},{"s":"kewen_lianxi","t":"三、连词成句","ref":["这个问题让大家头痛不已。","产品的竞争力取决于质量。","这种产品为消费者所喜爱。","下起雪来了，天气反而暖和了。"]},{"s":"kewen_lianxi","t":"五、看谁演得好","ref":[null,null,null,"【示例对话】\n总经理：小李，我下周要去上海出差，你帮我安排一下日程。\n秘书：好的。您周一上午到上海，下午先参观外国公司；周二上午拜访两个大客户，下午参观我们在上海的新工厂；周三上午游览上海，下午休息，晚上参加公司举办的商务晚宴；周四上午返回北京。您看这么安排可以吗？\n总经理：拜访客户最重要，别安排得太紧。\n秘书：好的，我在每项活动之间都留有余地。另外，下周上海有雨，温度比北京高，您可以带一把伞，少带厚衣服。如果客户临时改时间，备用安排是把游览改到周二下午。\n总经理：安排得很周到，就这么办吧。\n【评价要点】日程合理、留有余地；介绍目的地气候、交通等；提供备用安排。"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"六、看谁写得好","ref":["【示例】\n通　知\n各部门：\n　　后天（星期三）上午我公司将与三立公司进行重要的商务谈判。请各部门于明天下午5点前将谈判所需文件准备好，交到总经理办公室。\n　　另外，因谈判工作需要，原定于本周四晚上的商务宴会取消，请大家相互转告。\n总经理办公室\n2026年×月×日\n【写作提示】写清标题、对象、事项、时间要求和落款。"],"note":"示例，日期等为虚拟"},{"s":"kewen_lianxi","t":"四、完成对话","ref":["如何管理时间却往往为人们所忽视\n日益激烈\n忙不过来（没有时间休息）\n工作效率\n区分重要的事情和不重要的事情"],"note":"答案不唯一，按空格顺序，参考课文"}],"yyd":[{"s":"duihua_yuyandian","n":"2","ref":"(1) 我根本没收到邀请邮件。\n(2) 他根本没去出差。（答案不唯一）"},{"s":"duihua_yuyandian","n":"3","ref":"(1) 什么好看不好看的\n(2) 什么报表不报表的"},{"s":"duihua_yuyandian","n":"4","ref":"(2) 连同这份合同，所有文件都要在周五前交给经理。\n(3) 请把年度报告交上来，连同今年的销售汇总表。（答案不唯一）"},{"s":"duihua_yuyandian","n":"5","ref":"(1) 去长城太累了，我宁可在宾馆休息，也不想去。\n(2) 我宁可不去唱卡拉OK，也要把手里的工作做完。"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 激烈\n(2) 强烈\n(3) 强烈\n(4) 激烈"},{"s":"kewen_yuyandian","n":"2","ref":"(1) 激动不已\n(2) 羡慕不已"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 这笔生意能否成功取决于对方能否在价格上让步。\n(2) 我下周四是否有时间取决于董事长的安排。"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 外面的雨不但没有小，反而越下越大了。\n(2) 他经过这场病，身体反而比以前更好了。"},{"s":"kewen_yuyandian","n":"5","ref":"(1) 改进\n(2) 改善\n(3) 改善\n(4) 改进"},{"s":"kewen_yuyandian","n":"6","ref":"(1) 我们的新产品为广大女性所喜爱，这几天都脱销了。\n(2) 这个问题早已为我们所重视，我们已经向消费者解释清楚了。"}]},{"id":7,"t":"邮件促销","ex":[{"s":"lijie","t":"二、回答问题","ref":["因为他太着急了，客户反而把他的邮件当作垃圾邮件了，所以根本不回复。","商务往来中的电子邮件代表了公司的形象，并且向客户展示了公司的水平和实力；营销邮件也是改变和客户之间距离的一种手段，可以培养未来的用户。","三个：①信息要准确，不能有语言错误（错别字）；②不要着急，先发几封问候性的邮件，慢慢改变和客户之间的距离；③信息要完整，要一次性地把所有必要的信息告诉客户。"]},{"s":"duihua_lianxi","t":"三、连词成句","ref":["难道有什么秘密吗？","坐地铁必须买票，否则会被罚款。","哪怕再穷，也要送孩子上学。"]},{"s":"duihua_lianxi","t":"五、看谁说得好","ref":[null,"电子邮件的作用：代表公司形象，展示公司的水平和实力；保持联系、培养潜在客户、推广产品。\n不恰当的地方（参考）：\n①称呼混用“你／您”，对客户应统一用“您”；\n②语气太着急，直接要求对方购买（“我也希望你能够购买……”），容易让人反感；\n③“如果不满意的话，你就随便看看……”说法随意，不礼貌，也不专业；\n④“我的客户几乎都很喜欢”缺乏具体信息，说服力不够；\n⑤联系方式不完整：“联系XXXX”没说明是谁、什么职务；\n⑥没有邮件主题，报价和介绍是否在附件中没有说明，落款缺少公司名称和日期。"],"note":"答案不唯一，言之有理即可"},{"s":"duihua_lianxi","t":"四、完成对话","ref":["不回复","是培养未来的用户，不见得马上就要获得回报\n不断地给客户发邮件，保持联系",null,null,null,"代表了公司的形象\n向客户展示了公司的水平和实力\n你的邮件会直接影响客户对我们公司的评估",null,"客户会觉得你不重视他\n客户会嫌你工作态度不认真"],"note":"据本课会话"},{"s":"kewen_lianxi","t":"三、连词成句","ref":["至于个人的问题，我以后再解决。","所谓“三通”是指通商、通邮、通航。","随着科技的发展，人们的生活水平日益提高。","凡是希望的事情总是很难实现，反之，不希望的事情会很容易地实现。"]},{"s":"kewen_lianxi","t":"五、看谁说得好","ref":["邮件1：是正规的商务促销邮件。写明了发件人的公司和身份、联系目的（空气净化器安装），报价表和公司介绍放在附件中，并留了联系方式，态度热情。不足：开头说明过长、语句有些啰嗦，公司名称前后不一致（“中天科技”“中天电子”）。","邮件2：会被认定为垃圾邮件（甚至是诈骗邮件）。它没有标题；隐藏发件人身份（不透露银行名称）；收件人事先没有要求或同意接收；内容大量谈论与收件人无关的政治、经济话题；最后索要姓名、年龄、婚姻状况和银行账号等个人信息。\n结论：邮件1比较好。"],"note":"答案不唯一，参考课文中垃圾邮件的定义"},{"s":"kewen_lianxi","t":"六、看谁写得好","ref":["【示例：问候性邮件】\n主题：圣诞节快乐！\n王秘书：\n　　您好！圣诞节就要到了，感谢您这一年来的辛苦工作。祝您和家人节日快乐，新年万事如意！\n张××\n12月24日","【示例：事务性邮件】\n（老板→秘书）主题：下周招商会准备工作\n王秘书：\n　　下周三上午9点在公司三楼会议室召开招商会。请你：①周一前把邀请函发给各位客户；②准备好产品介绍资料和报价表；③联系酒店预订午餐。有问题随时联系我。\n张××\n（秘书→老板）主题：回复：下周招商会准备工作\n张总：\n　　您好！邀请函已全部发出，目前已有15位客户确认参加；资料和报价表周二可以准备好；午餐已预订在××酒店。如有变化，我会及时向您汇报。\n王××"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"四、完成对话","ref":[null,"代表公司的形象\n培养自己潜在的客户（进行在线市场调查）\n有效地推广自己的产品\n促销邮件具有独特的魅力","缺乏耐心，很容易把它当作垃圾邮件","具有吸引力（要精确定位，确定好目标客户）",null],"note":"据课文"}],"yyd":[{"s":"duihua_yuyandian","n":"1","ref":"A：难道是什么秘密吗？（或：难道你连我也不相信吗？）\n（原书此处版式不完整，按“难道……吗”反问即可）"},{"s":"duihua_yuyandian","n":"2","ref":"(1) 赶紧回家吧，否则明天上班就没精神了。\n(2) 就不参加晚宴了，否则太累了。（答案不唯一）"},{"s":"duihua_yuyandian","n":"3","ref":"(1) 突发性\n(2) 长远性\n(3) 稳定性；灵活性\n(4) 科学性；可行性"},{"s":"duihua_yuyandian","n":"4","ref":"(1) 您放心，哪怕今天晚上加班，我们也一定按时完成任务。\n(2) 哪怕路上车再多，我也要去长城。"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 随着时间的推移，我越来越适应中国的生活。\n(2) 随着经济的快速发展，中国的环境污染日益严重。（答案不唯一）"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 反之，价格下降，就会导致供不应求的现象。\n(2) 反之，最不想见的人，不找也会碰到。\n(3) 反之，温度越低，体积越小。"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 期望\n(2) 期待"},{"s":"kewen_yuyandian","n":"5","ref":"(1) 至于他自己的身体，从没考虑过。\n(2) 至于你负责的项目，就让小王先跟一下吧。"},{"s":"kewen_yuyandian","n":"6","ref":"(1) 总而言之，我最近忙得不得了。\n(2) 总而言之，我暂时不需要。"}]},{"id":8,"t":"广告宣传","ex":[{"s":"lijie","t":"二、回答问题","ref":["做得很成功，得到了消费者很高的评价。长处：很好地把视觉和音乐结合起来，不仅传递了产品信息，而且大大提升了品牌的知名度，给消费者留下了深刻的印象。不足：过于注重技术和产品本身，不免忽略了消费者本身的需求。","如果是电视台的老客户，制作费可以优惠，但播出费很高，尤其是好时段。","在报纸上刊登广告要便宜得多。","互联网的成本要比前面几种媒体低得多。"]},{"s":"duihua_lianxi","t":"三、连词成句","ref":["售票员一个星期前就告诉我没票了，可见火车票很难买。","我至少需要一周的时间。","这附近住的人很少，况且你又不知道详细地址，还是问清楚再去吧。"]},{"s":"duihua_lianxi","t":"五、看谁说得好","ref":["（示例）\n电视广告：优势是形象生动、有声音有画面、覆盖面广、影响力大；不足是制作费和播出费高，尤其是好时段。\n报纸广告：优势是价格比电视便宜得多，可以详细介绍产品，可以多次刊登；不足是表现形式比较单一，年轻读者越来越少。\n网络广告：优势是成本低、传播快、可以和消费者互动、能找准目标客户；不足是信息太多，容易被忽略，有的消费者不太信任。\n结论：经费不充足时，可以“报纸＋互联网”结合使用。"],"note":"示例，答案不唯一"},{"s":"duihua_lianxi","t":"四、完成对话","ref":["很好地把视觉和音乐结合起来","过于注重技术和产品本身，不免忽略了消费者本身的需求","展现产品的特色\n强化产品在消费者心目中的品牌形象","充分考虑消费者的需求",null,"在报纸上刊登广告\n如果报社能给我们一些优惠",null,"我们的目标消费者更习惯看报纸（网络广告的效果还不好确定）",null],"note":"答案不唯一，据本课会话"},{"s":"kewen_lianxi","t":"七、看谁写得好","ref":["（示例）\n广告词：呼吸每一口，都是清新！——××空气净化器\n正文：三重过滤，99%去除PM2.5；超静音设计，夜里也能安睡；智能显示空气质量，一键操作。给家人一个看得见的好空气。\n（产品数据为示例，需按实际产品填写）"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"三、连词成句","ref":["与其选择昂贵的电视广告，不如选择便宜的网络广告。","新技术使得工作效率明显提高。","目前的广告模式以消费为中心。"]},{"s":"kewen_lianxi","t":"五、看谁说得好","ref":["图1（“酒香不怕巷子深”）：产品力阶段（1979—1983）。产品供不应求，商家认为质量本身就是广告，即使做广告也只是“告知式”。\n图2（健力宝）：文化力阶段（1984—1993）。借助民族文化，尤其是体育领域里体现出的爱国精神来推销产品，民族情感成为卖点。\n图3（脑白金）：媒介力阶段（1994—1997）。企业不惜重金在中央电视台等重要媒体投放广告，出现“明星品牌”，后来消费者对广告的信任度下降。\n图4（青岛啤酒）：品牌力阶段（2004年至今）。商家更为理性，以积累品牌资本为主要目的，民族品牌开始走向世界。\n（营销力阶段1998—2003无配图。）"],"note":"据课文，表述可不同","items":{"0":"图 1　图 2　图 3　图 4"},"figs":{"0":[{"src":"L08-kw5-fig1.jpg","cap":"图1","desc":"“酒香不怕巷子深”","page":151},{"src":"L08-kw5-fig2.jpg","cap":"图2","desc":"健力宝","page":151},{"src":"L08-kw5-fig3.jpg","cap":"图3","desc":"脑白金广告","page":151},{"src":"L08-kw5-fig4.jpg","cap":"图4","desc":"青岛啤酒广告","page":152}]}},{"s":"kewen_lianxi","t":"六、看谁演得好","ref":[null,"【示例对话】\n经理：夏天就要来了，我们公司的新啤酒想在腾讯网上做广告。我们的啤酒用百年酵母，口感清爽，价格比同类产品低，卖点是“清爽一夏”。\n总监：欢迎！和电视、报纸相比，我们网站用户多、传播快，还能根据年龄、地区精准投放；我们的设计团队也很有经验。首页广告一周××万元。\n经理：这个价格有点高。况且我们是第一次合作，能不能优惠一些？\n总监：与其只投一周，不如投一个月，那样我们可以给您打九折。\n经理：九折还是高了点，八五折可以吗？如果效果好，明年我们还会继续合作。\n总监：好吧，就按八八折，这是我们最大的优惠了。\n经理：成交！"],"note":"示例，价格等为虚拟"},{"s":"kewen_lianxi","t":"四、完成对话","ref":[null,"重金在重要媒体上投放广告",null,"产品本身的质量更重要（“酒香不怕巷子深”）\n产品（服务）的信息\n文化",null,"消费者（商家）变得更为理性\n质量；基础（成功的基础）"],"note":"答案不唯一，据课文"}],"yyd":[{"s":"duihua_yuyandian","n":"1","ref":"(1) 可见那个会议非常重要。\n(2) 可见我们的新产品很受欢迎。"},{"s":"duihua_yuyandian","n":"2","ref":"(1) 他总觉得自己能力超强，不免有些骄傲。\n(2) 这次研发的新产品过于重视外表，难免忽略了实用性。\n(3) 公司里同事之间免不了有些矛盾，你不要太过在意。"},{"s":"duihua_yuyandian","n":"3","ref":"(1) 展现\n(2) 展示\n(3) 展现"},{"s":"duihua_yuyandian","n":"4","ref":"(1) 至少有一百多家大公司参加了\n(2) 至少不发烧了\n(3) 你生病了，他至少应该来看看你吧（答案不唯一）"},{"s":"duihua_yuyandian","n":"5","ref":"(1) 况且我是开车去，一定能按时赶到。\n(2) 何况价格也不贵，你就买了吧。"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 宣传\n(2) 宣扬\n(3) 宣传\n(4) 宣扬"},{"s":"kewen_yuyandian","n":"2","ref":"(1) 熬夜也好，加班也罢，总算是写完了。\n(2) 生病也好，不生病也罢，我都得去参加会议。\n(3) 检查也好，不检查也罢，咱们都应该认真工作。"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 反映\n(2) 反应\n(3) 反应"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 不如把钱用在提高产品质量上。\n(2) 与其招一个不满意的人，不如空着岗位不招人。"},{"s":"kewen_yuyandian","n":"5","ref":"(1) 我下面以麦当劳为例来说明一下。\n(2) 我们班的留学生以韩国人为主。\n(3) 我认为以国产品牌为代表的智能手机性价比最高。（示例，答案不唯一）"}]},{"id":9,"t":"市场调查","ex":[{"s":"lijie","t":"二、回答问题","ref":["根据去年的业绩来分析一下今年公司所面临的形势。","很好。与其他公司相比，同比增长了15个百分点。","产品主要针对女性，外观设计得很漂亮，还有一些附加功能，而且价格也不太高。","下半年要针对年轻人推出一款有竞争力的新产品，定位要紧紧围绕年轻人追求时尚的特点。","因为仅凭感性认识是不够的，市场的情况和消费者的需求会随时变化，必须了解最新的市场情况，确保充分了解目标消费群。","（会话未直接说明，据会话归纳）问卷要紧紧围绕目标消费群（年轻人）的特点和需求来设计，了解最新的市场情况；方案要先写草稿，开会讨论后再定；除了发放问卷，遇到有代表性的客户最好进行录音采访。"],"note":"第6题为据会话归纳，答案不唯一"},{"s":"duihua_lianxi","t":"三、连词成句","ref":["新产品的成功得益于对市场的调查。","我们会对这个问题加以认真考虑。","中国是中国，美国是美国，情况是不一样的。"]},{"s":"duihua_lianxi","t":"五、看谁演得好","ref":[null,null,"【示例对话】\n小王：王总，这是手机市场调查的方案。我们打算调查三个方面：消费者喜欢什么品牌和外观、最看重哪些功能、期望的价位是多少。\n总经理：调查对象是谁？\n小王：主要是18到30岁的年轻人，在网站上发放问卷，大约1000份。\n总经理：仅凭网上问卷还不够，年龄大一点的客户也要调查。另外，遇到有代表性的客户，最好进行录音采访。\n小王：好的，我会加以修改，下周五之前把新方案交给您。"],"note":"示例，答案不唯一"},{"s":"duihua_lianxi","t":"四、完成对话","ref":["分析一下销量下降的原因\n外观设计（价格）\n仅凭感性认识还是不够的\n了解最新的市场情况和消费者的需求\n做市场调查\n负责这次调查"],"note":"答案不唯一，按空格顺序"},{"s":"kewen_lianxi","t":"七、看谁写得好","ref":["【示例：雷克萨斯美国市场调查问卷】\n您好！为了更好地了解您对豪华轿车的需求，请您花几分钟填写这份问卷，谢谢！\n1. 您的年龄：□25岁以下　□25—40岁　□41—55岁　□55岁以上\n2. 您目前开的车是：□奔驰　□宝马　□林肯　□其他＿＿\n3. 您购买现在这辆车的主要原因是：□品质　□外观　□性能　□安全　□品牌　□价格\n4. 您对现在的车最不满意的地方是：＿＿＿＿\n5. 您购买豪华车时最看重：□品质可靠　□外形时尚　□空间宽敞　□售后服务\n6. 您能接受的价格：□3万美元以下　□3万—5万美元　□5万美元以上\n7. 您的业余爱好：□高尔夫　□旅游　□音乐　□其他＿＿\n8. 如果有一个新的豪华品牌，品质更好、价格更合理，您会考虑购买吗？□会　□可能会　□不会\n（据课文：了解豪车车主的定位、生活方式、业余爱好和不满意之处）"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"三、连词成句","ref":["中国企业也好，外资企业也好，都要遵守规则。","雷克萨斯一旦进入豪车市场，就必须和宝马竞争。","他简直是个中国通。","他凭借自己的努力获得了成功。"]},{"s":"kewen_lianxi","t":"五、看谁说得好","ref":[null,"（示例）定位：把雷克萨斯定位为“集各家之长”的豪华车——像奔驰一样品质好、坚固耐用，像宝马一样时尚、操控好，像沃尔沃一样安全可靠，同时外形有吸引力、内部空间宽敞、服务周到，价格比奔驰、宝马更有竞争力。\n成功原因（据课文）：①投入10亿美元、用6年时间研发，对450款车型进行分析，保证了卓越的性能；②对奔驰、宝马、林肯等豪车车主进行市场调查，满足他们的需求，改进他们不满意的地方；③重视潜在消费者（想买更高档丰田车的年轻人）；④使用新品牌，不叫丰田。"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"六、看谁演得好","ref":[null,null,null,"【示例对话】\n总经理：我们要设计一款新手机，和苹果、三星竞争，你有什么想法？\n研发经理：我想借鉴雷克萨斯的经验。首先要做市场调查，了解苹果、三星用户最满意和最不满意的地方。\n总经理：然后呢？\n研发经理：我们的手机要集它们的优点：外观时尚、拍照好、系统流畅；同时改进它们的不足，比如电池更耐用、价格更合理、售后服务更周到。\n总经理：一旦推出，就必须以顶级品牌为对手，质量一定要过硬。\n研发经理：明白，我们会加大研发投入，保证卓越的性能。"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"四、完成对话","ref":["跻身世界顶级豪车之列（成功占领高级轿车市场）\n进行了分析（对450款车型进行了分析）\n分析潜在的消费者\n（课文未提及，可自由发挥）豪华（Luxury）与卓越品质\n（课文未提及，可自由发挥）如“专注完美，近乎苛求”"],"note":"前三空据课文；后两空课文未涉及，答案不唯一"}],"yyd":[{"s":"duihua_yuyandian","n":"1","ref":"(1) 促进\n(2) 促使\n(3) 促进\n(4) 促使"},{"s":"duihua_yuyandian","n":"2","ref":"(1) 我的成功得益于家人的支持。\n(2) 中国的发展得益于改革开放政策。"},{"s":"duihua_yuyandian","n":"3","ref":"(1) 昨天是昨天，今天是今天\n(2) 他是他，我是我"},{"s":"duihua_yuyandian","n":"4","ref":"(1) 不过我们已经在加以改进了。\n(2) 回去我会对这些地方加以说明（修改）。"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 我们公司一旦有合适的机会，就会涉足房地产领域。\n(2) （示例）我觉得不会。学过的东西一旦记住了，就很难忘记。"},{"s":"kewen_yuyandian","n":"2","ref":"(1) 它凭借靠海的地理优势使经济快速发展。\n(2) 苹果公司凭借不断创新和精美的设计取得了成功。"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 简直跟中国人一样\n(2) 他简直是个工作狂，每天只知道工作。"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 细心\n(2) 细致"},{"s":"kewen_yuyandian","n":"5","ref":"(1) 机会\n(2) 机遇"}]},{"id":10,"t":"商务谈判","ex":[{"s":"lijie","t":"回答问题","ref":["质量很好。产品连续八年获得ISO国际产品质量认证，基地园区2013年被北京市政府评为“标准化生产示范基地”，而且采用国际领先的独家制作工艺。","暂定采购特级产品2000件，目的港为新西兰琐加雷港口，时间为2014年12月15日之前。","主要是价格。新锐公司报价380美元／件，中天公司认为太高，他们的平均采购价只有200美元／件，最后提出210美元／件。","①请对方先看样品（“百闻不如一见”）；②强调产品的品质和独家制作工艺；③说明有很多国外销售商正在洽谈，条件更优越，而且对方在别处得不到这么大的供应量；④逐步让步（380→350→280美元／件），并提出另购一级产品的方案。","中天公司采购特级产品2200件，价格280美元／件；另购优质一级产品300件，价格200美元／件；所有产品按10%加成投保，保险费用由新锐公司承担。"]},{"s":"duihua_lianxi","t":"三、扩展练习","ref":["罕见 → 罕见的低价 → 市场上罕见的低价 → 这可是市场上罕见的低价\n遗憾 → 很遗憾 → 感到很遗憾 → 我们对此感到很遗憾 → 没能达成协议，我们感到很遗憾",null],"note":"示例，答案不唯一"},{"s":"duihua_lianxi","t":"五、完成句子","ref":["就质量来说，我们公司的产品要优于其他公司。","况且明天你还要上班呢","但是以后不见得也不好","即便你再怎么解释"],"note":"答案不唯一"},{"s":"duihua_lianxi","t":"六、看谁演得好","ref":[null,null,"【示例对话】\n经理：李主任，我们公司的新手机下个月上市，想在贵台黄金时段播出15秒广告，一个月，报价多少？\n主任：黄金时段每次××万元，一个月一共××万元。\n经理：这个价格未免太高了。况且我们是老客户，能不能优惠一些？\n主任：我们的收视率是全市最高的，这个价格是很合理的。\n经理：话是这么说，可是我们的经费确实有限。如果贵台能降价10%，我们愿意签一年的合同。\n主任：好吧，考虑到长期合作，就降8%，再送5次非黄金时段播出。\n经理：成交！"],"note":"示例，价格为虚拟"},{"s":"duihua_lianxi","t":"四、给下列词语选择合适的位置","ref":["B（在北京市企业评选中连续三次获得奖励）","B（是要根据市场的变化而进行的）","B（天气确实变暖了）","C（不然就很容易出现……）"]},{"s":"kewen_lianxi","t":"三、连词成句","ref":["吴经理和对方公司就广告的风格进行了洽谈。","如何妥善处理冲突就显得尤为重要。","我们不妨站在对方的立场，多替别人想一想。"]},{"s":"kewen_lianxi","t":"五、看谁说得好","ref":[null,null,"（示例）支持观点1：商务谈判不是要争出个输赢，而是不断化解冲突、实现双方最大利益的过程。你的利益以对方利益的存在为前提，只有双方都有“赢”的感觉，合作才能长久。分橙子的故事说明，只有事先沟通、申明各自的利益，才能使双方利益最大化。\n观点2的理由（可供辩论）：谈判中各方都想争取自己的利益，价格、条件上总有高低之分。\n小结：谈判要争取自己的合理利益，但最终目的应该是双赢。"],"note":"示例，答案不唯一"},{"s":"kewen_lianxi","t":"六、看谁写得好","ref":["【示例谈判脚本】\n地点：电视台会议室\n人物：王中（新锐公司）、李主任（电视台广告部）\n王中：李主任，您好！今天想就新产品广告的制作和播出问题跟您谈一谈。\n李主任：欢迎！制作费××万元，黄金时段播出每次××万元。\n王中：贵台的制作水平我们很信赖，只是这个报价未免太高了。况且我们是老客户，希望能有些优惠。\n李主任：我们的收视率很高，这个价格是合理的。\n王中：话是这么说，可是我们这次的经费不太充足。如果制作费能优惠10%，我们愿意连续播出三个月。\n李主任：考虑到长期合作，制作费可以优惠10%，但播出费不能降。\n王中：那能不能在非黄金时段多送几次播出？\n李主任：好吧，每周加送两次。\n王中：成交！希望我们合作愉快。"],"note":"示例，价格为虚拟"},{"s":"kewen_lianxi","t":"四、看谁读得准","ref":[null,"支付方式问题（用哪种信用证、由哪家银行议付）。","新方：签约后10天内开立不可撤销远期信用证，以美元结算，开证行、议付行由新方指定。\n中方：只接受即期信用证，议付行只能为中国工商银行，因为公司规模不大，无法承受很大风险。\n达成一致：新方提出各退一步——50%用即期信用证，剩下的用承兑交单；中方考虑到双方的友好关系，破例接受。"]}],"yyd":[{"s":"duihua_yuyandian","n":"2","ref":"(1) 吃归吃了，不过没吃饱。\n(2) 朋友归朋友，可是生意是生意。"},{"s":"duihua_yuyandian","n":"3","ref":"(1) 虽然是我的错，但你的话也未免太过分了。\n(2) 每斤只降低10元，贵方未免太没有诚意了吧！"},{"s":"duihua_yuyandian","n":"4","ref":"(1) 话是这么说，可是领导安排的工作，我也不能不做啊。\n(2) 话是这么说，可是现在竞争这么激烈，不做广告也不行啊。"},{"s":"kewen_yuyandian","n":"1","ref":"(1) 两国领导人就双边经贸合作问题交换了意见。\n(2) 大家就这个方案展开了激烈的争论。"},{"s":"kewen_yuyandian","n":"2","ref":"(1) 不太妥当\n(2) 很妥当\n(3) 妥善地\n(4) 已经办妥当了"},{"s":"kewen_yuyandian","n":"3","ref":"(1) 误区\n(2) 误会\n(3) 误区\n(4) 误会"},{"s":"kewen_yuyandian","n":"4","ref":"(1) 一味地追求低价导致公司损失巨大。\n(2) 我们不能一味地固守自己的立场。"},{"s":"kewen_yuyandian","n":"5","ref":"可循　可靠　可信　可爱　可惜　可怕（答案不唯一）"}]}];
  D.forEach(function (e) {
    var L = BOOK_DATA.lessons.filter(function (l) { return l.id === e.id && l.title === e.t; })[0];
    if (!L) return;
    e.ex.forEach(function (o) {
      var ex = (L[o.s] || []).filter(function (x) { return x.title === o.t; })[0];
      if (!ex) return;
      if (o.ref && !ex.ref && ex.items && o.ref.length === ex.items.length) { ex.ref = o.ref; if (o.note) ex.refNote = o.note; }
      if (o.items) Object.keys(o.items).forEach(function (k) { if (typeof ex.items[+k] === "string") ex.items[+k] = o.items[k]; });
      if (o.figs && !ex.figs) ex.figs = o.figs;
    });
    e.yyd.forEach(function (y) {
      var p = (L[y.s] || []).filter(function (x) { return x.num === y.n; })[0];
      if (p && !p.ref) { p.ref = y.ref; p.refNote = "答案不唯一，合理即可"; }
    });
  });
})();

<script>
/* 新商务汉语精读教程（上册）数字教材 — app.js */
(function () {
  "use strict";
  var DATA = BOOK_DATA;
  var LESSONS = DATA.lessons;
  var CN_NUM = ["一","二","三","四","五","六","七","八","九","十"];

  var S = { view: "home", lesson: 0, section: "daodu", fs: 1 };

  var SECTIONS = [
    ["daodu", "导读", "导入"],
    ["hexinjv", "核心句", "导入"],
    ["duihua", "会话", "对话部分"],
    ["lijie", "课后理解", "对话部分"],
    ["sc1", "生词", "对话部分"],
    ["yyd1", "语言点", "对话部分"],
    ["lx1", "课后练习", "对话部分"],
    ["kewen", "课文", "课文部分"],
    ["sc2", "生词", "课文部分"],
    ["yyd2", "语言点", "课文部分"],
    ["lx2", "综合练习", "课文部分"]
  ];

  var PALETTE = ["#2b5ea7", "#c0504d", "#4a7c3a", "#7c5aa6", "#b06f2e", "#2a8a8a", "#a03d6e", "#5a6b2d", "#8a6a1f", "#3d5a80"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function colorOf(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var uidc = 0;
  function uid() { return "w" + (++uidc); }

  var main = document.getElementById("main");
  var sidebar = document.getElementById("sidebar");

  /* ============ 侧边导航 ============ */
  function renderSidebar() {
    var h = '<div class="nav-group">教材</div>';
    h += '<div class="nav-item' + (S.view === "home" ? " active" : "") + '" data-nav="home"><span class="num">封</span>封面与简介</div>';
    h += '<div class="nav-group">课文（共十课）</div>';
    LESSONS.forEach(function (L, i) {
      h += '<div class="nav-item' + (S.view === "lesson" && S.lesson === i ? " active" : "") + '" data-nav="lesson" data-i="' + i + '">' +
        '<span class="num">' + CN_NUM[i] + '</span>' + esc(L.title) + "</div>";
    });
    h += '<div class="nav-group">附录</div>';
    h += '<button type="button" class="nav-item' + (S.view === "reallife" ? " active" : "") + '" data-nav="reallife"><span class="num">真</span>第1课 · 真实场景</button>';
    h += '<div class="nav-item' + (S.view === "chars" ? " active" : "") + '" data-nav="chars"><span class="num">人</span>人物列表</div>';
    h += '<div class="nav-item' + (S.view === "vocab" ? " active" : "") + '" data-nav="vocab"><span class="num">词</span>全书生词总表</div>';
    sidebar.innerHTML = h;
  }

  sidebar.addEventListener("click", function (e) {
    var t = e.target.closest(".nav-item");
    if (!t) return;
    var nav = t.getAttribute("data-nav");
    if (nav === "reallife" && window.BusinessWorkbench) { window.BusinessWorkbench.go({view:'reallife',lesson:1,section:'scene',scroll:0,anchor:null,open:[]}); return; }
    if (nav === "home") { S.view = "home"; }
    else if (nav === "chars") { S.view = "chars"; }
    else if (nav === "vocab") { S.view = "vocab"; }
    else if (nav === "lesson") { S.view = "lesson"; S.lesson = +t.getAttribute("data-i"); S.section = "daodu"; }
    render();
  });

  /* ============ 首页 ============ */
  function renderHome() {
    var m = DATA.meta;
    var h = '<div class="cover"><div class="cover-card">' +
      "<h1>" + esc(m.book) + "</h1>" +
      '<div class="en">' + esc(m.series) + "</div>" +
      '<div class="meta">' + esc(m.authors) + "<br>" + esc(m.publisher) + "</div>" +
      '<div class="tags"><span class="tag">新 HSK 四级以上适用</span><span class="tag">商务汉语</span><span class="tag">精读</span><span class="tag">数字交互教材</span></div>' +
      "</div></div>";
    h += '<div class="lesson-grid">';
    LESSONS.forEach(function (L, i) {
      var sc = L.duihua_shengci.length + L.kewen_shengci.length;
      var yyd = L.duihua_yuyandian.length + L.kewen_yuyandian.length;
      var ex = L.lijie.length + L.duihua_lianxi.length + L.kewen_lianxi.length;
      h += '<div class="lcard" data-lesson="' + i + '">' +
        '<div class="lnum">第' + CN_NUM[i] + "课 · LESSON " + (i + 1) + "</div>" +
        '<div class="ltitle">' + esc(L.title) + "</div>" +
        '<div class="lmeta"><span>生词 ' + sc + "</span><span>语言点 " + yyd + "</span><span>练习 " + ex + " 大题</span></div>" +
        "</div>";
    });
    h += "</div>";
    main.innerHTML = h;
  }

  /* ============ 人物列表 ============ */
  function renderChars() {
    var h = '<div class="lesson-head"><div class="kicker">CHARACTERS</div><h2>人物列表</h2>' +
      '<div class="en">新锐公司及其合作公司的主要人物，贯穿全书十课的对话场景。</div></div><div class="pgrid">';
    DATA.meta.characters.forEach(function (c) {
      h += '<div class="card pcard"><div class="avatar" style="background:' + colorOf(c.name) + '">' + esc(c.name[0]) + "</div>" +
        '<div><div class="pname">' + esc(c.name) + '</div><div class="prole">' + esc(c.role) + "</div></div></div>";
    });
    h += "</div>";
    main.innerHTML = h;
  }

  /* ============ 全书生词总表 ============ */
  var vocabRows = null;
  function renderVocabTable() {
    if (!vocabRows) {
      vocabRows = [];
      LESSONS.forEach(function (L) {
        L.duihua_shengci.forEach(function (w) { vocabRows.push([w.word, w.pinyin, w.pos, w.def, "第" + CN_NUM[L.id - 1] + "课·对话"]); });
        L.kewen_shengci.forEach(function (w) { vocabRows.push([w.word, w.pinyin, w.pos, w.def, "第" + CN_NUM[L.id - 1] + "课·课文"]); });
      });
    }
    var h = '<div class="lesson-head"><div class="kicker">VOCABULARY</div><h2>全书生词总表</h2>' +
      '<div class="en">共 ' + vocabRows.length + ' 个生词，按课次收录。输入汉字、拼音或词性可筛选。</div></div>' +
      '<div class="vtab"><input class="search" id="vsearch" placeholder="搜索生词 / 拼音 / 词性…">' +
      '<table><thead><tr><th style="width:14%">词语</th><th style="width:20%">拼音</th><th style="width:10%">词性</th><th>释义</th><th style="width:15%">出处</th></tr></thead><tbody id="vbody"></tbody></table></div>';
    main.innerHTML = h;
    function fill(rows) {
      document.getElementById("vbody").innerHTML = rows.map(function (r) {
        return "<tr><td><b>" + esc(r[0]) + "</b></td><td>" + esc(r[1]) + "</td><td>" + esc(r[2]) + "</td><td>" + esc(r[3]) + "</td><td>" + esc(r[4]) + "</td></tr>";
      }).join("");
    }
    fill(vocabRows);
    document.getElementById("vsearch").addEventListener("input", function () {
      var q = this.value.trim().toLowerCase();
      if (!q) return fill(vocabRows);
      fill(vocabRows.filter(function (r) { return r.join(" ").toLowerCase().indexOf(q) >= 0; }));
    });
  }

  /* ============ 课文视图 ============ */
  function secData(L, key) {
    switch (key) {
      case "daodu": return L.daodu;
      case "hexinjv": return L.hexinjv;
      case "duihua": return L.duihua;
      case "lijie": return L.lijie;
      case "sc1": return L.duihua_shengci;
      case "yyd1": return L.duihua_yuyandian;
      case "lx1": return L.duihua_lianxi;
      case "kewen": return L.kewen;
      case "sc2": return L.kewen_shengci;
      case "yyd2": return L.kewen_yuyandian;
      case "lx2": return L.kewen_lianxi;
    }
  }

  function renderLesson() {
    var L = LESSONS[S.lesson];
    var h = '<div class="subnav">';
    SECTIONS.forEach(function (s) {
      h += '<span class="chip' + (S.section === s[0] ? " active" : "") + '" data-sec="' + s[0] + '" title="' + s[2] + '">' +
        (s[2] === "课文部分" ? '<span class="part">②</span>' : s[2] === "对话部分" && (s[0] !== "duihua" && s[0] !== "lijie") ? '<span class="part">①</span>' : "") + esc(s[1]) + "</span>";
    });
    h += "</div>";
    h += '<div class="lesson-head"><div class="kicker">教材内容 · 第' + CN_NUM[S.lesson] + "课 · LESSON " + (S.lesson + 1) + "</div>" +
      "<h2>" + esc(L.title) + "</h2></div>";
    if (S.lesson === 0) h += '<div class="rl-entry-banner"><div><strong>把这一课带进真实生活</strong><p>看招聘、讲经历、回消息，再完成自己的求职作品。教材内容与补充材料分开标注。</p></div><button type="button" class="wb-button wb-primary" data-open-reallife>进入真实场景 →</button></div>';
    h += '<div class="section" id="sec-body"></div>';
    main.innerHTML = h;
    main.scrollTop = 0;
    renderSection();
  }

  function renderSection() {
    var L = LESSONS[S.lesson];
    var key = S.section;
    var body = document.getElementById("sec-body");
    var d = secData(L, key);
    if (key === "daodu") body.innerHTML = secTitle("导读", "导入") + renderDaodu(d);
    else if (key === "hexinjv") body.innerHTML = secTitle("核心句", "导入") + renderHexin(d);
    else if (key === "duihua") body.innerHTML = secTitle("会话", "对话部分") + renderDialogue(d);
    else if (key === "lijie") body.innerHTML = secTitle("课后理解", "对话部分") + renderExercises(d);
    else if (key === "sc1" || key === "sc2") body.innerHTML = secTitle("生词（" + d.length + " 个）", key === "sc1" ? "对话部分" : "课文部分") + renderVocab(d);
    else if (key === "yyd1" || key === "yyd2") body.innerHTML = secTitle("语言点（" + d.length + " 个）", key === "yyd1" ? "对话部分" : "课文部分") + renderYyd(d);
    else if (key === "kewen") body.innerHTML = secTitle("课文", "课文部分") + renderKewen(d);
    else if (key === "lx1" || key === "lx2") body.innerHTML = secTitle(key === "lx1" ? "课后练习" : "综合练习", key === "lx1" ? "对话部分" : "课文部分") + renderExercises(d);
    document.querySelectorAll(".subnav .chip").forEach(function (c) {
      c.classList.toggle("active", c.getAttribute("data-sec") === key);
    });
    main.scrollTop = 0;
    document.dispatchEvent(new CustomEvent("business-render"));
  }

  function secTitle(t, part) {
    return '<div class="sec-title">' + esc(t) + '<span class="part-tag">' + esc(part) + "</span></div>";
  }

  main.addEventListener("click", function (e) {
    if (e.target.closest('[data-open-reallife]') && window.BusinessWorkbench) { window.BusinessWorkbench.go({view:'reallife',lesson:1,section:'scene',scroll:0,anchor:null,open:[]}); return; }
    var chip = e.target.closest(".subnav .chip[data-sec]");
    if (chip) { S.section = chip.getAttribute("data-sec"); renderSection(); return; }
    var lc = e.target.closest(".lcard");
    if (lc) { S.view = "lesson"; S.lesson = +lc.getAttribute("data-lesson"); S.section = "daodu"; render(); return; }
  });

  /* ---- 导读 ---- */
  function renderDaodu(items) {
    var h = "";
    items.forEach(function (q, i) {
      h += '<div class="card qcard"><div class="qnum">' + (i + 1) + '</div><div><div class="qtext serif">' + esc(q) + "</div>" +
        '<div class="qhint">课堂导入讨论题 · 可组织学生两人一组讨论后全班分享</div></div></div>';
    });
    return h;
  }

  /* ---- 核心句 ---- */
  function renderHexin(items) {
    var h = '<div class="card">';
    items.forEach(function (s, i) {
      h += '<div class="key-s"><span class="knum">' + (i + 1) + ".</span><span>" + esc(s) + "</span></div>";
    });
    return h + "</div>";
  }

  /* ---- 会话 ---- */
  function renderDialogue(d) {
    var speakers = [];
    d.lines.forEach(function (l) {
      if (l.speaker !== "场景" && speakers.indexOf(l.speaker) < 0) speakers.push(l.speaker);
    });
    var h = '<div class="dlg-intro">' + esc(d.intro) + "</div>";
    h += '<div class="rolebar">角色扮演：点击角色标签可<b>遮住</b>该角色的台词（再点恢复），被遮台词单击可临时查看 — ';
    speakers.forEach(function (sp) {
      h += '<span class="rolechip" data-sp="' + esc(sp) + '" style="border-color:' + colorOf(sp) + ";color:" + colorOf(sp) + '">' + esc(sp) + "</span>";
    });
    h += "</div>";
    d.lines.forEach(function (l) {
      if (l.speaker === "场景") {
        h += '<div class="scene-line"><span>' + esc(l.text) + "</span></div>";
      } else {
        h += '<div class="bubble-row" data-speaker="' + esc(l.speaker) + '">' +
          '<div class="avatar" style="background:' + colorOf(l.speaker) + '">' + esc(l.speaker.replace(/^(小|老)/, "")[0]) + "</div>" +
          '<div class="bubble"><div class="who">' + esc(l.speaker) + '</div><div class="text serif">' + esc(l.text) + "</div></div></div>";
      }
    });
    return h;
  }

  /* ---- 生词 ---- */
  function renderVocabCards(items) {
    var h = '<div class="vtools">点击卡片翻转查看拼音与释义 <button class="mini-btn" id="flip-all">全部翻转</button></div><div class="vgrid">';
    items.forEach(function (w) {
      h += '<div class="vcard"><div class="vcard-inner">' +
        '<div class="vface front"><div class="vword">' + esc(w.word) + '</div><div class="vpos">' + esc(w.pos) + '</div><div class="vflip">点击翻面 ⟲</div></div>' +
        '<div class="vface back"><div class="vpinyin">' + esc(w.pinyin) + '　<span style="color:#a08c5a;font-size:12px">' + esc(w.pos) + '</span></div><div class="vdef">' + esc(w.def) + "</div></div>" +
        "</div></div>";
    });
    return h + "</div>";
  }
  function renderVocab(items) { return renderVocabCards(items); }

  /* ---- 语言点 ---- */
  function renderYyd(items) {
    var h = "";
    items.forEach(function (p) {
      h += '<div class="card lp"><button class="lp-head"><span class="lpnum">' + esc(p.num) + '</span><span class="lps serif">' + esc(p.sentence) + '</span><span class="arrow">▶</span></button>' +
        '<div class="lp-body">';
      (p.explanation || []).forEach(function (x) { h += '<p class="exp">' + esc(x) + "</p>"; });
      if (p.examples && p.examples.length) {
        h += '<div class="ex-list">';
        p.examples.forEach(function (x) { h += '<div class="ex serif">' + esc(x) + "</div>"; });
        h += "</div>";
      }
      if (p.extra) h += '<div class="extra">' + esc(p.extra) + "</div>";
      if (p.ref) h += renderRef({ ref: [p.ref], refNote: p.refNote }, 0);
      h += "</div></div>";
    });
    return h;
  }

  /* ---- 课文 ---- */
  function renderKewen(k) {
    var h = '<div class="card kewen-card"><h3>' + esc(k.title) + "</h3>";
    k.paragraphs.forEach(function (p) { h += "<p>" + esc(p) + "</p>"; });
    return h + "</div>";
  }

  /* ============ 练习 ============ */
  var TYPE_NAME = { judge: "判断对错", choice: "选择", fill: "选词填空", match: "词语连线", open: "开放练习" };

  function renderExercises(list) {
    var h = "";
    list.forEach(function (ex) {
      var wid = uid();
      h += '<div class="card ex-block" data-wid="' + wid + '" data-etype="' + ex.type + '">' +
        '<div class="ex-head"><span class="ex-title">' + esc(ex.title) + '</span><span class="ex-type">' + (TYPE_NAME[ex.type] || "练习") + "</span>";
      if (ex.type === "judge" || ex.type === "choice" || ex.type === "fill" || ex.type === "match") {
        h += '<span class="ex-score" data-score></span>';
      }
      if (ex.ref && ex.ref.filter(Boolean).length > 1) h += '<button type="button" class="ref-btn ref-all" data-ref-all aria-expanded="false">本题全部参考答案<span class="ref-arrow">▾</span></button>';
      h += "</div>";
      if (ex.intro) h += '<div class="ex-intro">' + esc(ex.intro) + "</div>";
      if (ex.type === "judge") h += renderJudge(ex);
      else if (ex.type === "choice") h += renderChoice(ex);
      else if (ex.type === "fill") h += renderFill(ex, wid);
      else if (ex.type === "match") h += renderMatch(ex, wid);
      else h += renderOpen(ex);
      h += "</div>";
    });
    return h;
  }

  function renderJudge(ex) {
    var h = "";
    ex.items.forEach(function (it, i) {
      h += '<div class="ex-item" data-judge="' + (it.answer === true ? "1" : it.answer === false ? "0" : "x") + '">' +
        '<span class="ex-q"><span class="qn">' + (i + 1) + ".</span>" + esc(it.text) + "</span>" +
        '<span class="judge-btns"><button class="jbtn" data-v="1">✓</button><button class="jbtn" data-v="0">✗</button></span>' +
        '<span class="fb"></span>' +
        (it.answer != null ? '<span class="ans-tag">答案：' + (it.answer ? "✓ 对" : "✗ 错") + "</span>" : "") +
        "</div>";
    });
    return h;
  }

  function renderChoice(ex) {
    var h = "";
    ex.items.forEach(function (it, i) {
      h += '<div class="ex-item" data-choice-ans="' + esc(it.answer || "") + '">' +
        '<div class="ex-q"><span class="qn">' + (i + 1) + ".</span>" + esc(it.text) + "</div><div>";
      (it.options || []).forEach(function (op) {
        var letter = op.trim().charAt(0);
        h += '<button class="opt-btn" data-letter="' + esc(letter) + '">' + esc(op) + "</button>";
      });
      h += '</div><span class="fb"></span>' + (it.answer ? '<span class="ans-tag">答案：' + esc(it.answer) + "</span>" : "") + "</div>";
    });
    return h;
  }

  function renderFill(ex, wid) {
    var bank = ex.bank || [];
    var h = "";
    if (bank.length) {
      h += '<div class="bank"><span style="font-size:12px;color:#8a94a6;line-height:2">备选词：</span>' +
        bank.map(function (b) { return '<span class="bw">' + esc(b) + "</span>"; }).join("") + "</div>";
    }
    ex.items.forEach(function (it, i) {
      var answers = Array.isArray(it.answer) ? it.answer : [it.answer];
      var parts = String(it.text).replace(/^\s*\d{1,2}\s*[．.、]\s*(?=（|\()/, "").split("___");
      var qhtml = "";
      for (var k = 0; k < parts.length; k++) {
        qhtml += esc(parts[k]);
        if (k < parts.length - 1) {
          var opts = shuffle(bank);
          qhtml += '<select class="blank-sel" data-ans="' + esc(answers[k] || "") + '"><option value="">（选词）</option>' +
            opts.map(function (b) { return '<option value="' + esc(b) + '">' + esc(b) + "</option>"; }).join("") + "</select>";
        }
      }
      h += '<div class="ex-item"><span class="ex-q"><span class="qn">' + (i + 1) + ".</span>" + qhtml + "</span>" +
        '<span class="fb"></span>' +
        (answers[0] ? '<span class="ans-tag">答案：' + esc(answers.join(" / ")) + "</span>" : "") + "</div>";
    });
    h += '<div style="margin-top:10px"><button class="mini-btn" data-check-fill>检查答案</button></div>';
    return h;
  }

  var matchState = {};
  function renderMatch(ex, wid) {
    var pairs = ex.items;
    var left = pairs.map(function (p) { return p[0]; });
    var right = shuffle(pairs.map(function (p) { return p[1]; }));
    matchState[wid] = { pairs: pairs, pickedL: null, pickedR: null, done: 0 };
    var h = '<div class="match-wrap" data-match="' + wid + '"><div class="mcol">';
    left.forEach(function (w) { h += '<div class="mitem" data-side="l" data-w="' + esc(w) + '">' + esc(w) + "</div>"; });
    h += '</div><div class="mcol">';
    right.forEach(function (w) { h += '<div class="mitem" data-side="r" data-w="' + esc(w) + '">' + esc(w) + "</div>"; });
    h += "</div></div>" +
      '<div style="margin-top:10px;font-size:12.5px;color:#8a94a6">先点左边一个词，再点右边与它搭配的词。' +
      '<button class="mini-btn" data-reset-match="' + wid + '" style="margin-left:10px">重置</button>' +
      '<span class="ans-line">正确搭配：' + pairs.map(function (p) { return esc(p[0]) + "—" + esc(p[1]); }).join("　") + "</span></div>";
    return h;
  }

  function renderRef(ex, idx) {
    var r = ex.ref && ex.ref[idx];
    if (!r) return "";
    var id = "ref-" + uid();
    return '<div class="ref-wrap"><button type="button" class="ref-btn" data-ref-toggle aria-expanded="false" aria-controls="' + id + '">显示参考答案<span class="ref-arrow">▾</span></button>' +
      '<div class="ref-ans" id="' + id + '"><div class="ref-inner"><div class="ref-card"><span class="ref-label">参考答案</span>' +
      (ex.refNote ? '<span class="ref-note">（' + esc(ex.refNote) + '）</span>' : "") + "\n" + esc(r) + "</div></div></div></div>";
  }

  /* 教材插图（assets/figures/，自教材 PDF 裁切） */
  function renderFigs(ex, idx) {
    var f = ex.figs && ex.figs[idx];
    if (!f || !f.length) return "";
    return '<div class="book-figs' + (f.length > 1 ? " multi" : "") + '">' + f.map(function (g) {
      return '<figure class="book-fig"><img src="assets/figures/' + esc(g.src) + '" alt="' + esc(g.cap + "　" + g.desc) + '" decoding="async">' +
        '<figcaption><b>' + esc(g.cap) + "</b>　" + esc(g.desc) + '<span class="fig-src" title="教材第' + esc(String(g.page)) + '页（PDF页码）">教材原图</span></figcaption></figure>';
    }).join("") + "</div>";
  }

  function renderOpen(ex) {
    var h = "", num = 0;
    var textCount = ex.items.filter(function (i) { return typeof i === "string" || i.kind === "text"; }).length;
    ex.items.forEach(function (it, idx) {
      if (typeof it === "string" || it.kind === "text") {
        num++;
        var txt = String(typeof it === "string" ? it : it.text);
        if (textCount > 1) txt = txt.replace(/^\s*\d{1,2}\s*[．.、]\s*/, "");
        h += '<div class="ex-item open-item"><span class="qn">' + (textCount > 1 ? num + "." : "") + '</span><span class="qt">' + esc(txt) + "</span></div>" + renderFigs(ex, idx) + renderRef(ex, idx);
      } else if (it.kind === "table") {
        h += renderBookTable(it) + renderRef(ex, idx);
      } else if (it.kind === "clipbox") {
        h += renderClipbox(it) + renderRef(ex, idx);
      }
    });
    return h;
  }

  function renderBookTable(t) {
    var h = '<table class="book-table">';
    if (t.caption) h += "<caption>" + esc(t.caption) + "</caption>";
    if (t.header) h += "<thead><tr>" + t.header.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead>";
    h += "<tbody>";
    t.rows.forEach(function (row) {
      h += "<tr>";
      row.forEach(function (cell, ci) {
        var obj = typeof cell === "object" ? cell : { t: cell };
        var tag = (!t.header && ci === 0 && typeof cell === "string") ? "th" : "td";
        var attrs = (obj.c ? ' colspan="' + obj.c + '"' : "") + (obj.r ? ' rowspan="' + obj.r + '"' : "");
        h += "<" + tag + attrs + ">" + esc(obj.t).replace(/\n/g, "<br>") + "</" + tag + ">";
      });
      h += "</tr>";
    });
    return h + "</tbody></table>";
  }

  function renderClipbox(b) {
    var h = '<div class="clipbox"><div class="clip-tab"></div><div class="clip-title serif">' + esc(b.title) + "</div>";
    if (b.lines) b.lines.forEach(function (l) { h += '<div class="clip-line">' + esc(l) + "</div>"; });
    if (b.blank) for (var i = 0; i < b.blank; i++) h += '<div class="clip-blank"></div>';
    return h + "</div>";
  }

  /* ---- 练习交互 ---- */
  function setRef(btn, panel, open) {
    if (!panel) return;
    panel.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.firstChild.nodeValue = open ? "隐藏参考答案" : "显示参考答案";
  }
  function syncRefAll(block) {
    var all = block.querySelector("[data-ref-all]");
    if (!all) return;
    var btns = block.querySelectorAll("[data-ref-toggle]");
    var opened = block.querySelectorAll('[data-ref-toggle][aria-expanded="true"]').length;
    var full = btns.length > 0 && opened === btns.length;
    all.setAttribute("aria-expanded", full ? "true" : "false");
    all.firstChild.nodeValue = full ? "收起本题参考答案" : "本题全部参考答案";
  }
  function updScore(block) {
    var el = block.querySelector("[data-score]");
    if (!el) return;
    var type = block.getAttribute("data-etype");
    if (type === "match") {
      var wid = block.getAttribute("data-wid");
      var st = matchState[wid];
      el.textContent = "已完成 " + st.done + " / " + st.pairs.length;
      return;
    }
    var items = block.querySelectorAll(".ex-item");
    var total = items.length, answered = 0, correct = 0;
    items.forEach(function (it) {
      var fb = it.querySelector(".fb");
      if (fb && fb.dataset.done) { answered++; if (fb.dataset.ok === "1") correct++; }
    });
    el.textContent = answered ? "已答 " + answered + " / " + total + " · 答对 " + correct : "";
  }

  main.addEventListener("click", function (e) {
    /* 语言点折叠 */
    var lpHead = e.target.closest(".lp-head");
    if (lpHead) { lpHead.parentElement.classList.toggle("open"); return; }

    /* 生词翻转 */
    var vc = e.target.closest(".vcard");
    if (vc) { vc.classList.toggle("flipped"); return; }
    if (e.target.id === "flip-all") {
      var cards = document.querySelectorAll(".vgrid .vcard");
      var allFlipped = cards.length && document.querySelectorAll(".vgrid .vcard.flipped").length === cards.length;
      cards.forEach(function (c) { c.classList.toggle("flipped", !allFlipped); });
      return;
    }

    /* 角色扮演遮罩 */
    var rc = e.target.closest(".rolechip");
    if (rc) {
      rc.classList.toggle("masked");
      var sp = rc.getAttribute("data-sp");
      var hide = rc.classList.contains("masked");
      document.querySelectorAll('.bubble-row[data-speaker="' + sp + '"] .text').forEach(function (t) {
        t.classList.toggle("masked", hide);
      });
      return;
    }
    var maskedText = e.target.closest(".text.masked");
    if (maskedText) {
      maskedText.style.filter = "none";
      setTimeout(function () { maskedText.style.filter = ""; }, 2500);
      return;
    }

    var block = e.target.closest(".ex-block");

    /* 开放题参考答案显隐 */
    var rb = e.target.closest("[data-ref-toggle]");
    if (rb) {
      var panel = document.getElementById(rb.getAttribute("aria-controls"));
      var willOpen = rb.getAttribute("aria-expanded") !== "true";
      setRef(rb, panel, willOpen);
      if (block) syncRefAll(block);
      return;
    }
    var ra = e.target.closest("[data-ref-all]");
    if (ra && block) {
      var openAll = ra.getAttribute("aria-expanded") !== "true";
      block.querySelectorAll("[data-ref-toggle]").forEach(function (b) { setRef(b, document.getElementById(b.getAttribute("aria-controls")), openAll); });
      syncRefAll(block);
      return;
    }

    /* 判断题 */
    var jb = e.target.closest(".jbtn");
    if (jb && block) {
      var item = jb.closest(".ex-item");
      var ans = item.getAttribute("data-judge");
      if (ans === "x") return;
      var v = jb.getAttribute("data-v");
      var ok = v === ans;
      item.querySelectorAll(".jbtn").forEach(function (b) {
        b.classList.remove("sel-ok", "sel-bad");
        if (b === jb) b.classList.add(ok ? "sel-ok" : "sel-bad");
      });
      var fb = item.querySelector(".fb");
      fb.textContent = ok ? "✓ 回答正确" : "✗ 再想一想";
      fb.className = "fb " + (ok ? "ok" : "bad");
      fb.dataset.done = "1"; fb.dataset.ok = ok ? "1" : "0";
      updScore(block);
      return;
    }

    /* 选择题 */
    var ob = e.target.closest(".opt-btn");
    if (ob && block) {
      var ci = ob.closest(".ex-item");
      var cans = ci.getAttribute("data-choice-ans");
      if (!cans) return;
      var cok = ob.getAttribute("data-letter") === cans;
      ci.querySelectorAll(".opt-btn").forEach(function (b) { b.classList.remove("sel-ok", "sel-bad"); });
      ob.classList.add(cok ? "sel-ok" : "sel-bad");
      var cfb = ci.querySelector(".fb");
      cfb.textContent = cok ? "✓ 回答正确" : "✗ 再想一想";
      cfb.className = "fb " + (cok ? "ok" : "bad");
      cfb.dataset.done = "1"; cfb.dataset.ok = cok ? "1" : "0";
      updScore(block);
      return;
    }

    /* 填空检查 */
    if (e.target.hasAttribute && e.target.hasAttribute("data-check-fill") && block) {
      var answeredF = 0, correctF = 0, totalF = 0;
      block.querySelectorAll(".blank-sel").forEach(function (sel) {
        totalF++;
        sel.classList.remove("ok", "bad");
        if (!sel.value) return;
        answeredF++;
        if (sel.value === sel.getAttribute("data-ans")) { sel.classList.add("ok"); correctF++; }
        else sel.classList.add("bad");
      });
      var sc = block.querySelector("[data-score]");
      if (sc) sc.textContent = totalF ? "已答 " + answeredF + " / " + totalF + " · 答对 " + correctF : "";
      return;
    }

    /* 连线题 */
    var mi = e.target.closest(".mitem");
    if (mi && block) {
      var mwid = mi.closest(".match-wrap").getAttribute("data-match");
      var st = matchState[mwid];
      if (!st || mi.classList.contains("done")) return;
      var side = mi.getAttribute("data-side");
      if (side === "l") {
        if (st.pickedL) st.pickedL.classList.remove("picked");
        st.pickedL = mi; mi.classList.add("picked");
      } else {
        if (st.pickedR) st.pickedR.classList.remove("picked");
        st.pickedR = mi; mi.classList.add("picked");
      }
      if (st.pickedL && st.pickedR) {
        var lw = st.pickedL.getAttribute("data-w"), rw = st.pickedR.getAttribute("data-w");
        var good = st.pairs.some(function (p) { return p[0] === lw && p[1] === rw; });
        if (good) {
          st.pickedL.classList.add("done"); st.pickedR.classList.add("done");
          st.done++;
        } else {
          [st.pickedL, st.pickedR].forEach(function (x) {
            x.classList.add("wrong");
            setTimeout(function () { x.classList.remove("wrong"); }, 350);
          });
        }
        st.pickedL.classList.remove("picked"); st.pickedR.classList.remove("picked");
        st.pickedL = st.pickedR = null;
        updScore(block);
      }
      return;
    }
    var rm = e.target.closest("[data-reset-match]");
    if (rm && block) {
      var rwid = rm.getAttribute("data-reset-match");
      var st2 = matchState[rwid];
      if (st2) {
        st2.done = 0; st2.pickedL = st2.pickedR = null;
        block.querySelectorAll(".mitem").forEach(function (x) { x.classList.remove("done", "picked", "wrong"); });
        updScore(block);
      }
      return;
    }
  });

  /* ============ 渲染入口 ============ */
  function render() {
    if (window.BusinessRealLife) window.BusinessRealLife.flush();
    if (S.view !== 'reallife' && !SECTIONS.some(function(x){return x[0]===S.section;})) S.section = 'daodu';
    renderSidebar();
    if (S.view === "home") renderHome();
    else if (S.view === "chars") renderChars();
    else if (S.view === "vocab") renderVocabTable();
    else if (S.view === "reallife" && window.BusinessRealLife) window.BusinessRealLife.render(main, S.section);
    else renderLesson();
    if (S.view !== "lesson") { main.scrollTop=0; document.dispatchEvent(new CustomEvent("business-render")); }
  }

  /* ============ 工具栏 ============ */
  document.getElementById("btn-ans").addEventListener("click", function () {
    document.body.classList.toggle("show-answers");
    this.classList.toggle("on", document.body.classList.contains("show-answers"));
  });
  document.getElementById("btn-fs-inc").addEventListener("click", function () {
    S.fs = Math.min(2, S.fs + 1);
    document.body.className = document.body.className.replace(/fs-\d/, "fs-" + S.fs);
  });
  document.getElementById("btn-fs-dec").addEventListener("click", function () {
    S.fs = Math.max(0, S.fs - 1);
    document.body.className = document.body.className.replace(/fs-\d/, "fs-" + S.fs);
  });
  document.getElementById("btn-full").addEventListener("click", function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });

  /* 计时器 */
  var timerIv = null, remain = 0;
  var timerPanel = document.getElementById("panel-timer");
  var timerDisp = document.getElementById("timer-disp");
  function fmt(s) {
    var m = Math.floor(Math.abs(s) / 60), ss = Math.abs(s) % 60;
    return (s < 0 ? "-" : "") + (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
  }
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 300, 600].forEach(function (d) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.001, ctx.currentTime + d / 1000);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + d / 1000 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d / 1000 + 0.25);
        o.start(ctx.currentTime + d / 1000); o.stop(ctx.currentTime + d / 1000 + 0.3);
      });
    } catch (e) {}
  }
  function tickT() {
    remain--;
    timerDisp.textContent = fmt(remain);
    if (remain <= 0) {
      clearInterval(timerIv); timerIv = null;
      timerDisp.classList.add("over");
      beep();
    }
  }
  document.getElementById("btn-timer").addEventListener("click", function () {
    timerPanel.classList.toggle("show");
    document.getElementById("panel-picker").classList.remove("show");
  });
  document.getElementById("timer-start").addEventListener("click", function () {
    if (timerIv) { clearInterval(timerIv); timerIv = null; this.textContent = "开始"; return; }
    if (remain <= 0) {
      var mins = parseFloat(document.getElementById("timer-min").value) || 5;
      remain = Math.round(mins * 60);
    }
    timerDisp.classList.remove("over");
    timerDisp.textContent = fmt(remain);
    timerIv = setInterval(tickT, 1000);
    this.textContent = "暂停";
  });
  document.getElementById("timer-reset").addEventListener("click", function () {
    clearInterval(timerIv); timerIv = null; remain = 0;
    timerDisp.classList.remove("over");
    timerDisp.textContent = "00:00";
    document.getElementById("timer-start").textContent = "开始";
  });

  /* 随机抽人 */
  var pickerPanel = document.getElementById("panel-picker");
  document.getElementById("btn-picker").addEventListener("click", function () {
    pickerPanel.classList.toggle("show");
    timerPanel.classList.remove("show");
  });
  document.getElementById("picker-go").addEventListener("click", function () {
    var chars = DATA.meta.characters;
    var disp = document.getElementById("picker-disp");
    var role = document.getElementById("picker-role");
    var n = 0, iv = setInterval(function () {
      var c = chars[Math.floor(Math.random() * chars.length)];
      disp.textContent = c.name;
      role.textContent = c.role;
      if (++n > 14) {
        clearInterval(iv);
        var f = chars[Math.floor(Math.random() * chars.length)];
        disp.textContent = f.name;
        role.textContent = f.role;
      }
    }, 70);
  });

  window.BusinessBook = {
    data: DATA, sections: SECTIONS,
    realLifeSections: [['scene','招聘会现场'],['notice','读真实招聘'],['evidence','用经历证明'],['message','回复面试通知'],['interview','面试表达实验'],['transfer','带走作品']],
    getState: function () { return {view:S.view,lesson:S.lesson+1,section:S.section,fs:S.fs}; },
    sectionData: function (lesson, key) { return secData(LESSONS[lesson-1],key); },
    go: function (loc) {
      S.view = ['home','chars','vocab','lesson','reallife'].indexOf(loc.view) >= 0 ? loc.view : 'lesson';
      S.lesson = Math.max(0,Math.min(LESSONS.length-1,(loc.lesson||1)-1));
      if (S.view === 'reallife') { S.lesson = 0; S.section = this.realLifeSections.some(function(x){return x[0]===loc.section;}) ? loc.section : 'scene'; }
      else S.section = SECTIONS.some(function(x){return x[0]===loc.section;}) ? loc.section : 'daodu';
      render();
    },
    setFont: function (n) { S.fs=n; if(window.BusinessReadingFont) window.BusinessReadingFont.apply(n); }
  };
  render();
})();
